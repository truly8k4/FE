<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hỏa Ấn 1: Kẻ Phản Bội – Bản Làm Lại</title>
<meta name="description" content="Hỏa Ấn 1: Kẻ Phản Bội - Bản làm lại bởi Tru Ly - Đỗ Đức Thông. Trò chơi chiến thuật nhập vai theo lượt phong cách Hỏa Ấn.">
<meta property="og:title" content="Hỏa Ấn 1: Kẻ Phản Bội – Bản Làm Lại">
<meta property="og:description" content="Hỏa Ấn 1: Kẻ Phản Bội - Bản làm lại bởi Tru Ly - Đỗ Đức Thông. Trò chơi chiến thuật nhập vai theo lượt phong cách Hỏa Ấn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #fbf9f4;
  --bg-bot: #ece3d3;
  --cut-sm: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
  --cut-md: polygon(10px 0%, calc(100% - 10px) 0%, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0% calc(100% - 10px), 0% 10px);
  --cut-lg: polygon(16px 0%, calc(100% - 16px) 0%, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0% calc(100% - 16px), 0% 16px);
  --cut-hex: polygon(12px 0%, calc(100% - 12px) 0%, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0% 50%);
  --cut-tab: polygon(8px 0%, calc(100% - 8px) 0%, 100% 100%, 0% 100%);
  --pn-bg: rgba(255, 255, 255, 0.94);
  --pn-glass: rgba(255, 255, 255, 0.82);
  --pn-border: rgba(212, 168, 67, 0.45);
  --pn-border-high: rgba(212, 168, 67, 0.9);
  --gold-pri: #d49a24;
  --gold-light: #fef3c7;
  --gold-glow: #f5d47a;
  --gold-deep: #7a540c;
  --gold-grad: linear-gradient(135deg, #f5cb5c, #d49a24);
  --azure-pri: #2563eb;
  --azure-bg: #eff6ff;
  --azure-border: rgba(37, 99, 235, 0.4);
  --crimson-pri: #dc2626;
  --crimson-bg: #fef2f2;
  --crimson-border: rgba(220, 38, 38, 0.4);
  --emerald-pri: #059669;
  --emerald-bg: #f0fdf4;
  --emerald-border: rgba(5, 150, 105, 0.4);
  --amethyst-pri: #7c3aed;
  --amethyst-bg: #f5f3ff;
  --amethyst-border: rgba(124, 58, 237, 0.4);
  --tx-pri: #18191c;
  --tx-sec: #4b5262;
  --tx-mut: #858d9c;
  --shadow-card: 0 8px 28px rgba(180, 130, 40, 0.12), 0 2px 6px rgba(0,0,0,0.03);
  --shadow-popup: 0 24px 64px rgba(120, 80, 20, 0.22), 0 6px 18px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font-family: inherit; }

html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100dvh; max-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(1300px 750px at 50% -10%, #eef2ff 0%, #fefcf8 45%, var(--bg-bot) 100%);
  color: var(--tx-pri);
  font: 14px/1.45 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column;
}

#celestial-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: 
    radial-gradient(circle at 15% 10%, rgba(245, 212, 122, 0.18) 0%, transparent 35%),
    radial-gradient(circle at 85% 85%, rgba(147, 197, 253, 0.2) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 60%);
}

/* TOP HUD */
#hud {
  position: relative; z-index: 10;
  height: 52px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--pn-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--pn-border);
  box-shadow: 0 2px 12px rgba(180, 130, 40, 0.08);
}

.brand-icon {
  width: 36px; height: 36px;
  clip-path: var(--cut-sm);
  display: grid; place-items: center;
  background: var(--gold-grad);
  color: #fff; font-size: 18px;
  box-shadow: 0 3px 12px rgba(212, 154, 36, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.8);
  flex-shrink: 0;
}

.hud-title {
  display: flex; flex-direction: column; justify-content: center; line-height: 1.15;
  margin-right: 4px;
}
.hud-title small {
  font-family: 'Playfair Display', serif; font-size: 10.5px; font-weight: 700;
  color: var(--gold-pri); letter-spacing: 0.08em; text-transform: uppercase;
}
.hud-title b {
  font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 800;
  color: var(--tx-pri); white-space: nowrap;
}

/* GIAO DIỆN HIỆP ĐẤU & LƯỢT (TURN HERALD) - GÓC CẠNH HOÀNG GIA */
.turn-herald {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 16px;
  clip-path: var(--cut-hex);
  font-family: 'Playfair Display', serif;
  user-select: none; flex-shrink: 0;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  position: relative;
}
.turn-herald.player-phase {
  background: linear-gradient(135deg, #091e45 0%, #1e40af 50%, #2563eb 100%);
  border: 1px solid #f5cb5c;
  box-shadow: 0 0 16px rgba(37, 99, 235, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.turn-herald.enemy-phase {
  background: linear-gradient(135deg, #450a0a 0%, #991b1b 50%, #dc2626 100%);
  border: 1px solid #fca5a5;
  box-shadow: 0 0 18px rgba(220, 38, 38, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.turn-phase-sigil {
  display: flex; align-items: center; gap: 5px;
  font-weight: 800; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.turn-herald.player-phase .turn-phase-sigil { color: #fef08a; }
.turn-herald.enemy-phase .turn-phase-sigil { color: #fecaca; }
.turn-sigil-icon { font-size: 13px; }
.turn-herald-divider { color: rgba(255, 255, 255, 0.45); font-size: 10px; }
.turn-counter-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(0, 0, 0, 0.35); padding: 2px 10px;
  clip-path: polygon(5px 0%, calc(100% - 5px) 0%, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0% 50%);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 12px;
}
.turn-counter-badge .turn-k {
  color: rgba(255, 255, 255, 0.7); font-size: 10px; letter-spacing: 0.06em;
}
.turn-counter-badge .turn-v {
  color: #fde047; font-family: 'Playfair Display', serif; font-size: 13.5px;
}

.hud-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; clip-path: var(--cut-sm);
  font-size: 12px; font-weight: 700;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--pn-border);
  color: var(--tx-sec);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  white-space: nowrap;
}
.hud-pill.gold-pill { background: #fffbeb; border-color: rgba(245, 158, 11, 0.55); color: var(--gold-deep); font-variant-numeric: tabular-nums; }
.hud-pill.biome-pill { background: var(--emerald-bg); border-color: var(--emerald-border); color: var(--emerald-pri); cursor: pointer; }

.hud-spacer { flex: 1; }

/* NÚT BẤM GÓC CẠNH & KỲ ẢO (ANGULAR FANTASY BUTTONS) */
.btn {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 12px; font-weight: 700;
  padding: 7px 14px;
  clip-path: var(--cut-sm);
  border: 1px solid rgba(212, 168, 67, 0.65);
  background: linear-gradient(180deg, #ffffff 0%, #fbf8f0 100%);
  color: var(--tx-pri);
  cursor: pointer; transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 2px 6px rgba(180, 130, 40, 0.08);
  white-space: nowrap; flex-shrink: 0;
  position: relative;
}
.btn:hover {
  background: #ffffff;
  border-color: var(--gold-pri);
  box-shadow: 0 4px 14px rgba(212, 154, 36, 0.24);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.pri {
  background: linear-gradient(135deg, #eab308 0%, #d97706 50%, #b45309 100%);
  border: 1px solid #fde047;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.btn.pri:hover {
  background: linear-gradient(135deg, #facc15 0%, #d97706 60%, #92400e 100%);
  box-shadow: 0 6px 20px rgba(217, 119, 6, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.btn.danger {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  border-color: #fca5a5;
  color: #fff;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
}
.btn.icon-only { padding: 7px 11px; }

/* MAIN ARENA */
#main {
  position: relative; z-index: 5;
  flex: 1; min-height: 0;
  display: flex; overflow: hidden;
}

#stage {
  flex: 1; min-width: 0; min-height: 0;
  overflow: hidden; display: flex;
  align-items: center; justify-content: center;
  padding: 8px; position: relative;
}

#wrap {
  position: relative; margin: auto;
  display: flex; align-items: center; justify-content: center;
}

canvas#cv {
  display: block;
  image-rendering: pixelated;
  border-radius: var(--radius-md);
  box-shadow: 0 16px 48px rgba(120, 80, 20, 0.2), 0 0 0 2px var(--pn-border-high);
  background: #101216;
  touch-action: manipulation;
}

/* Floating Action Menu */
#menu {
  position: absolute; display: none;
  flex-direction: column; gap: 6px;
  padding: 10px;
  background: var(--pn-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--pn-border-high);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popup);
  z-index: 30;
  animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
#menu button {
  border-radius: 9px; text-align: left;
  padding: 8px 14px;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* SIDEBAR COMMAND CONSOLE */
#side {
  flex: 0 0 320px;
  background: var(--pn-bg);
  backdrop-filter: blur(18px);
  border-left: 1px solid var(--pn-border);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: -4px 0 20px rgba(160, 120, 40, 0.05);
}

.side-header {
  padding: 8px 10px;
  border-bottom: 1px solid var(--pn-border);
  display: flex; gap: 4px; background: rgba(255, 255, 255, 0.6);
}
.side-tab-btn {
  flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 700;
  border: none; background: transparent; color: var(--tx-sec);
  clip-path: var(--cut-tab); cursor: pointer; transition: 0.15s;
  font-family: inherit;
}
.side-tab-btn.active {
  background: #ffffff; color: var(--gold-deep);
  box-shadow: 0 2px 6px rgba(180, 130, 40, 0.15);
  border-top: 2px solid var(--gold-pri);
}

.side-body {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.side-body::-webkit-scrollbar { width: 5px; }
.side-body::-webkit-scrollbar-thumb { background: rgba(212, 168, 67, 0.3); border-radius: 4px; }

/* Light Fantasy Status Cards */
.card-unit {
  position: relative;
  display: flex; gap: 10px; align-items: center;
  padding: 10px; border-radius: var(--radius-md);
  background: #ffffff;
  border: 1px solid var(--pn-border);
  box-shadow: var(--shadow-card);
}
.card-unit.pl { border-left: 4px solid var(--azure-pri); }
.card-unit.en { border-left: 4px solid var(--crimson-pri); }
.card-unit.al { border-left: 4px solid var(--emerald-pri); }

.unit-avatar {
  width: 48px; height: 48px; border-radius: 10px;
  background: radial-gradient(circle, #fff, #eedfc2);
  border: 1px solid var(--pn-border);
  display: grid; place-items: center;
  overflow: hidden; flex-shrink: 0;
}
.unit-avatar img {
  image-rendering: pixelated; width: 44px; height: 40px;
  object-fit: cover;
}

.unit-meta h4 {
  margin: 0; font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 800;
  color: var(--tx-pri);
}
.unit-meta small {
  color: var(--tx-sec); font-size: 12px; font-weight: 600;
}

.meter-group { display: flex; flex-direction: column; gap: 2px; }
.meter-label { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; color: var(--tx-sec); }
.meter-bar {
  height: 7px; background: rgba(0, 0, 0, 0.08);
  border-radius: 999px; overflow: hidden;
}
.meter-bar i {
  display: block; height: 100%; border-radius: 999px;
  transition: width 0.3s ease;
}
.meter-bar i.hp-green { background: linear-gradient(90deg, #10b981, #34d399); }
.meter-bar i.hp-red { background: linear-gradient(90deg, #ef4444, #f87171); }
.meter-bar i.exp-blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

.stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
}
.stat-box {
  background: #ffffff; border: 1px solid rgba(212, 168, 67, 0.25);
  border-radius: 8px; text-align: center; padding: 4px 2px;
}
.stat-box small { display: block; font-size: 10px; font-weight: 700; color: var(--tx-mut); text-transform: uppercase; }
.stat-box b { font-size: 14px; font-weight: 800; color: var(--tx-pri); font-variant-numeric: tabular-nums; }

.inv-list { display: flex; flex-direction: column; gap: 4px; }
.inv-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 9px; border-radius: 6px;
  background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.05);
  font-size: 12px; font-weight: 600;
}
.inv-item.equipped {
  background: #fffbeb; border-color: rgba(212, 154, 36, 0.4);
  color: var(--gold-deep); font-weight: 700;
}
.inv-item i { font-style: normal; font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums; }

.side-log {
  flex: 1; font-size: 12px; color: var(--tx-sec);
  display: flex; flex-direction: column; gap: 4px;
}
.side-log div {
  padding: 4px 0; border-bottom: 1px dashed rgba(212, 168, 67, 0.25);
  line-height: 1.35;
}

.objective-box {
  background: #fffbeb; border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: var(--radius-sm); padding: 8px 10px;
  font-size: 12px; color: var(--gold-deep); line-height: 1.4;
}

/* MODAL / DIALOG */
#modal {
  position: fixed; inset: 0;
  background: rgba(18, 15, 25, 0.65);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 16px; z-index: 100;
}
#modal.on { display: flex; }

#box {
  background: linear-gradient(180deg, #ffffff 0%, #faf6ec 100%);
  border: 1px solid var(--pn-border-high);
  clip-path: var(--cut-lg);
  max-width: 620px; width: 100%; max-height: 90dvh;
  overflow-y: auto; padding: 24px;
  box-shadow: 0 24px 64px rgba(120, 80, 20, 0.28), 0 0 0 1px rgba(212, 168, 67, 0.3);
  animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
#box::-webkit-scrollbar { width: 6px; }
#box::-webkit-scrollbar-thumb { background: rgba(212, 168, 67, 0.4); border-radius: 4px; }

#box h3 {
  margin: 0 0 14px;
  font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 800;
  color: var(--gold-deep);
  border-bottom: 1px solid var(--pn-border);
  padding-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}

/* THẺ THOẠI GÓC CẠNH TINH THỂ (CRYSTAL DIALOGUE SYSTEM) */
.dlg-speaker-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; margin-bottom: 8px;
  clip-path: var(--cut-sm);
  font-size: 12.5px; font-weight: 800;
  letter-spacing: 0.05em; text-transform: uppercase;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.dlg-speaker-tag.blue {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #ffffff; border: 1px solid #93c5fd;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.35);
}
.dlg-speaker-tag.red {
  background: linear-gradient(135deg, #991b1b, #dc2626);
  color: #ffffff; border: 1px solid #fca5a5;
  box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
}
.dlg-speaker-tag.green {
  background: linear-gradient(135deg, #065f46, #059669);
  color: #ffffff; border: 1px solid #6ee7b7;
}
.dlg-speaker-tag.gold {
  background: linear-gradient(135deg, #92400e, #d97706);
  color: #ffffff; border: 1px solid #fde047;
}
.dlg-speaker-tag.purple {
  background: linear-gradient(135deg, #5b21b6, #7c3aed);
  color: #ffffff; border: 1px solid #c4b5fd;
}

.box-row { display: flex; gap: 14px; align-items: flex-start; }
.dlg-portrait-wrap {
  width: 108px; height: 140px; flex: none;
  clip-path: var(--cut-md);
  border: 2px solid var(--gold-glow);
  background: #f7f1e6;
  position: relative;
  box-shadow: 0 4px 14px rgba(180, 130, 40, 0.25);
  overflow: hidden;
}
.dlg-portrait-wrap.blue { border-color: #3b82f6; box-shadow: 0 0 16px rgba(59, 130, 246, 0.4); }
.dlg-portrait-wrap.red { border-color: #ef4444; box-shadow: 0 0 16px rgba(239, 68, 68, 0.4); }
.dlg-portrait-wrap.green { border-color: #10b981; }
.dlg-portrait-wrap img {
  image-rendering: pixelated; width: 100%; height: 100%;
  object-fit: cover;
}
.box-desc { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; color: var(--tx-pri); flex: 1; }

.box-list { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; }
.box-list button {
  clip-path: var(--cut-sm); text-align: left;
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 10px 14px;
}

/* RESPONSIVE PANORAMIC VIEWPORT - ZERO SCROLL PROMISE */
@media (max-width: 820px), (max-aspect-ratio: 1/1) {
  #main { flex-direction: column; }
  #side {
    flex: 0 0 auto; max-height: 35%;
    border-left: none; border-top: 1px solid var(--pn-border);
  }
  #stage { padding: 4px; }
  .hud-title small { display: none; }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 480px) {
  #hud { padding: 4px 8px; gap: 4px; height: 48px; }
  .hud-title b { font-size: 13px; }
  .btn { padding: 5px 9px; font-size: 11.5px; }
  .hud-pill { padding: 3px 6px; font-size: 10.5px; }
}

/* Forecast Table */
.forecast-table {
  width: 100%; border-collapse: collapse; margin: 10px 0;
  text-align: center; font-size: 13.5px;
}
.forecast-table td {
  padding: 6px 8px; border-bottom: 1px solid rgba(212, 168, 67, 0.2);
}
.forecast-table tr:last-child td { border-bottom: none; }
.forecast-val { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }

/* Achievement Grid */
.achieve-grid {
  display: grid; grid-template-columns: 1fr; gap: 8px;
}
.achieve-card {
  padding: 10px; border-radius: 10px; background: #ffffff;
  border: 1px solid var(--pn-border);
  display: flex; gap: 10px; align-items: center;
}
.achieve-card.unlocked {
  background: #fffdf5; border-color: rgba(212, 154, 36, 0.6);
  box-shadow: 0 4px 14px rgba(212, 154, 36, 0.15);
}
.achieve-icon {
  font-size: 26px; width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; background: #fdf6e7;
  border: 1px solid rgba(212, 154, 36, 0.3); flex-shrink: 0;
}
.achieve-info { flex: 1; }
.achieve-info h5 { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--tx-pri); }
.achieve-info p { margin: 0; font-size: 12px; color: var(--tx-sec); }

/* ===================== GIAO DIỆN FANTASY GÓC CẠNH ===================== */
:root{--ink:#0b1022;--ink2:#1a2350;--gold:#d9a032;--gold-hi:#f6dc8e;--ivory:#fbf6e8;--ivory2:#efe2c3;--cn-g:#d9a032;--display:'Philosopher','Playfair Display',serif;
--cn:linear-gradient(135deg,var(--cn-g) 0 7px,#0000 0) 0 0/51% 51% no-repeat,linear-gradient(225deg,var(--cn-g) 0 7px,#0000 0) 100% 0/51% 51% no-repeat,linear-gradient(315deg,var(--cn-g) 0 7px,#0000 0) 100% 100%/51% 51% no-repeat,linear-gradient(45deg,var(--cn-g) 0 7px,#0000 0) 0 100%/51% 51% no-repeat}
html,body{background:var(--ink)}
#celestial-bg{display:none}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:currentColor;flex:none}
.btn:not(.pri):not(.danger) .ic,h3 .ic{color:#a8730f}
#hud .btn:not(.pri) .ic{color:var(--gold-hi)}
#hud{height:54px;background:linear-gradient(180deg,var(--ink2),var(--ink));border-bottom:0;box-shadow:0 3px 0 var(--gold),0 8px 22px rgba(0,0,0,.5)}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:6px;pointer-events:none;background:conic-gradient(from -45deg at 50% 100%,var(--gold) 0 90deg,#0000 0) 0 0/14px 6px repeat-x}
.hud-title b{font-family:var(--display);color:var(--ivory);font-size:16px;letter-spacing:.01em}
.hud-title small{font-family:var(--display);color:var(--gold-hi)}
.brand-icon{width:38px;height:38px;color:#3a2504;background:linear-gradient(135deg,var(--gold-hi),var(--gold));border:0;box-shadow:none}
.brand-icon .ic{width:22px;height:22px}
#hud .hud-pill{background:rgba(255,255,255,.07);color:#e7dec6;border-color:rgba(217,160,50,.55)}
#hud .hud-pill.gold-pill{background:linear-gradient(#3d2c08,#241803);color:var(--gold-hi);border-color:var(--gold)}
#hud .hud-pill.biome-pill{background:rgba(5,150,105,.22);color:#8ff0c0;border-color:rgba(52,211,153,.55)}
.turn-herald{height:40px;padding:0 20px;border:0!important;outline:0}
.turn-sigil-icon .ic{color:var(--gold-hi);width:15px;height:15px}
.turn-herald-divider .ic{width:9px;height:9px;opacity:.7}
.btn{border:0;background:linear-gradient(135deg,#f3d27a,#a97a1f);color:#2b1c05;isolation:isolate;box-shadow:none;border-radius:0}
.btn::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:linear-gradient(#fffdf6,var(--ivory2));clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px);transition:background .15s}
.btn:hover,.btn:focus-visible{background:linear-gradient(135deg,#fff3c4,var(--gold));box-shadow:none}
.btn:hover::before,.btn:focus-visible::before{background:linear-gradient(#fffef9,#f8ecc9)}
.btn.pri,.btn.pri:hover{background:linear-gradient(135deg,#fff1b8,var(--gold));border:0;box-shadow:none;color:#fff;text-shadow:0 1px 2px rgba(60,30,0,.65)}
.btn.pri::before{background:linear-gradient(135deg,#f0b73a,#b8700e 60%,#7d4706)}
.btn.pri:hover::before{background:linear-gradient(135deg,#ffd15e,#cf8212 60%,#8f510a)}
.btn.danger,.btn.danger:hover{background:linear-gradient(135deg,#fecaca,#dc2626);border:0;box-shadow:none}
.btn.danger::before{background:linear-gradient(135deg,#e5484d,#8f1519)}
#hud .btn:not(.pri){color:#f1e6c6}
#hud .btn:not(.pri)::before{background:linear-gradient(#26316a,#121a3b)}
#hud .btn:not(.pri):hover::before{background:linear-gradient(#34428a,#1a2552)}
#stage{background:repeating-linear-gradient(45deg,rgba(246,220,142,.05) 0 1px,#0000 1px 26px),repeating-linear-gradient(-45deg,rgba(246,220,142,.05) 0 1px,#0000 1px 26px),radial-gradient(ellipse 80% 70% at 50% 45%,#222d5e 0%,var(--ink) 78%)}
canvas#cv{border-radius:0;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--gold),0 0 0 8px var(--ink),0 0 38px 8px rgba(246,200,90,.28),0 26px 60px rgba(0,0,0,.65)}
#wrap::before{--k:linear-gradient(var(--gold-hi),var(--gold-hi));content:"";position:absolute;inset:-15px;pointer-events:none;z-index:2;background:var(--k) 0 0/30px 3px,var(--k) 0 0/3px 30px,var(--k) 100% 0/30px 3px,var(--k) 100% 0/3px 30px,var(--k) 0 100%/30px 3px,var(--k) 0 100%/3px 30px,var(--k) 100% 100%/30px 3px,var(--k) 100% 100%/3px 30px;background-repeat:no-repeat}
#menu{border:0;border-radius:0;background:var(--cn),linear-gradient(#fffdf6,var(--ivory2));padding:12px;box-shadow:0 0 0 2px var(--gold),0 16px 34px rgba(0,0,0,.55)}
#menu button{border-radius:0}
#side{background:linear-gradient(180deg,var(--ivory),var(--ivory2));border-left:0;box-shadow:inset 4px 0 0 var(--gold),-8px 0 26px rgba(0,0,0,.4)}
.side-header{background:linear-gradient(180deg,var(--ink2),var(--ink));border-bottom:3px solid var(--gold);padding:8px 8px 0}
.side-header .side-tab-btn{color:#b9b2d0;padding:9px 4px 8px}
.side-tab-btn.active{background:linear-gradient(var(--gold-hi),var(--gold));color:#3a2504;border-top:0;box-shadow:none}
.side-tab-btn .ic{width:13px;height:13px}
.card-unit{border-radius:0;background:var(--cn),linear-gradient(135deg,#fff,#f3e8cc);border:1px solid rgba(217,160,50,.55)}
.card-unit.pl{border-left:5px solid var(--azure-pri)}.card-unit.en{border-left:5px solid var(--crimson-pri)}.card-unit.al{border-left:5px solid var(--emerald-pri)}
.unit-avatar{border-radius:0;clip-path:var(--cut-md);background:radial-gradient(circle,#fff,#e6d3a6);border:0}
.unit-meta h4{font-family:var(--display)}
.meter-bar{height:8px;border-radius:0;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 100%,4px 100%);background:rgba(11,16,34,.18)}
.meter-bar i{border-radius:0}
.stat-box{border-radius:0;clip-path:var(--cut-sm);background:linear-gradient(#fff,#f6ecd2)}
.inv-item,.objective-box{border-radius:0}
.objective-box{background:var(--cn),#fff8e0}
.hud-pill{clip-path:var(--cut-sm)}
#modal{background:radial-gradient(circle at 50% 40%,rgba(30,40,90,.72),rgba(5,7,18,.92))}
#boxWrap{position:relative;width:100%;max-width:620px;filter:drop-shadow(2px 0 0 var(--gold)) drop-shadow(-2px 0 0 var(--gold)) drop-shadow(0 2px 0 var(--gold)) drop-shadow(0 -2px 0 var(--gold)) drop-shadow(0 24px 40px rgba(0,0,0,.6));animation:unfold .3s cubic-bezier(.16,1,.3,1)}
#boxWrap::before{content:"";position:absolute;left:50%;top:-10px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff3c4,var(--gold) 60%,#8a5208);box-shadow:0 0 0 2px #5b3a06,0 0 14px 3px rgba(255,205,90,.7);z-index:2}
#box{max-width:none;border:0;padding:34px 26px 24px;animation:none;box-shadow:none;background:repeating-linear-gradient(45deg,rgba(217,160,50,.07) 0 1px,#0000 1px 16px),repeating-linear-gradient(-45deg,rgba(217,160,50,.07) 0 1px,#0000 1px 16px),linear-gradient(180deg,#fffdf6,#f1e5c8)}
#box h3{font-family:var(--display);color:#6b4608;font-size:21px;border-bottom:0;padding-bottom:13px;background:linear-gradient(90deg,#0000,var(--gold) 18%,var(--gold) 82%,#0000) bottom/100% 2px no-repeat}
@keyframes unfold{from{opacity:0;transform:scaleY(.85) translateY(12px)}to{opacity:1;transform:none}}
.credit-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 16px;text-align:center;background:var(--cn),linear-gradient(135deg,#fff8e0,#f1e0b0);clip-path:var(--cut-md)}
.credit-card b{font-family:var(--display);font-size:22px;color:#6b4608}.credit-card span{font-size:12px;color:var(--tx-sec)}.credit-card strong{font-family:var(--display);font-size:20px;color:#9a5a06}
.achieve-card{border-radius:0;clip-path:var(--cut-md)}
.achieve-icon{border-radius:0;clip-path:var(--cut-sm);color:#a8730f;background:linear-gradient(#fff,#f3e4b8)}
.achieve-icon .ic{width:26px;height:26px}
.achieve-card.unlocked .achieve-icon{color:#fff;background:linear-gradient(135deg,#f0b73a,#8a5208)}
/* căn lề: icon + chữ đi liền nhau; nút 2 cột (tên | trạng thái) vẫn đẩy cột sau sang phải */
.box-list button{justify-content:flex-start}
.box-list button>span+span{margin-left:auto}
#box h3{display:block}
#box h3 .ic{margin-right:6px}
/* chừa chỗ cho khung vàng quanh bản đồ, không bị cắt mép */
#stage{padding:22px}
.side-tab-btn{white-space:nowrap}
.side-header .side-tab-btn{font-size:11.5px;padding:9px 2px 8px}
#hud .btn .ic{width:16px;height:16px}
@media (max-width:820px),(max-aspect-ratio:1/1){#stage{padding:13px}#wrap::before{inset:-9px}}
/* đòn chí mạng trong nhật ký: con số + hình gai */
.crit-n{color:#b45309;font-weight:800}.crit-n .ic{color:#d97706}
@media (max-width:820px),(max-aspect-ratio:1/1){#side{box-shadow:inset 0 4px 0 var(--gold)}}
@media (prefers-reduced-motion:reduce){#boxWrap{animation:none}}
</style>
</head>
<body>
<div id="celestial-bg"></div>

<!-- TOP HUD -->
<header id="hud"></header>

<!-- MAIN CONTENT -->
<main id="main">
  <section id="stage">
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="menu"></div>
    </div>
  </section>
  <aside id="side">
    <div class="side-header">
      <button class="side-tab-btn active" id="tabUnit">{{swords}} Chiến Tướng</button>
      <button class="side-tab-btn" id="tabLog">{{scroll}} Quân Ký</button>
      <button class="side-tab-btn" id="tabQuest">{{target}} Nhiệm Vụ</button>
    </div>
    <div class="side-body">
      <button id="cancel" class="btn danger" style="display:none; width: 100%;">{{undo}} Hoàn tác di chuyển</button>
      <div id="sideContent"></div>
    </div>
  </aside>
</main>

<!-- MODAL POPUP -->
<div id="modal"><div id="boxWrap"><div id="box"></div></div></div>

ân vật sẽ chuyển sang màu xám và không thể làm gì trong lượt đó nữa.","Địa hình có ảnh hưởng đến nhân vật.Ví dụ khi trong rừng, chỉ số tránh né sẽ tăng lên còn di chyển sẽ giảm.Đưa ô chọn đến địa hình rồi quan sát ảnh hưởng của nó ở dưới.","Trong mỗi lượt bạn sẽ điều khiển từng nhân vật 1. Khi bạn đi chuyển hết các nhân vật, hệ thống sẽ tự động chuyển sang lượt đối phương; bạn cũng có thể đưa ô chọn đến vị trí không có người, chon %K5 1 menu sẽ hiện ra chọn“kết thúc lượt”. Chờ lượt đối phương kết thúc là bạn có thể đi lượt mới.","Bạn có thể bấm \"*\" để chuyển đến nhân vật tiếp theo.","Đưa ô chọn đến nhân vật(kể cả đối phương), bạn bấm \"#\" để xem các chỉ số và vũ khí trang bị. Khi đánh nhau bạn sẽ thu được kinh nghiệm, khi đạt đủ 100 kinh nghiệm bạn sẽ lên cấp, chỉ số sẽ được tăng ngẫu nhiên.","Đưa ô chọn đến nhân vật(kể cả đối phương), bấm '%K5' để xem phạm vi di chuyển.","Trước khi tấn công đối phương 1 bảng thông số sẽ hiện ra ; bao gồm: Hp, tấn công, phòng thủ, tỉ lệ trí mạng, tỉ lệ kỹ năng và tốc độ(ảnh hưởng đến số lần tấn công),bấm'%K5'để xác nhận tấn công.","Nếu bạn tấn công trong phạm vi có nhiều kẻ địch, trận chiến có thành công hay không phụ thuộc vũ khí, địa hình thích hợp và cái đầu.","Tại Pakistan, Palian Seattle,phía Tây vùng đất này, tồn tại 2 quốc gia được tạo lên bởi Sodom và Mira, 2 trong số nhựng vị thần của vùng đất này.\n\nMột vương quốc thì hưng thịnh, quả cảm - Vương quốc phía nam - Sofia ; Còn phía bắc là nơi vô cùng tàn nhẫn được cai trị bởi đế chế Gailu.\n\nMâu thuẫn giữa 2 vương quốc theo thời gian ngày 1 tăng, cho đến 1 ngày tại hoàng gia của 2 vương quốc, đã có 2 đứa bé trào đời, và chính chúng sẽ thay đổi số phận của vùng đất Palian Seattle này.\n\nVà ngày đó cũng đã đến, bánh xe lịch sử Palian Seattle đã chuyển động, mở ra 1 thời kì chiến tranh ác liệt.","Tướng quân khét tiếng Desai đảo chính, chiếm lấy Sofia, sau khi đức vua băng hà 10 năm trước.\n\nTrong khoảng thời gian đó phiến quân liên tục nổi lên, nội chiến cuối cùng bùng nổ.\n\nLàng Ramsey mặc dù nằm gần biên giới, nhưng cũng không được yên ổn.","10 năm trước, Panchen Desai đã được chọn trong cung điện Sofia, để tìm kiếm người thừa kế duy nhất của hoàng gia Sofia.\n\n1 hoàng tử mới tròn 1 tuổi. Tuy nhiên hắn đã tìm 1 cái xác đứa trẻ cháy đen ngoài thành và bảo đó là hoàng tử.","Sau khi chiếm được pháo đài biên giới, nghĩa quân đã có được thắng lợi bước đầu;\nAccor chính thức được thừa nhận là người thừa kế hoàng tộc và kêu gọi mọi người dân đứng dậy lật đổ Desai, phục hưng Sofia.\n\nChẳng bao lâu, nghĩa quân trở lên ngày 1 đông đảo, phát triển mạnh mẽ.\n\nTuy nhiên, 1 lượng lớn nghĩa quân đã bị quân của Desai phục kích và bị bao vây trong 1 tiền đồn nhỏ. Accor ngay lập tức đưa quân đến phá vòng vây...","Khi đang hành quân, nghĩa binh bất ngờ đụng độ 1 đội quân bí mật.\n\nNhìn vũ khí và trang bị của chúng không giống quân đội của Desai...","Để cứu 1 vị tướng của nghĩa quân, Accor đã quyết định cướp ngục Ruwalasi. ","Accor cùng quân đội đã bí mật đột nhập vào nhà tù Vallas nhằm pha vòng vây và giải cứu Fowle.\n\nTuy nhiên đường rút khỏi Vallas đã bị chặn.\nHết rắc rối này đến rắc rối khác, lực lượng chính của Desai đã bủa vây quanh các trạm gác, Accor cùng mọi cần nhanh chóng tiến về phía đông pháo đài.\n\nMọi người đã quyết định vừa chạy vừa chặn quân đuổi theo trước khi quân của Desai tràn vào.Sau đó thẳng tiến về pháo đài biên giới.","Sau khi giết Vallas, Accor nhanh chóng trở về biên giới để tới Seema xinh đẹp.\n\nTuy nhiên, có vẻ như đã muộn, Desai đã phá vỡ phòng thủ bên ngoài thành phố, trong thành phố chỉ còn lại 1 lượng nhỏ nghĩa quân tiếp tục chiến đấu...","Accor đã có được 1 chiến thắng, giáng đòn đau đến quân đội Desai, tin này nhanh chóng lan ra cả nước trong thời gian cực ngắn.\n\nChỉ trong 2 tuần, hầu hết nhân dân cả nước đã tham gia dưới lá cờ nghĩa quân.\n\n Về phần Desai, hắn quyết định phải tấn công để dạp bỏ mối nguy này ngay lập tức... ...","Hoàng gia Sofia, sau sự thất lạc kéo dài 10 năm, ta đã gặp được chủ nhân thực sự của vương quốc này.\n\nDesai đã dốc toàn lực cho trận chiến cuối cùng này, hãy tiến lên chống lại dào cản cuối cùng hỡi các anh hùng!!!","Trận chiến đã kết thúc, tất cả đã kết thúc!!\n\nKhông biết từ khi nào, bầu trời đang dần bừng tỉnh.\nNhững đám mây phía đông cũng ánh lên trong tia nắng sớm, chuyển dần từ trắng sang đỏ, từ từ lan rộng,\n\nCuối cùng, từ đường chân trời, người ta có thể thấy ánh sáng chói lòa như 1 ngọn lửa đang rực cháy, vượt qua những đám vây, vượt qua làn sương mù, bầu trời nhuốm 1 màu vàng rực rỡ, lan tỏa xuống cả mặt đất, và lan tỏa đến trái tim của những người con đất Sofia.\n\nTrong đám đông ấy, Accor đi đầu dần tiến về phía cung điện trong sự thành kính và trang nghiêm.\n\nTuy nhiên, có 1 nơi không có sự hân hoan chào đón ấy, đó là 1 căn phòng tối sâu dưới lòng đất, có cái gì đó đang ở nơi đây.......","Hàng phòng ngự đã bị phá vỡ, làng Ramsey không biết có thể cầm cự được bao lâu đây?","Nghĩa quân đang nổi lên ở khắp nơi, sẽ không lâu đâu, kháng chiến sẽ lan rộng khắp làng Ramsey...","Accor, có tin xấu đây!","Bình tĩnh nào, có chuyện gì vậy?","1 toán cướp đã đột nhập vào làng và đang tàn phá cướp bóc. Không còn thời gian đâu Accor!","Các anh em, hãy tiến lên, cướp lấy phụ nữ và thực phẩm, đốt hết nhà cho ta, kẻ nào cản đường giết không tha!","Humm! Bị bao vây rồi, mọi người tiến lên nào, hãy cho chúng 1 bài học!","Đúng lúc ngứa ngáy chân tay đây.","Tốt nhất là cẩn thận 1 chút, thận trọng không thừa đâu.","Các cậu tự tin quá đấy, đừng làm những chuyện vô ích với nghĩa quân!","Bọn nào đây, chả lẽ Đức vua lại tốt bụng gửi bọn vô dụng đến. Nào anh em cùng lên đi!","Dân làng sẽ biết cách giúp.Dọn dẹo trang bị đi, chúng ta không thể ở đây nữa rồi!","Ở phía nam ngôi làng, gần biên giới có 1 pháo đài của Desai, gần đó có lẽ sẽ có nghĩa quân, ta sẽ đến đó.","Ha ha, những chiến binh tài năng đây. Ta là 1 thương nhân sống ẩn dật, người lớn tuổi nhất trong 5 anh em ta. Rất hân hạnh được gặp ngài, chiêc cung này xin gửi tặng ngài. Và ở phía đông lụ       }
    } catch (e) {}
    try {
      const bRes = await fetch('sounds/bgm.json');
      if (bRes.ok) {
        const customBgm = await bRes.json();
        if (customBgm && typeof customBgm === 'object') {
          Object.assign(D.MID, customBgm);
        }
      }
    } catch (e) {}
  },

  init() {
    this.loadCustomSounds();
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;

    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  toggleMute() {
    this.mute = !this.mute;
    if (this.mute) {
      if (this.midiGain) this.midiGain.gain.setValueAtTime(0, this.ctx.currentTime);
      if (this.currentAudioEl) this.currentAudioEl.volume = 0;
    } else {
      if (this.midiGain) this.midiGain.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
      if (this.currentAudioEl) this.currentAudioEl.volume = 0.35 * this.volume;
      if (this.currentTrack && !this.midiTimer && !this.currentAudioSource && !this.currentAudioEl) {
        this.playBGM(this.currentTrack);
      }
    }
    return this.mute;
  },

  setVolume(vol) {
    this.volume = Math.max(0, Math.min(1, vol));
    if (this.midiGain && !this.mute) {
      this.midiGain.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
    }
    if (this.currentAudioEl && !this.mute) {
      this.currentAudioEl.volume = 0.35 * this.volume;
    }
  },

  playCustomSFX(name) {
    if (this.mute) return true;
    if (this.customSFX && this.customSFX[name] && this.customSFX[name].base64) {
      this.playAudioBase64(this.customSFX[name].base64, false);

      gain.gain.setValueAtTime(crit ? 0.45 : 0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (crit ? 0.3 : 0.18));
      osc.connect(gain); gain.connect(c.destination);

    magic() {

    levelUp() {

      const c = AudioSystem.ctx, t = c.currentTime;
      [440, 554.37, 659.25, 880].forEach((freq, i) => {

        osc.type = 'triangle'; osc.frequency.value = freq;
        const st = t + i * 0.08;
        gain.gain.setValueAtTime(0.25, st);
        gain.gain.exponentialRampToValueAtTime(0.001, st + 0.5);

      });
    },
    click() {

      const c = AudioSystem.ctx, t = c.currentTime;
      const osc = c.createOscillator(), gain = c.createGain();

      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t); osc.stop(t + 0.05);
    },
    cancel() {
      if (AudioSystem.mute || !AudioSystem.ctx) return;
      const c = AudioSystem.ctx, t = c.currentTime;
      const osc = c.createOscillator(), gain = c.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(320, t);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t); osc.stop(t + 0.07);
    }
  },

  parseMidi(b) {
    let p = 0;
    const r = n => { let v = 0; while (n--) v = v * 256 + b[p++]; return v; };
    const vl = () => { let v = 0, c; do { c = b[p++]; v = v * 128 + (c & 127); } while (c & 128); return v; };
    p += 4; r(4); r(2);
    const nt = r(2), div = r(2), ev = [], tm = [];
    for (let t = 0; t < nt; t++) {
      p += 4; const end = r(4) + p;
      let tick = 0, st = 0;
      while (p < end) {
        tick += vl(); let s = b[p];
        if (s & 128) { p++; st = s; } else s = st;
        if (s == 255) {
          const ty = b[p++], l = vl();
          if (ty == 81) tm.push([tick, b[p] << 16 | b[p + 1] << 8 | b[p + 2]]);
          p += l;
        } else if (s == 240 || s == 247) {
          p += vl();
        } else {
          const k = s & 240, ch = s & 15, a = b[p++], v = (k == 192 || k == 208) ? 0 : b[p++];
          if (k == 144 && v > 0) ev.push([tick, ch, a, v, 1]);
          else if (k == 128 || (k == 144 && v == 0)) ev.push([tick, ch, a, 0, 0]);
        }
      }
      p = end;
    }
    tm.sort((x, y) => x[0] - y[0]);
    if (!tm.length || tm[0][0] > 0) tm.unshift([0, 500000]);
    const sec = t => {
      let s = 0, pt = 0, mp = tm[0][1];
      for (const [tk, m] of tm) {
        if (tk >= t) break;
        s += (tk - pt) * mp / div / 1e6;
        pt = tk; mp = m;
      }
      return s + (t - pt) * mp / div / 1e6;
    };
    ev.sort((x, y) => x[0] - y[0]);
    const op = {}, notes = [];
    for (const [tk, ch, n, v, on] of ev) {
      const k = ch * 128 + n;
      if (on) op[k] = [tk, v];
      else if (op[k]) {
        const o = op[k]; delete op[k];
        const s = sec(o[0]);
        notes.push({ s, d: Math.max(0.06, sec(tk) - s), n, v: o[1], ch });
      }
    }
    notes.sort((x, y) => x.s - y.s);
    const l = notes[notes.length - 1];
    return { notes, len: l ? l.s + l.d + 0.5 : 1 };
  },

  playMidiNote(n, t, out) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), e = this.ctx.createGain();
    if (n.ch == 9) {
      o.type = 'square';
      o.frequency.value = n.n < 40 ? 70 : n.n < 46 ? 180 : 900;
      e.gain.setValueAtTime((n.v / 127) * 0.35, t);
      e.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(e); e.connect(out);
      o.start(t); o.stop(t + 0.1);
      return;
    }
    o.type = ['triangle', 'square', 'sawtooth'][n.ch % 3];
    o.frequency.value = 440 * Math.pow(2, (n.n - 69) / 12);
    const v = (n.v / 127) * (n.ch % 3 ? 0.16 : 0.32);
    e.gain.setValueAtTime(0.0001, t);
    e.gain.linearRampToValueAtTime(v, t + 0.012);
    e.gain.setValueAtTime(v * 0.75, t + Math.max(0.02, n.d - 0.05));
    e.gain.linearRampToValueAtTime(0.0001, t + n.d + 0.08);
    o.connect(e); e.connect(out);
    o.start(t); o.stop(t + n.d + 0.1);
  },

  stopBGM() {
    if (this.midiTimer) {
      clearInterval(this.midiTimer);
      this.midiTimer = null;
    }
    if (this.currentAudioSource) {
      try { this.currentAudioSource.stop(); } catch (e) {}
      this.currentAudioSource = null;
    }
    if (this.currentAudioEl) {
      try { this.currentAudioEl.pause(); this.currentAudioEl.src = ''; } catch (e) {}
      this.currentAudioEl = null;
    }
    if (this.midiGain) {
      const g = this.midiGain;
      try { g.gain.setTargetAtTime(0, this.ctx ? this.ctx.currentTime : 0, 0.05); } catch (e) {}
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 400);
      this.midiGain = null;
    }
  },

  playBGM(name) {
    this.init();
    if (this.currentTrack === name && (this.midiTimer || this.currentAudioSource || this.currentAudioEl)) return;
    this.currentTrack = name;
    this.stopBGM();
    if (this.mute || !D.MID || !D.MID[name]) return;
    this.playAudioBase64(D.MID[name], !/victory|gameover/.test(name));
  },

  playAudioBase64(dataStr, loop) {
    if (!dataStr || this.mute) return;
    const cleanB64 = (dataStr.indexOf(',') >= 0 ? dataStr.split(',')[1] : dataStr).trim();
    let bin;
    try {
      bin = atob(cleanB64);
    } catch (e) {
      return;
    }
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

    // Standard MIDI file check: header "MThd" (0x4D, 0x54, 0x68, 0x64)
    const isMidi = a.length >= 4 && a[0] === 0x4D && a[1] === 0x54 && a[2] === 0x68 && a[3] === 0x64;

    if (isMidi) {
      let m = this.midiCache[dataStr];
      if (!m) {
        try { m = this.midiCache[dataStr] = this.parseMidi(a); } catch (e) { return; }
      }
      let t0 = this.ctx.currentTime + 0.1, i = 0;
      const g = this.midiGain = this.ctx.createGain();
      g.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
      g.connect(this.ctx.destination);

      this.midiTimer = setInterval(() => {
        const now = this.ctx.currentTime - t0;
        while (i < m.notes.length && m.notes[i].s < now + 0.5) {
          this.playMidiNote(m.notes[i++], t0 + m.notes[i - 1].s, g);
        }
        if (i >= m.notes.length && now > m.len) {
          if (loop) { t0 = this.ctx.currentTime + 0.1; i = 0; }
          else { clearInterval(this.midiTimer); this.midiTimer = null; }
        }
      }, 120);
    } else {
      // MP3 / WAV / OGG Base64 decoding support
      const g = this.midiGain = this.ctx.createGain();
      g.gain.setValueAtTime(0.3 * this.volume, this.ctx.currentTime);
      g.connect(this.ctx.destination);

      if (this.audioBufferCache[dataStr]) {
        try {
          const src = this.ctx.createBufferSource();
          src.buffer = this.audioBufferCache[dataStr];
          src.loop = !!loop;
          src.connect(g);
          src.start(0);
          this.currentAudioSource = src;
        } catch (e) {
          this.playHtmlAudioFallback(cleanB64, loop);
        }
      } else if (this.ctx && this.ctx.decodeAudioData) {
        const copyBuf = a.buffer.slice(a.byteOffset, a.byteOffset + a.byteLength);
        this.ctx.decodeAudioData(copyBuf, (buffer) => {
          this.audioBufferCache[dataStr] = buffer;
          if (this.mute || this.currentTrack !== this.currentTrack) return;
          try {
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            src.loop = !!loop;
            src.connect(g);
            src.start(0);
            this.currentAudioSource = src;
          } catch (e) {}
        }, () => {
          this.playHtmlAudioFallback(cleanB64, loop);
        });
      } else {
        this.playHtmlAudioFallback(cleanB64, loop);
      }
    }
  },

  playHtmlAudioFallback(cleanB64, loop) {
    try {
      const audio = new Audio('data:audio/mp3;base64,' + cleanB64);
      audio.loop = !!loop;
      audio.volume = this.mute ? 0 : this.volume * 0.35;
      audio.play().catch(() => {});
      this.currentAudioEl = audio;
    } catch (e) {}
  }
};

    desert: { name: 'Kim Sa Cổ Mộ', filter: 'hue-rotate(45deg) saturate(1.2) brightness(1.1)', desc: 'Hoang mạc cát vàng cổ đại lưu giữ báu vật ngàn năm.' }
  },

  init(onComplete) {
    const keys = Object.keys(D.IMG);
    let loaded = 0;
    keys.forEach(k => {
      const img = new Image();
      img.onload = img.onerror = () => {
        if (++loaded >= keys.length) {
          this.buildRecolors();
          this.buildBiomeTiles();
          if (onComplete) onComplete();
        }
      };
      img.src = D.IMG[k];
      this.raw[k] = img;
    });
  },

  recolorCanvas(img, pal) {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height), a = d.data, f = pal[0], t = pal[1];
    for (let i = 0; i < a.length; i += 4) {
      for (let k = 0; k < f.length; k++) {
        if (a[i] === f[k][0] && a[i+1] === f[k][1] && a[i+2] === f[k][2]) {
          a[i] = t[k][0]; a[i+1] = t[k][1]; a[i+2] = t[k][2];
        }
      }
    }
    ctx.putImageData(d, 0, 0);
    return c;
  },

  buildRecolors() {
    const G3 = [[47, 100, 0], [91, 195, 0], [150, 255, 57]];
    const R3 = [[120, 15, 8], [206, 85, 12], [255, 132, 57]];
    const PAL = {
      0: [[[255, 242, 0]], [[71, 156, 255]]],
      8: [G3, R3],
      9: [G3, [[140, 98, 57], [198, 156, 109], [255, 132, 57]]],
      10: [G3, [[73, 19, 96], [146, 39, 143], [189, 140, 191]]],
      11: [G3, [[123, 0, 70], [228, 57, 224], [255, 144, 252]]],
      12: [G3, R3]
    };
    try {
      ['stand1_', 'stand2_', 'attack1_', 'attack2_'].forEach(n => {
        this.recolors[n + '2'] = this.recolorCanvas(this.raw[n + '0'], PAL[0]);
      });
      this.recolors.head_8 = this.recolorCanvas(this.raw.head_1, PAL[8]);
      this.recolors.head_9 = this.recolorCanvas(this.raw.head_1, PAL[9]);
      this.recolors.head_10 = this.recolorCanvas(this.raw.head_1, PAL[10]);
      this.recolors.head_11 = this.recolorCanvas(this.raw.head_1, PAL[11]);
      this.recolors.head_12 = this.recolorCanvas(this.raw.head_2, PAL[12]);
    } catch (e) {
      console.warn('Recolor build error', e);
    }
  },

  buildBiomeTiles() {
    Object.keys(this.BIOMES).forEach(bKey => {
      this.biomeCache[bKey] = {};
      const filter = this.BIOMES[bKey].filter;
      for (let i = 1; i <= 37; i++) {
        const key = 'map-' + i;
        const srcImg = this.raw[key];
        if (!srcImg) continue;
        if (filter === 'none') {
          this.biomeCache[bKey][key] = srcImg;
        } else {
          const c = document.createElement('canvas');
          c.width = srcImg.width || 24; c.height = srcImg.height || 24;
          const ctx = c.getContext('2d');
          ctx.filter = filter;
          ctx.drawImage(srcImg, 0, 0);
          this.biomeCache[bKey][key] = c;
        }
      }
    });
  },

  getTile(id) {
    const key = 'map-' + (id + 1);
    const bTiles = this.biomeCache[this.currentBiome] || this.biomeCache.emerald;
    return (bTiles && bTiles[key]) || this.raw[key];
  },

  getHead(z) {
    return z < 8 ? this.raw['head_' + z] : this.recolors['head_' + z];
  }
};

/* ============================================================
   4. COMBAT & ANTI-EXPLOIT BALANCE SYSTEM
   ============================================================ */
const BalanceSystem = {
  staffHealCounter: {},

  calcAS(unit, weapon) {
    if (!weapon) return unit.spd;
    const wt = iS(weapon.id)[5] || 0;
    const penalty = Math.max(0, wt - unit.str);
    return Math.max(0, unit.spd - penalty);
  },

  trueHitRNG(rate) {
    const r1 = Math.random() * 100;
    const r2 = Math.random() * 100;
    const avg = (r1 + r2) / 2;
    const boundedRate = Math.max(5, Math.min(95, rate));
    return avg < boundedRate;
  },

  triggerSquadAlert(targetUnit, allUnits) {
    if (targetUnit.team !== 2) return;
    targetUnit.ai = 1;
    allUnits.forEach(u => {
      if (u.team === 2 && u.hp > 0 && Math.abs(u.x - targetUnit.x) + Math.abs(u.y - targetUnit.y) <= 4) {
        u.ai = 1;
      }
    });
  },

  getStaffExp(healer, target) {
    const key = healer.id + '->' + target.id;
    this.staffHealCounter[key] = (this.staffHealCounter[key] || 0) + 1;
    const count = this.staffHealCounter[key];
    if (count === 1) return 18;
    if (count === 2) return 10;
    if (count === 3) return 5;
    return 2;
  },

  resetTurnCounters() {
    this.staffHealCounter = {};
  }
};

/* ============================================================
   7. STORAGE & SAVE CODE SYSTEM (Export / Import as Code)
   ============================================================ */
const StorageSystem = {
  save() {
    if (!G) return false;
    try {
      localStorage.setItem('ha1_save_v2', JSON.stringify(G));
      return true;
    } catch (e) {
      return false;
    }
  },

  load() {
    try {
      const s = localStorage.getItem('ha1_save_v2') || localStorage.getItem('ha1_save');
      if (s) {
        G = JSON.parse(s);
        if (!G.avail) G.avail = [...Array(Math.min((G.cleared || 0) + 1, 10)).keys()];
        G.achieved = G.achieved || [];
        G.endings = G.endings || [];
        G.stats = G.stats || { crits: 0, heals: 0, arenaWins: 0, rogueFloors: 0 };
        return true;
      }
    } catch (e) {}
    return false;
  },

  exportCode() {
    if (!G) return '';
    try {
      const json = JSON.stringify(G);
      const b64 = btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
      let crc = 0;
      for (let i = 0; i < b64.length; i++) crc = (crc + b64.charCodeAt(i) * 31) & 0xffff;
      return 'HA1-V2-' + b64 + '-' + crc.toString(16).toUpperCase();
    } catch (e) {
      return '';
    }
  },

  importCode(codeStr) {
    try {
      const clean = codeStr.trim();
      if (!clean.startsWith('HA1-V2-')) return false;
      const parts = clean.split('-');
      if (parts.length < 4) return false;
      const b64 = parts[2];
      const json = decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const parsed = JSON.parse(json);
      if (parsed && typeof parsed.ch === 'number' && Array.isArray(parsed.roster)) {
        G = parsed;
        G.achieved = G.achieved || [];
        G.endings = G.endings || [];
        G.stats = G.stats || { crits: 0, heals: 0, arenaWins: 0, rogueFloors: 0 };
        this.save();
        return true;
      }
    } catch (e) {
      console.warn('Import failed', e);
    }
    return false;
  }
};

function genMap(sd, w, h, th) {
  seed = sd;
  const t = new Array(w * h).fill(th.base[0]);
  const pick = a => a[srnd(a.length)];
  for (let i = 0; i < w * h; i++) if (srnd(100) < 30) t[i] = pick(th.base);
  const blob = (ids, n) => {
    for (let k = 0; k < n; k++) {
      const cx = srnd(w), cy = srnd(h), r = 1 + srnd(2);
      for (let dx = -r; dx <= r; dx++) {
        for (let dy = -r; dy <= r; dy++) {
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && y >= 0 && x < w && y < h && (Math.abs(dx) + Math.abs(dy) <= r) && y > 1 && y < h - 2) {
            t[y * w + x] = pick(ids);
          }
        }
      }
    }
  };
  blob(th.forest, th.nf);
  blob(th.hill, th.nh);
  for (let i = 0; i < th.nv; i++) {
    const x = 2 + srnd(w - 4), y = 3 + srnd(h - 6);
    t[y * w + x] = 5;
  }
  for (let i = 0; i < th.nw; i++) {
    const x = 1 + srnd(w - 2), y = 3 + srnd(h - 6);
    t[y * w + x] = th.wall;
  }
  for (let y = h - 3; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (t[y * w + x] > 5) t[y * w + x] = th.base[0];
    }
  }
  return { w, h, t };
}

function buildGen(i) {
  const g = GEN[i], m = genMap(g.seed, g.w, g.h, g.th), U2 = [], js = [5, 6, 7, 8, 9, 10, 11, 12];
  seed = g.seed + 99;
  for (let k = 0; k < g.n; k++) {
    const j = js[srnd(js.length)];
    const p = freeNearM(m, 2 + srnd(g.w - 4), 1 + srnd(5), U2);
    const e = spawn(j, g.lv + srnd(3), 2, p[0], p[1], 110 + k, WSJ[j].concat(srnd(3) === 0 ? [41] : []), false);
    e.ai = k % 3 === 0 ? 1 : 0;
    U2.push(e);
  }
  if (g.boss) {
    const b = g.boss, bp = freeNearM(m, b.pos[0], b.pos[1], U2);
    const bs = spawn(b.job, b.lv, 2, bp[0], bp[1], b.id, b.items, true);
    bs.name = NEWN[b.id] || 'Chỉ Huy Địch';
    bs.str += 3; bs.def += 2; bs.skl += 4; bs.ai = 1;
    U2.push(bs);
  }
  const pos = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 10; c++) pos.push([3 + c, g.h - 3 + r]);
  return { m, U: U2, pos };
}

function freeNearM(m, x, y, list) {
  for (let r = 0; r < 9; r++) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        const nx = clamp(x + dx, 0, m.w - 1), ny = clamp(y + dy, 0, m.h - 1);
        const t = m.t[ny * m.w + nx];
        if ((t < 6 || t > 20) && t !== 0 && !list.some(u => u.x === nx && u.y === ny)) {
          return [nx, ny];
        }
      }
    }
  }
  return [x, y];
}

/* ============================================================
   8. CORE GAME LOGIC & STATE MACHINE
   ============================================================ */
let PT = [], EFF = [], SHK = null, FLS = null, BAN = null, LD = 0, PREVM = null;
let VIS = new Set(), G = null, MAP = null, U = [], CHAP = null, SEL = null, MODE = '';
let RNG = null, ATK = null, PHASE = 'player', TURN = 1, ORIG = null, BUSY = false;
let FX = [], LOG = [], CUR = { x: 0, y: 0 };
let CURRENT_TAB = 'unit';

const terr = (x, y) => {
  if (!MAP) return 0;
  const t = MAP.t[y * MAP.w + x];
  return t == 0 ? 4 : t < 3 ? 5 : t < 5 ? 6 : t == 5 ? 7 : t < 10 ? 8 : t < 12 ? 2 : t < 21 ? 8 : t < 30 ? 3 : t < 32 ? 1 : t < 35 ? 2 : 8;
};
const inb = (x, y) => MAP && x >= 0 && y >= 0 && x < MAP.w && y < MAP.h;
const at = (x, y) => U.find(u => u.hp > 0 && u.x == x && u.y == y);
const side = t => U.filter(u => u.hp > 0 && (t == 2 ? u.team == 2 : u.team != 2));
const pl = () => U.filter(u => u.hp > 0 && u.team == 0);
const en = () => U.filter(u => u.hp > 0 && u.team == 2);
const avgLv = () => Math.max(1, Math.round(pl().reduce((s, u) => s + u.lv, 0) / Math.max(1, pl().length)));
const WSJ = { 5: [1, 16], 6: [29], 7: [22], 8: [10], 9: [16], 10: [31], 11: [24], 12: [12] };

function mkU(r, team) {
  const u = {
    id: r.w, job: r.ab, lv: r.ac, team,
    str: r.Q, skl: r.R, spd: r.S, def: r.T, mag: r.U, lck: r.X,
    mhp: r.V, hp: r.V, mov: r.W, mask: r.O, x: r.H, y: r.I,
    exp: 0, ai: r.ah,
    inv: [r.L, r.M, r.N].filter(i => i > 0).map(i => ({ id: i, u: iS(i)[6] || 1 })),
    done: false
  };
  u.name = uname(u.id, team);
  return u;
}

function spawn(job, lv, team, x, y, id, items, boss) {
  const c = D.CT[job], g = D.GR[CAT(job)];
  const u = { id, job, lv, team, x, y, exp: 0, ai: 1, done: false, mask: MASKJ[job] };
  const f = (i, v) => Math.max(0, c[i] + Math.floor(g[i] * lv / 100) + v);
  u.str = f(0, 0); u.skl = f(1, 0); u.spd = f(2, 0); u.def = f(3, 0); u.mag = f(4, 0); u.lck = f(5, 0);
  u.mhp = f(6, 0) + (boss ? 12 : 0); u.hp = u.mhp; u.mov = c[7];
  u.inv = items.map(i => ({ id: i, u: iS(i)[6] }));
  u.name = uname(id, team);
  return u;
}

const wpn = u => u.inv.find(i => isW(i.id) && iT(i.id) < 32 && (u.mask & iT(i.id)));
const stf = u => u.inv.find(i => iT(i.id) == 32 && (u.mask & 32));
const avo = u => {
  const w = wpn(u);
  return BalanceSystem.calcAS(u, w) * 2 + u.lck + AVO[terr(u.x, u.y)];
};
const hitR = (a, w, d) => clamp(a.skl * 3 + iS(w.id)[1] - avo(d), 5, 95);
const critR = (a, w) => {
  const c = a.skl + iS(w.id)[2];
  return a.team == 2 && c <= 10 ? 0 : Math.min(c, 90);
};
const dmgR = (a, w, d, crit) => {
  const m = iT(w.id) == 16, p = (m ? a.mag : a.str) + iS(w.id)[0];
  return Math.max(m ? 0 : 1, (crit ? p * 2 : p) - (m ? d.mag >> 1 : d.def));
};
const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const inRange = (w, d) => {
  const s = iS(w.id);
  return d >= s[3] && d <= s[4];
};
const hostile = (a, b) => (a.team == 2) !== (b.team == 2);

function reach(u) {
  const best = new Map([[u.x + ',' + u.y, 0]]), prev = new Map(), q = [[u.x, u.y, 0]];
  while (q.length) {
    q.sort((a, b) => a[2] - b[2]);
    const [x, y, c] = q.shift();
    if (best.get(x + ',' + y) < c) continue;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny)) continue;
      const co = COST[terr(nx, ny)], nc = c + co;
      if (nc > u.mov) continue;
      const o = at(nx, ny);
      if (o && hostile(o, u)) continue;
      const k = nx + ',' + ny;
      if (best.has(k) && best.get(k) <= nc) continue;
      best.set(k, nc); prev.set(k, x + ',' + y);
      q.push([nx, ny, nc]);
    }
  }
  for (const k of [...best.keys()]) {
    const [x, y] = k.split(',').map(Number), o = at(x, y);
    if (o && o !== u) best.delete(k);
  }
  best.prev = prev;
  return best;
}

function pathOf(rc, x, y) {
  const p = [];
  let k = x + ',' + y;
  while (k) {
    p.unshift(k.split(',').map(Number));
    k = rc.prev.get(k);
  }
  return p;
}

const moveAnim = (u, p) => {
  if (p.length < 2) return Promise.resolve();
  u.mv = { p, t0: performance.now(), per: 95 };
  return wait(95 * (p.length - 1) + 50);
};

function atkTiles(u, x, y, w) {
  const s = iS(w.id), r = new Set();
  for (let dx = -s[4]; dx <= s[4]; dx++) {
    for (let dy = -s[4]; dy <= s[4]; dy++) {
      const d = Math.abs(dx) + Math.abs(dy);
      if (d >= s[3] && d <= s[4] && inb(x + dx, y + dy)) r.add((x + dx) + ',' + (y + dy));
    }
  }
  return r;
}

const targets = (u, x, y) => {
  const w = wpn(u);
  if (!w) return [];
  const r = atkTiles(u, x, y, w);
  return U.filter(o => o.hp > 0 && hostile(o, u) && r.has(o.x + ',' + o.y));
};

function log(t, ms) {
  if (ms) { setTimeout(() => log(t), ms); return; }
  LOG.unshift(t);
  LOG.length = Math.min(LOG.length, 50);
  const lEl = $('#sideLog');
  if (lEl) lEl.innerHTML = LOG.map(x => '<div>' + x + '</div>').join('');
}

function forecast(a, d) {
  const w = wpn(a), dw = wpn(d);
  const o = { a, d, w, dw };
  o.hit = hitR(a, w, d);
  o.crit = critR(a, w);
  o.dmg = dmgR(a, w, d, false);
  o.counter = !!(dw && inRange(dw, dist(a, d)));
  if (o.counter) {
    o.dhit = hitR(d, dw, a);
    o.dcrit = critR(d, dw);
    o.ddmg = dmgR(d, dw, a, false);
  }
  const asA = BalanceSystem.calcAS(a, w), asD = BalanceSystem.calcAS(d, dw);
  o.dbl = asA - asD >= 5;
  o.ddbl = o.counter && asD - asA >= 5;
  return o;
}

let AD = 0;
function burst(x, y, c, n, t0, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = (sp || 60) * (0.4 + Math.random());
    PT.push({
      x: x * T + T / 2, y: y * T + T / 2 - 6,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
      ts: t0, life: 450 + Math.random() * 350,
      c, s: 1 + Math.random() * 2.5
    });
  }
}

function swing(a, w, d) {
  if (!w || a.hp <= 0) return;
  const hit = BalanceSystem.trueHitRNG(hitR(a, w, d));
  const crit = hit && (Math.random() * 100 < critR(a, w));
  const dl = AD++ * 520, now = performance.now() + dl;
  const ty = iT(w.id), rg = iS(w.id)[4] > 1;

  a.atk = now; a.tgt = [d.x, d.y];
  if (w.u > 0) w.u--;
  if (w.u <= 0) {
    a.inv = a.inv.filter(i => i !== w);
    log(a.name + ' mất ' + iN(w.id), dl + 200);
  }

  if (rg) {
    EFF.push({ k: 'bolt', x0: a.x, y0: a.y, x: d.x, y: d.y, ts: now + 60, c: ty == 16 ? '#c78bff' : '#fff3b0' });
    setTimeout(() => AudioSystem.sfx.magic(), dl + 60);
  } else {
    EFF.push({ k: 'slash', x: d.x, y: d.y, ts: now + 90, crit });
    setTimeout(() => AudioSystem.sfx.sword(crit), dl + 90);
  }

  const t1 = now + (rg ? 280 : 190);
  if (!hit) {
    FX.push({ x: d.x, y: d.y, t: 'Trượt', c: '#a0aab8', ts: t1 });
    log(a.name + ' đánh trượt.', dl + 200);
    return;
  }

  if (crit && G) { G.stats = G.stats || {}; G.stats.crits = (G.stats.crits || 0) + 1; }

  const dm = dmgR(a, w, d, crit), before = d.hp;
  d.hp = Math.max(0, d.hp - dm);
  if (!d.hl) { d.hl = []; d.hb = before; }
  d.hl.push({ t: t1, hp: d.hp });
  d.flash = t1;

  FX.push({ x: d.x, y: d.y, t: '-' + dm, c: crit ? '#fbbf24' : '#ef4444', ts: t1, big: crit, crit });
  burst(d.x, d.y, crit ? '#f59e0b' : '#ef4444', crit ? 32 : 14, t1, crit ? 110 : 70);

  if (crit) {
    EFF.push({ k: 'crit', x: d.x, y: d.y, ts: t1 });
    SHK = { ts: t1, dur: 450, a: 6 };
    FLS = { ts: t1, dur: 260, c: 'rgba(245, 158, 11, 0.4)' };
  } else {
    SHK = { ts: t1, dur: 180, a: 3 };
  }

  log(a.name + ' {{arrow}} ' + d.name + ': ' + (crit ? '<b class="crit-n">{{burst}} ' + dm + '</b>' : dm) + ', còn ' + d.hp + ' HP', dl + 200);

  if (d.hp <= 0) {
    d.dieAt = t1 + 120;
    burst(d.x, d.y, '#ffffff', 24, d.dieAt, 90);
    if (d.id == 102 && G) { G.stats = G.stats || {}; G.stats.dragonKilled = true; }
  }
}

function dispHP(u, ts) {
  if (!u.hl) return u.hp;
  let h = u.hb;
  for (const e of u.hl) if (ts >= e.t) h = e.hp;
  if (ts >= u.hl[u.hl.length - 1].t + 200) u.hl = null;
  return h;
}

function expFor(a, d, kill) {
  if (a.team !== 0) return 0;
  if (a.job == 1 || a.job == 4) return 15;
  const df = d.lv - a.lv;
  return kill ? clamp(50 + 5 * df, 30, 100) : Math.max(30 + (df >= 0 ? 5 : 10) * df, 10);
}

function battle(a, d) {
  AD = 0; LD = 0;
  BalanceSystem.triggerSquadAlert(d, U);
  const f = forecast(a, d), w = f.w, dw = f.dw;
  const seq = ['a'];
  if (f.counter) seq.push('d');
  if (f.dbl) seq.push('a');
  else if (f.ddbl) seq.push('d');

  for (const s of seq) {
    if (a.hp <= 0 || d.hp <= 0) break;
    if (s === 'a') swing(a, w, d);
    else swing(d, dw, a);
  }

  LD = AD * 520 + 250;
  if (a.team == 0 && a.hp > 0) gain(a, expFor(a, d, d.hp <= 0));
  else if (d.team == 0 && d.hp > 0 && a.hp <= 0) gain(d, expFor(d, a, true));

  [a, d].forEach(x => {
    if (x.hp <= 0) log(x.name + ' đã gục ngã.', LD);
  });
  LD = 0;
  AchievementSystem.check();
  return AD;
}

function gain(u, e) {
  if (!e) return;
  u.exp += e;
  log(u.name + ' +' + e + ' EXP', LD);
  if (u.exp >= 100) {
    u.exp -= 100;
    u.lv++;
    const g = D.GR[CAT(u.job)], ks = ['str', 'skl', 'spd', 'def', 'mag', 'lck', 'mhp', 'mov'], up = [];
    ks.forEach((k, i) => {
      if (i < 7 && Math.random() * 100 < g[i]) {
        u[k] += (k == 'mhp' ? 2 : 1);
        up.push(k);
      }
    });
    u.hp = Math.min(u.mhp, u.hp + 3);
    log('{{star}} ' + u.name + ' thăng lên cấp ' + (u.lv + 1) + (up.length ? ' (+' + up.join(', ') + ')' : ''), LD);
    const t = performance.now() + LD;
    FX.push({ x: u.x, y: u.y, t: 'Lên cấp!', c: '#f5cb5c', ts: t, big: true });
    burst(u.x, u.y, '#f5cb5c', 28, t, 85);
    setTimeout(() => AudioSystem.sfx.levelUp(), LD);
  }
}

function freeNear(x, y) {
  for (let r = 0; r < 8; r++) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && COST[terr(nx, ny)] < 9 && !at(nx, ny)) return [nx, ny];
      }
    }
  }
  return [0, 0];
}

function edgeSpawn(job, lv, n, items) {
  const o = [];
  for (let i = 0; i < n; i++) {
    const p = freeNear(rnd(MAP.w), Math.random() < 0.5 ? 0 : MAP.h - 1);
    const u = spawn(job, lv, 2, p[0], p[1], 110 + rnd(10), items);
    u.name = 'Quân Tiếp Viện';
    U.push(u); o.push(u);
  }
  return o;
}

async function startChap(i) {
  G.ch = i;
  CHAP = chapInfo(i);
  CHAP.noev = false;
  SpriteSystem.currentBiome = CHAP.biome || 'emerald';
  U = [];
  let place = null;

  if (i < 10) {
    const L = D.L[i];
    MAP = { w: L.w, h: L.h, t: L.tiles };
    const recs = L.units;
    for (const r of recs) {
      if (r.G == 0) {
        let u = G.roster.find(x => x.id == r.w);
        if (u) { u.x = r.H; u.y = r.I; }
        else { u = mkU(r, 0); G.roster.push(u); }
      } else {
        U.push(mkU(r, r.G == 1 ? 1 : 2));
      }
    }
    if (i == 0 && G.roster.length == 4) {
      G.roster.forEach(u => { u.mask = u.mask || MASKJ[u.job]; });
    }
  } else {
    const b = buildGen(i - 10);
    MAP = b.m; U = b.U; place = b.pos;
    const g = GEN[i - 10];
    g.ally.forEach(a => {
      if (!G.roster.find(x => x.id == a[0])) {
        const u = spawn(a[2], a[3], 0, 0, 0, a[0], a[4]);
        u.name = a[1]; u.ai = 0;
        G.roster.push(u);
      }
    });
    G.roster.forEach(u => { if (u.hp <= 0) u.hp = u.mhp; });
    G.roster.forEach((u, k) => {
      u.x = place[k % place.length][0];
      u.y = place[k % place.length][1];
    });
  }

  G.roster.forEach(u => { u.hp = u.mhp; u.done = false; u.team = 0; u.arenaFights = 0; });
  const used = new Set();
  G.roster.forEach(u => {
    if (!inb(u.x, u.y) || used.has(u.x + ',' + u.y) || COST[terr(u.x, u.y)] >= 9 || U.some(o => o.x == u.x && o.y == u.y)) {
      const p = freeNear(U.length ? 5 : 3, MAP.h - 3);
      u.x = p[0]; u.y = p[1];
    }
    used.add(u.x + ',' + u.y);
  });
  U = U.concat(G.roster);

  const dd = G.diff;
  U.forEach(u => {
    if (u.team == 2) {
      if (dd == 0) { u.mhp = Math.max(5, Math.floor(u.mhp * 0.85)); u.str = Math.max(0, u.str - 1); }
      if (dd == 2) { u.mhp = Math.ceil(u.mhp * 1.25); u.str += 2; u.def += 1; u.skl += 2; }
      u.hp = u.mhp;
    }
  });

  VIS = new Set();
  TURN = 1;
  PHASE = 'player';
  SEL = null;
  MODE = '';
  LOG = [];
  FX = [];
  CUR = { x: G.roster[0].x, y: G.roster[0].y };

  sizeCanvas();
  StorageSystem.save();

  AudioSystem.playBGM('bg_story');
  if (i == 0) await dlg([{ h: 'Khởi Đầu Huyền Thoại', t: S[289] }]);
  await dlg([{ h: 'Chương ' + (i + 1) + ': ' + CHAP.title, t: CHAP.intro + '\n\n{{target}} Mục Tiêu: ' + CHAP.goal }]);
  await dlg(CHAP.lines.map((t, k) => {
    const sp = getDialogueSpeaker(t, i, k);
    return { speaker: sp.name, p: sp.p, side: sp.side, title: sp.title, t };
  }));
  hud();
  playerStart();
}

async function playerStart() {

  if (LIM[G.ch] && TURN > LIM[G.ch]) { BUSY = true; over(false); return; }
  if (CHAP.surv && TURN > CHAP.surv) {
    if (G) { G.stats = G.stats || {}; G.stats.survived12 = true; }
    BUSY = true; over(true); return;
  }

  U.forEach(u => { if (u.team == 0) u.done = false; });
  SEL = null; MODE = '';
  BAN = { t: 'LƯỢT ' + TURN + ' · QUÂN TA', c: '37, 99, 235', ts: performance.now() };
  hud(); menu(); renderSide();
  log('— Lượt ' + TURN + ' (Quân ta) —');

  if (CHAP.surv && TURN > 1 && TURN % 2 === 0) {
    const jb = [5, 6, 7, 8, 9, 10, 11, 12][rnd(8)];
    edgeSpawn(jb, avgLv() + Math.floor(TURN / 3), 2 + Math.floor(TURN / 4), WSJ[jb]);
    log('{{warn}} Đợt quân địch thứ ' + (TURN / 2) + ' tràn vào thành!');
  }

  await rollEvent();
  hud(); menu();
}

async function enemyPhase() {
  PHASE = 'enemy';
  AudioSystem.playBGM('bg_bad');
  BUSY = true;
  BAN = { t: 'LƯỢT QUÂN ĐỊCH', c: '220, 38, 38', ts: performance.now() };
  hud(); menu();
  log('— Lượt quân địch —');
  await wait(800);

  const order = U.filter(u => u.hp > 0 && u.team != 0).sort((a, b) => a.team - b.team);
  for (const e of order) {
    if (e.hp <= 0) continue;
    await aiAct(e);
    if (checkEnd()) return;
    await wait(80);
  }

  BUSY = false;
  TURN++;
  playerStart();
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function aiAct(e) {
  const w = wpn(e);
  if (!w) return;
  const foes = U.filter(o => o.hp > 0 && hostile(o, e));
  if (!foes.length) return;

  const rc = reach(e);
  let best = null, bs = -1e9;
  for (const [k, c] of rc) {
    const [x, y] = k.split(',').map(Number);
    const save = [e.x, e.y];
    e.x = x; e.y = y;
    for (const d of targets(e, x, y)) {
      const f = forecast(e, d);
      let sc = f.dmg * f.hit / 100 + (d.hp <= f.dmg ? 70 : 0) + (d.id == 0 ? 30 : 0) - (f.counter ? f.ddmg * f.dhit / 100 * 0.7 : 0) + AVO[terr(x, y)] / 6;
      if (d.job == 1 || d.job == 4) sc += 20;
      if (sc > bs) { bs = sc; best = { x, y, d }; }
    }
    e.x = save[0]; e.y = save[1];
  }

  const go = async (x, y) => {
    if (x == e.x && y == e.y) return;
    const p = pathOf(rc, x, y);
    e.x = x; e.y = y; CUR = { x, y };
    await moveAnim(e, p);
  };

  if (!best) {
    const near = foes.reduce((m, o) => dist(e, o) < dist(e, m) ? o : m);
    const aggro = e.ai == 1 || dist(e, near) <= e.mov + iS(w.id)[4] + 3;
    if (!aggro) return;
    let bt = null, bd = dist(e, near);
    for (const [k] of rc) {
      const [x, y] = k.split(',').map(Number);
      const d = Math.abs(x - near.x) + Math.abs(y - near.y);
      if (d < bd) { bd = d; bt = { x, y }; }
    }
    if (bt) await go(bt.x, bt.y);
    return;
  }

  await go(best.x, best.y);
  CUR = { x: e.x, y: e.y };
  await wait(140);
  const n = battle(e, best.d);
  await wait(520 * n + 560);
}

function checkEnd() {
  const a = U.find(u => u.id == 0 && u.team == 0);
  if (!a || a.hp <= 0) {
    BUSY = true; over(false); return true;
  }
  if (CHAP.surv) return false;
  const B = (CHAP.boss && CHAP.boss.id) || BOSS[G.ch];
  if (!en().length || (B && !U.some(u => u.id == B && u.team == 2 && u.hp > 0))) {
    BUSY = true; over(true); return true;
  }
  return false;
}

    ]);
  }

  if (CHAP.end) {
    if (CHAP.routeKey) {
      G.endings = G.endings || [];
      if (!G.endings.includes(CHAP.routeKey)) G.endings.push(CHAP.routeKey);
    }

  }

  AchievementSystem.check();
  BUSY = false;

  let nx = NEXTC(G.ch)[0];

  if (G.ch == 10) {
    const c = await ask('{{scales}} Ngã Rẽ Định Mệnh',
      'Tàn quân Desai đã tan, nhưng hai con đường mở ra trước mắt Accor:\n\n• Aaron báo có một con rồng cổ đại thức tỉnh — đi theo con đường Hoàng gia.\n• Một lá thư bí mật của Malak mời Accor xuống thành phố ngầm — con đường Bóng tối.\n\n(Cả hai nhánh đều chơi được; nhánh còn lại sẽ mở sau khi hoàn thành nhánh này.)',
      ['{{swords}} Truy lùng Rồng cùng Aaron (Vương Đạo)', '{{moon}} Nhận lời mời bí mật của Malak (Giao Ước Hắc Ám)']);
    nx = c ? 13 : 11;
  }

  if (nx == null) {

const ARENA_MAX = 5; // số lượt Đấu Trường tối đa mỗi chương
function arena() {
  const us = G.roster;
  let h = '<h3>{{arena}} Đấu Trường</h3>' +
    '<div style="font-size:12px;color:var(--tx-sec);margin-bottom:8px;">Thử sức nhận thưởng. Tối đa ' + ARENA_MAX + ' lượt mỗi chương (có thu phí tham gia).</div>' +
    '<div class="box-list">' +
    us.map(x => {
      const fee = 150 + x.lv * 60;
      const count = x.arenaFights || 0;
      const hasWpn = !!wpn(x);
      const canPay = G.gold >= fee;
      const canFight = count < ARENA_MAX && hasWpn && canPay;
      let statusText = '';
      if (!hasWpn) statusText = 'Chưa có vũ khí';
      else if (count >= ARENA_MAX) statusText = 'Hết lượt (' + ARENA_MAX + '/' + ARENA_MAX + ')';
      else if (!canPay) statusText = 'Thiếu vàng (' + fee + 'v)';
      else statusText = 'Vào đấu (' + fee + 'v) · Lượt ' + (count + 1) + '/' + ARENA_MAX;
      return '<button data-u="' + x.id + '" class="btn" ' + (canFight ? '' : 'disabled') + '>' +
        '<span>' + x.name + ' · Cấp ' + (x.lv + 1) + '</span>' +
        '<span style="color:' + (canFight ? 'var(--gold-deep)' : 'var(--tx-mut)') + ';font-weight:700;">' + statusText + '</span>' +
      '</button>';
    }).join('') +
    '</div><button id="x" class="btn">Quay lại</button>';
  openBox(h);

  $('#box').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const p = G.roster.find(x => x.id == +b.dataset.u);
    if (!p || !wpn(p)) return;
    const fee = 150 + p.lv * 60;
    if (G.gold < fee) return;
    if ((p.arenaFights || 0) >= ARENA_MAX) return;

    // Trừ phí tham gia và cộng lượt đấu
    G.gold -= fee;
    p.arenaFights = (p.arenaFights || 0) + 1;

    const j = [5, 9, 8, 7, 10][rnd(5)], ws = { 5: [1], 9: [16], 8: [10], 7: [22], 10: [31] };
    const lv = Math.max(1, p.lv + 1);
    const a = JSON.parse(JSON.stringify(p)); a.hp = a.mhp; a.x = 1; a.y = 1; a.team = 0;
    const e = spawn(j, lv, 2, 1, 2, 60, [ws[j][0]]); e.name = 'Võ Sĩ Đấu Trường'; e.mhp += 6; e.hp = e.mhp;
    const save = { U, MAP };
    MAP = { w: 4, h: 4, t: new Array(16).fill(25) };
    U = [a, e];
    const near = iS(wpn(a).id)[4] >= 2 ? 2 : 1;
    e.x = 1; e.y = 1 + near;

    let r = 0; LOG = [];
    while (a.hp > 0 && e.hp > 0 && r++ < 12) {
      battle(a, e);
      if (a.hp > 0 && e.hp > 0) battle(e, a);
    }

    const win = a.hp > 0 && e.hp > 0 ? a.hp >= e.hp : a.hp > 0;
    const prize = win ? Math.floor(fee * 1.7) : 0;
    let exp = win ? Math.max(12, Math.floor((38 + (lv - p.lv) * 4) / Math.max(1, p.arenaFights))) : 0;

    if (win) {
      G.gold += prize;
      gain(p, exp);
      G.stats = G.stats || {};
      G.stats.arenaWins = (G.stats.arenaWins || 0) + 1;
      AchievementSystem.check();
    } else {
      p.hp = 1;
    }
    U = save.U; MAP = save.MAP;
    openBox(
      '<h3>' + (win ? '{{trophy}} Thắng Đấu Trường!' : '{{skull}} Thất Bại Đấu Trường') + '</h3>' +
      '<p>' + p.name + ' so tài cùng ' + e.name + ' (Cấp ' + (lv + 1) + ').</p>' +
      '<p>' + (win ? 'Thưởng: +' + prize + ' Vàng (lãi ' + (prize - fee) + 'v), +' + exp + ' Kinh nghiệm!' : 'Bị đánh bại! Mất ' + fee + ' Vàng tiền phí, sinh lực giảm còn 1.') + '</p>' +
      '<button id="x" class="btn pri">Tiếp tục</button>'
    );
    $('#x').onclick = () => arena();
  });
  $('#x').onclick = camp;
}
