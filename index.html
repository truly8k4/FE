/* ============================================================
   10. VIEWPORT PANORAMIC RENDERING ENGINE
   ============================================================ */
const cv = $('#cv'), cx = cv.getContext('2d');
let ZS = 3;
const LOGW = () => MAP ? MAP.w * T : 640;
const LOGH = () => MAP ? MAP.h * T + PY : 400;

function fit() {
  const st = $('#stage');
  const cs = getComputedStyle(st);
  const sw = st.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
  const sh = st.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  const lw = LOGW(), lh = LOGH();
  const k = Math.max(0.25, Math.min(sw / lw, sh / lh, 4));
  const dr = PERF.lite ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(lw * k), ch = Math.floor(lh * k);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  const w = Math.round(cw * dr), h = Math.round(ch * dr);
  if (cv.width != w || cv.height != h) { cv.width = w; cv.height = h; }
  ZS = cv.width / lw;
  const wr = $('#wrap');
  wr.style.width = cw + 'px'; wr.style.height = ch + 'px';
  if (MAP && SEL && MODE === 'act') menu();
}
const sizeCanvas = fit;

function rpos(u, ts) {
  const m = u.mv;
  if (m) {
    const i = (ts - m.t0) / m.per;
    if (i >= m.p.length - 1) u.mv = null;
    else if (i >= 0) {
      const k = Math.floor(i), f = i - k, a = m.p[k], b = m.p[k + 1];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    } else return [m.p[0][0], m.p[0][1]];
  }
  return [u.x, u.y];
}

const EY = [[5,0,5,1,5,2,12,2],[4,0,4,1,5,1,4,0],[6,0,6,1,5,1,13,2],[5,0,5,1,5,0,5,0],[8,2,8,3,5,1,5,1],[1,0,1,1,3,0,12,2],[1,0,1,1,1,1,0,0]];
const WA = [[3,3,1,9],[2,2,0,8],[7,7,5,9],[6,6,4,8],[14,14,10,12],[13,13,10,11]];
const WB = [[4,15,4,16,0,1,24,6],[3,14,4,15,0,1,26,9],[0,9,0,10,0,0,24,4],[2,16,2,17,2,3,25,7]];

function headZ(u) {
  const i = u.id, m = { 0: 0, 1: 3, 2: 8, 3: 1, 4: 9, 5: 2, 6: 10, 7: 11, 8: 12, 10: 7, 11: 1, 12: 10, 13: 11, 14: 2, 97: 5, 98: 5, 100: 4 };
  if (i in m) return m[i];
  if (i >= 101 && i <= 104) return 6 + (i % 2);
  return i < 20 ? 1 : i < 50 ? 7 : i < 70 ? 6 : i < 80 ? 7 : i < 90 ? 6 : 7;
}
const catOf = u => u.id == 100 ? 6 : CAT(u.job);
const HURL = u => {
  const h = SpriteSystem.getHead(headZ(u));
  return h ? (h.src || h.toDataURL()) : '';
};

function drawUnit(u, ts) {
  const e = u.team == 2, j = u.job, bj = CLS[j] ? CLS[j].sp : j, dead = u.hp <= 0;
  const atk = !!(u.atk && ts >= u.atk && ts - u.atk < 380);
  const ph = atk ? (ts - u.atk < 190 ? 2 : 3) : (Math.floor(ts / (u.mv ? 110 : 450)) % 2);
  const nm = ['stand1_', 'stand2_', 'attack1_', 'attack2_'][ph];
  let k = nm + j + (e ? '_e' : '');
  let f = u.team == 1 ? 'hue-rotate(95deg)' : '';

  let im = SpriteSystem.recolors[k] || SpriteSystem.raw[k];
  if (!(im && im.width)) {
    const alt = nm + j + (e ? '' : '_e');
    im = SpriteSystem.recolors[alt] || SpriteSystem.raw[alt];
    if (im && im.width) f = f || (e ? 'hue-rotate(150deg) saturate(1.6)' : 'hue-rotate(215deg)');
    else im = SpriteSystem.raw['stand1_' + j] || SpriteSystem.raw['stand1_1'];
  }
  if (!(im && im.width)) return;

  const rp = rpos(u, ts);
  let ox = rp[0] * T, oy = rp[1] * T;
  const bw = im.width, bh = im.height;

  if (atk && u.tgt) {
    const p = Math.sin((ts - u.atk) / 380 * Math.PI) * 8;
    ox += Math.sign(u.tgt[0] - u.x) * p;
    oy += Math.sign(u.tgt[1] - u.y) * p;
  }
  const bx = e ? ox + T - bw : ox, bot = oy + T;

  cx.save();
  let fl = (u.done && u.team == 0 ? 'grayscale(1) brightness(0.7) ' : '') + f;
  if (u.flash && ts >= u.flash && ts - u.flash < 250) fl = 'brightness(3)';
  if (dead && ts >= u.dieAt) {
    const p = Math.min(1, (ts - u.dieAt) / 450);
    cx.globalAlpha = 1 - p;
    fl = 'brightness(' + (1 + 2 * (1 - p)) + ')';
  }
  if (PERF.lite) { // chế độ nhẹ: bỏ bộ lọc sáng/xám nặng, chỉ giữ màu phe; đơn vị đã đi thì làm mờ
    fl = f;
    if (u.done && u.team == 0 && !dead) cx.globalAlpha = 0.55;
  }
  cx.filter = fl || 'none';

  if (!dead && !u.mv) {
    cx.fillStyle = 'rgba(0,0,0,0.22)';
    cx.beginPath();
    cx.ellipse(ox + T / 2, bot - 2, 9, 3, 0, 0, 7);
    cx.fill();
  }

  const hd = SpriteSystem.getHead(headZ(u)), o = EY[catOf(u)], hx = o[ph * 2], hy = o[ph * 2 + 1];
  if (hd && hd.width) cx.drawImage(hd, e ? ox + T - hx - hd.width : bx + hx, oy + hy - hd.height);
  cx.drawImage(im, bx, bot - bh);

  const w = wpn(u), ty = w ? iT(w.id) : 0;
  let A = null, B = null;
  if (w && (u.mask & ty)) {
    if (ty == 1) { A = WA[e ? 3 : 2]; B = WB[bj == 8 || bj == 12 ? 1 : 0]; }
    else if (ty == 2) { A = WA[e ? 5 : 4]; B = WB[bj == 8 || bj == 12 ? 2 : 0]; }
    else if (ty == 4) { A = WA[e ? 1 : 0]; B = WB[bj == 5 || bj == 9 ? 3 : 0]; }
  }
  if (A) {
    const wi = SpriteSystem.raw['weapon_' + A[ph]];
    if (wi && wi.width) cx.drawImage(wi, e ? ox + T - B[ph * 2] - wi.width : bx + B[ph * 2], bot - 37 + B[ph * 2 + 1]);
  }
  cx.restore();
}

function draw(ts) {
  ts = ts || performance.now();
  if (PERF.lite && ts - PERF.last < 30) { requestAnimationFrame(draw); return; } // chế độ nhẹ: tối đa ~30 khung hình/giây
  PERF.last = ts;
  const lw = LOGW(), lh = LOGH();

  if (MAP) {
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.clearRect(0, 0, cv.width, cv.height);
    let sx = 0, sy = 0;
    if (SHK && ts >= SHK.ts && ts - SHK.ts < SHK.dur) {
      const k = 1 - (ts - SHK.ts) / SHK.dur;
      sx = (Math.random() - 0.5) * 2 * SHK.a * k;
      sy = (Math.random() - 0.5) * 2 * SHK.a * k;
    }
    cx.setTransform(ZS, 0, 0, ZS, sx * ZS, (PY + sy) * ZS);
    cx.imageSmoothingEnabled = false;

    // Draw Map Tiles using Tinted Biome System
    for (let y = 0; y < MAP.h; y++) {
      for (let x = 0; x < MAP.w; x++) {
        const im = SpriteSystem.getTile(MAP.t[y * MAP.w + x]);
        if (im) cx.drawImage(im, x * T, y * T);
      }
    }

    const pu = 0.5 + 0.5 * Math.sin(ts / 240);
    const ov = (set, c, b) => {
      set.forEach(k => {
        const [x, y] = k.split(',').map(Number);
        cx.fillStyle = c; cx.fillRect(x * T, y * T, T, T);
        cx.strokeStyle = b; cx.lineWidth = 1;
        cx.strokeRect(x * T + 0.5, y * T + 0.5, T - 1, T - 1);
      });
    };

    if (RNG) ov(RNG, MODE === 'warp' ? 'rgba(124, 58, 237, ' + (0.3 + 0.14 * pu) + ')' : 'rgba(59, 130, 246, ' + (0.28 + 0.12 * pu) + ')', MODE === 'warp' ? 'rgba(196, 181, 253, 0.95)' : 'rgba(147, 197, 253, 0.9)');
    if (MODE === 'target' && ATK) {
      ATK.forEach(o => {
        cx.fillStyle = 'rgba(239, 68, 68, ' + (0.35 + 0.2 * pu) + ')';
        cx.fillRect(o.x * T, o.y * T, T, T);
        cx.strokeStyle = '#fca5a5';
        cx.strokeRect(o.x * T + 0.5, o.y * T + 0.5, T - 1, T - 1);
      });
    }
    if (MODE === 'act' && SEL) {
      const w = wpn(SEL);
      if (w) ov(atkTiles(SEL, SEL.x, SEL.y, w), 'rgba(239, 68, 68, 0.22)', 'rgba(252, 165, 165, 0.6)');
    }

    // Cursor (ô vuông viền vàng di chuyển xếp sau các nhân vật)
    const pl = 2 + Math.sin(ts / 150);
    cx.strokeStyle = '#f5cb5c';
    cx.lineWidth = 2;
    cx.strokeRect(CUR.x * T + pl / 2, CUR.y * T + pl / 2, T - pl, T - pl);

    // Units
    const us = U.filter(u => u.hp > 0 || (u.dieAt && ts < u.dieAt + 450)).sort((a, b) => rpos(a, ts)[1] - rpos(b, ts)[1]);
    for (const u of us) {
      drawUnit(u, ts);
      if (u.hp <= 0 && ts >= u.dieAt) continue;
      const rp = rpos(u, ts), tg = dispHP(u, ts);
      u.dh = u.dh == null ? tg : u.dh + (tg - u.dh) * 0.2;
      cx.fillStyle = 'rgba(0,0,0,0.6)';
      cx.fillRect(rp[0] * T + 2, rp[1] * T + T - 3, T - 4, 3);
      cx.fillStyle = u.team == 2 ? '#ef4444' : u.team == 1 ? '#10b981' : '#3b82f6';
      cx.fillRect(rp[0] * T + 2, rp[1] * T + T - 3, Math.max(0, (T - 4) * u.dh / u.mhp), 3);
    }

    // Particle & Spell effects
    EFF = EFF.filter(f => ts - f.ts < (f.k == 'crit' ? 950 : 420));
    for (const f of EFF) {
      const dt = ts - f.ts;
      if (dt < 0) continue;
      const c0 = f.x * T + T / 2, c1 = f.y * T + T / 2;
      if (f.k == 'slash') {
        const p = Math.min(1, dt / 150);
        cx.save();
        cx.globalAlpha = Math.max(0, 1 - dt / 420);
        cx.lineCap = 'round';
        cx.strokeStyle = f.crit ? '#f5cb5c' : '#ffffff';
        cx.lineWidth = f.crit ? 5 : 3;
        cx.shadowColor = f.crit ? '#d49a24' : '#93c5fd';
        cx.shadowBlur = PERF.lite ? 0 : 8;
        for (const o of f.crit ? [-3, 3] : [0]) {
          cx.beginPath();
          cx.moveTo(c0 - 12 + o, c1 - 14);
          cx.lineTo(c0 - 12 + o + 26 * p, c1 - 14 + 28 * p);
          cx.stroke();
        }
        cx.restore();
      } else if (f.k == 'bolt') {
        const p = Math.min(1, dt / 220), x0 = f.x0 * T + T / 2, y0 = f.y0 * T + T / 2;
        cx.save();
        cx.fillStyle = f.c; cx.shadowColor = f.c; cx.shadowBlur = PERF.lite ? 0 : 10;
        cx.beginPath();
        cx.arc(x0 + (c0 - x0) * p, y0 + (c1 - y0) * p - 4, 4, 0, 7);
        cx.fill();
        cx.restore();
      } else if (f.k == 'crit') {
        cx.save();
        cx.translate(c0, c1 - 6);
        cx.globalAlpha = Math.max(0, 1 - dt / 500);
        cx.strokeStyle = '#f5cb5c';
        cx.lineWidth = 2;
        const r = 8 + Math.min(1, dt / 350) * 28;
        for (let i = 0; i < 10; i++) {
          const a = i * Math.PI / 5 + 0.3;
          cx.beginPath();
          cx.moveTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
          cx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          cx.stroke();
        }
        cx.restore();
      }
    }

    PT = PT.filter(p => ts - p.ts < p.life);
    for (const p of PT) {
      const dt = ts - p.ts;
      if (dt < 0) continue;
      const q = dt / 1000;
      cx.globalAlpha = 1 - dt / p.life;
      cx.fillStyle = p.c;
      cx.fillRect(p.x + p.vx * q, p.y + p.vy * q + 90 * q * q, p.s, p.s);
    }
    cx.globalAlpha = 1;

    // Floating combat text
    FX = FX.filter(f => ts - f.ts < (f.life || 1300));
    cx.textAlign = 'center';
    FX.forEach(f => {
      if (ts < f.ts) return;
      const a = (ts - f.ts) / (f.life || 1300);
      const y = f.y * T - 4 - a * (f.big ? 12 : 24) - (f.dy || 0);
      cx.globalAlpha = Math.min(1, (1 - a) * 1.6);
      cx.lineWidth = 3; cx.strokeStyle = '#000000';
      if (f.crit) {
        cx.save();
        cx.lineJoin = 'round';
        cx.font = 'bold 20px "Be Vietnam Pro", sans-serif';
        const tw = cx.measureText(f.t).width, r = 12, x0 = f.x * T + T / 2 + (f.dx || 0) - (r * 2 + 4 + tw) / 2;
        const pop = 1 + Math.max(0, 1 - (ts - f.ts) / 160) * 0.7, sx = x0 + r, sy = y - 7;
        const spike = (rr, n) => {
          cx.beginPath();
          for (let i = 0; i < n * 2; i++) {
            const g = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? rr * 0.42 : rr;
            cx.lineTo(sx + Math.cos(g) * q, sy + Math.sin(g) * q);
          }
          cx.closePath();
        };
        spike(r * pop, 8); cx.stroke(); cx.fillStyle = '#fde047'; cx.fill();
        spike(r * pop * 0.5, 8); cx.fillStyle = '#b91c1c'; cx.fill();
        cx.textAlign = 'left';
        cx.strokeText(f.t, x0 + r * 2 + 4, y);
        cx.fillStyle = f.c; cx.fillText(f.t, x0 + r * 2 + 4, y);
        cx.restore();
      } else {
        cx.font = 'bold ' + (f.big ? 15 : 11) + 'px "Be Vietnam Pro", sans-serif';
        cx.strokeText(f.t, f.x * T + T / 2, y);
        cx.fillStyle = f.c;
        cx.fillText(f.t, f.x * T + T / 2, y);
      }
      cx.globalAlpha = 1;
    });

    if (FLS && ts >= FLS.ts && ts - FLS.ts < FLS.dur) {
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.globalAlpha = 0.5 * (1 - (ts - FLS.ts) / FLS.dur);
      cx.fillStyle = FLS.c;
      cx.fillRect(0, 0, cv.width, cv.height);
      cx.globalAlpha = 1;
    }

    if (BAN && ts - BAN.ts < 1500) {
      const p = (ts - BAN.ts) / 1500, e = p < 0.2 ? p / 0.2 : p > 0.8 ? (1 - p) / 0.2 : 1;
      const bh = 38, y = lh / 2 - bh / 2;
      cx.setTransform(ZS, 0, 0, ZS, 0, 0);
      cx.globalAlpha = e;
      const g = cx.createLinearGradient(0, 0, lw, 0);
      g.addColorStop(0, 'rgba(' + BAN.c + ', 0)');
      g.addColorStop(0.2, 'rgba(' + BAN.c + ', 0.95)');
      g.addColorStop(0.8, 'rgba(' + BAN.c + ', 0.95)');
      g.addColorStop(1, 'rgba(' + BAN.c + ', 0)');
      cx.fillStyle = g; cx.fillRect(0, y, lw, bh);
      cx.fillStyle = '#ffffff';
      cx.font = 'bold 16px "Playfair Display", serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(BAN.t, lw / 2 - (1 - e) * 35, lh / 2 + 1);
      cx.textBaseline = 'alphabetic';
      cx.globalAlpha = 1;
    }
  } else {
    cx.setTransform(ZS, 0, 0, ZS, 0, 0);
    cx.imageSmoothingEnabled = false;
    cx.fillStyle = '#f8f5ee';
    cx.fillRect(0, 0, 640, 400);
    const im = SpriteSystem.raw.title0;
    if (im && im.width) {
      cx.globalAlpha = 0.25;
      cx.drawImage(im, 320 - im.width * 1.1, 15, im.width * 2.2, im.height * 2.2);
      cx.globalAlpha = 1;
    }
    for (let i = 0, n = PERF.lite ? 14 : 46; i < n; i++) {
      const sp = 0.012 * (1 + i % 4);
      const x = (i * 83.7 + Math.sin(ts / 1700 + i) * 16) % 640;
      const y = 400 - ((ts * sp * 3 + i * 61) % 430);
      cx.globalAlpha = 0.25 + 0.5 * ((i * 7) % 5) / 5;
      cx.fillStyle = i % 3 ? '#d49a24' : '#f5cb5c';
      cx.fillRect(x, y, 2.5, 2.5);
    }
    cx.globalAlpha = 1;
  }
  requestAnimationFrame(draw);
}

function click(e) {
  if (!MAP || BUSY || PHASE !== 'player' || $('#modal').classList.contains('on')) return;
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * (MAP.w * T);
  const py = (e.clientY - r.top) / r.height * (MAP.h * T + PY) - PY;
  let x = Math.floor(px / T), y = Math.floor(py / T);
  if (!inb(x, y)) return;

  const hit = U.filter(u => u.hp > 0).sort((a, b) => b.y - a.y).find(u => px >= u.x * T && px < u.x * T + T && py >= u.y * T - 12 && py < u.y * T + T);
  if (hit && !((MODE === 'move' || MODE === 'warp') && RNG && RNG.has(x + ',' + y))) {
    x = hit.x; y = hit.y;
  }

  CUR = { x, y };
  const o = at(x, y);

  if (MODE === 'move') {
    const k = x + ',' + y;
    if (RNG && RNG.has(k)) {
      const u = SEL, p = pathOf(PREVM, x, y);
      ORIG = [u.x, u.y];
      RNG = null;
      u.x = x; u.y = y;
      (async () => {
        BUSY = true; menu();
        await moveAnim(u, p);
        BUSY = false;
        MODE = 'act';
        menu(); renderSide();
      })();
      return;
    }
    if (o && o.team === 0 && !o.done) {
      select(o); return;
    }
    SEL = null; RNG = null; MODE = '';
    menu(); renderSide();
    return;
  }

  if (MODE === 'warp') {
    if (WARP && RNG && RNG.has(x + ',' + y)) castWarp(WARP.u, WARP.s, WARP.o, x, y);
    return;
  }

  if (MODE === 'target') {
    if (o && ATK.includes(o)) {
      confirmAtk(SEL, o);
    }
    return;
  }

  if (MODE === 'act') {
    renderSide(); return;
  }

  if (o && o.team === 0 && !o.done) {
    select(o);
  } else {
    renderSide();
  }
}

function select(u) {
  AudioSystem.sfx.click();
  SEL = u; MODE = 'move';
  const rc = reach(u);
  PREVM = rc;
  RNG = new Set(rc.keys());
  ORIG = [u.x, u.y];
  menu(); renderSide();
}

function doCancel() {
  if (BUSY || PHASE !== 'player') return;
  AudioSystem.sfx.cancel();
  if (MODE === 'act') {
    const u = SEL;
    u.x = ORIG[0]; u.y = ORIG[1];
    SEL = null; RNG = null; ATK = null; MODE = '';
  } else if (MODE === 'target') {
    MODE = 'act'; ATK = null;
  } else if (MODE === 'warp') {
    MODE = 'act'; RNG = null; WARP = null;
  } else {
    SEL = null; RNG = null; ATK = null; MODE = '';
  }
  menu(); renderSide();
}

function menu() {
  const m = $('#menu'), cb = $('#cancel');
  m.innerHTML = '';
  const add = (t, f, c) => {
    const b = document.createElement('button');
    b.innerHTML = t; b.onclick = f;
    b.className = 'btn ' + (c || '');
    m.appendChild(b);
  };

  const show = PHASE === 'player' && !BUSY && SEL && MAP;
  cb.style.display = show ? 'block' : 'none';
  if (!show) { m.style.display = 'none'; return; }

  cb.innerHTML = MODE === 'act' ? '{{undo}} Hoàn tác di chuyển (Esc)' : (MODE === 'target' || MODE === 'warp') ? '{{undo}} Chọn lại hành động (Esc)' : '{{undo}} Bỏ chọn (Esc)';
  cb.onclick = doCancel;

  if (MODE !== 'act') { m.style.display = 'none'; return; }
  const u = SEL;
  if (weapons(u).some(w => targetsWith(u, u.x, u.y, w).length)) {
    add('{{swords}} ' + S[24], () => attackMenu(u), 'pri');
  }
  if (stfs(u).some(s => staffTargets(u, s).length)) {
    add('{{heal}} Dùng Gậy', () => useStaff());
  }
  if (MAP.t[u.y * MAP.w + u.x] == 5 && !VIS.has(u.x + ',' + u.y)) {
    add('{{cottage}} Vào Nhà Dân', () => visit(u));
  }
  if (U.some(o => o.hp > 0 && o.team == 0 && o !== u && dist(o, u) == 1)) {
    add('{{trade}} Trao Đổi Binh Khí', () => trade(u));
  }
  if (u.inv.length) add('{{pack}} Túi Đồ', invMenu);
  add('{{pause}} Chờ Đợi', () => finish(u));

  m.style.display = 'flex';
  const r = cv.getBoundingClientRect(), w = $('#wrap').getBoundingClientRect();
  const k = r.width / (MAP.w * T);
  const ox = r.left - w.left, oy = r.top - w.top;
  const mw = m.offsetWidth, mh = m.offsetHeight;
  const tk = T * k, ux = ox + u.x * T * k, uy = oy + (u.y * T + PY) * k;

  const cand = [
    [ux + tk + 6, uy], [ux - mw - 6, uy],
    [ux + tk + 6, uy + tk - mh], [ux - mw - 6, uy + tk - mh],
    [ux, uy + tk + 6], [ux, uy - mh - 6]
  ];
  let best = null, bs = 1e18;
  const ov = (x, y, px, py) => Math.max(0, Math.min(x + mw, px + tk) - Math.max(x, px)) * Math.max(0, Math.min(y + mh, py + tk) - Math.max(y, py));
  for (const [x0, y0] of cand) {
    const x = Math.max(4, Math.min(x0, w.width - mw - 4));
    const y = Math.max(4, Math.min(y0, w.height - mh - 4));
    let sc = ov(x, y, ux, uy) * 4;
    for (const o of U) {
      if (o.hp <= 0 || o === u) continue;
      sc += ov(x, y, ox + o.x * T * k, oy + (o.y * T + PY) * k) * (hostile(o, u) ? 3 : 1);
    }
    if (sc < bs) { bs = sc; best = [x, y]; }
  }
  m.style.left = (best ? best[0] : 10) + 'px';
  m.style.top = (best ? best[1] : 10) + 'px';
}

function visit(u) {
  VIS.add(u.x + ',' + u.y);
  AudioSystem.sfx.heal();
  const r = rnd(10);
  let t;
  if (r < 5) {
    const g = 300 + rnd(800); G.gold += g;
    t = 'Dân làng Ramsey ủng hộ quân nghĩa dũng: +' + g + ' vàng!';
  } else if (r < 8) {
    if (u.inv.length < 6) {
      u.inv.push({ id: 41, u: 3 });
      t = 'Trưởng làng tặng nghĩa quân 1 Bình Máu!';
    } else t = 'Dân làng cầu nguyện ban phước lành cho chiến binh!';
  } else {
    gain(u, 35);
    t = 'Học hỏi bí kíp chiến thuật dân gian: +' + 35 + ' EXP!';
  }
  log('{{cottage}} ' + t);
  dlg([{ h: '{{cottage}} ' + S[23], t }]).then(() => runPromotions()).then(() => finish(u));
}

function trade(u, o) {
  const ns = U.filter(x => x.hp > 0 && x.team == 0 && x !== u && dist(x, u) == 1);
  if (!ns.length) return;
  o = o || ns[0];
  const L = (a, k) => a.inv.map((it, i) => '<button data-' + k + '="' + i + '" class="btn"><span>' + iN(it.id) + '</span><span style="color:var(--tx-mut);">' + (iT(it.id) <= 32 ? it.u : '') + '</span></button>').join('') || '<span style="color:var(--tx-mut);">(Trống)</span>';
  openBox(
    '<h3>{{trade}} ' + S[31] + '</h3>' +
    '<div class="box-list" style="flex-direction:row;flex-wrap:wrap;">' + ns.map(x => '<button data-o="' + x.id + '" class="btn ' + (x === o ? 'pri' : '') + '">' + x.name + '</button>').join('') + '</div>' +
    '<b>' + u.name + ' {{arrow}} ' + o.name + '</b><div class="box-list">' + L(u, 'a') + '</div>' +
    '<b>' + o.name + ' {{arrow}} ' + u.name + '</b><div class="box-list">' + L(o, 'b') + '</div>' +
    '<button id="x" class="btn pri">Xong</button>'
  );
  const B = $('#box');
  B.querySelectorAll('[data-o]').forEach(b => b.onclick = () => trade(u, ns.find(x => x.id == +b.dataset.o)));
  B.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if (o.inv.length < 6) {
      o.inv.push(u.inv.splice(+b.dataset.a, 1)[0]);
      trade(u, o);
    }
  });
  B.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    if (u.inv.length < 6) {
      u.inv.push(o.inv.splice(+b.dataset.b, 1)[0]);
      trade(u, o);
    }
  });
  $('#x').onclick = () => { closeBox(); menu(); renderSide(); };
}

function finish(u) {
  u.done = true;
  SEL = null; MODE = '';
  menu(); renderSide();
  if (checkEnd()) return;
  if (!U.some(x => x.team === 0 && x.hp > 0 && !x.done)) endTurn();
}

function attackMenu(u) {
  const ws = weapons(u).filter(w => targetsWith(u, u.x, u.y, w).length);
  if (!ws.length) return;
  const go = w => {
    if (w !== wpn(u)) { // trang bị vũ khí đã chọn làm vũ khí chính
      u.inv.splice(u.inv.indexOf(w), 1); u.inv.unshift(w);
      AudioSystem.sfx.equip();
    }
    MODE = 'target'; ATK = targets(u, u.x, u.y);
    menu(); renderSide();
  };
  if (ws.length === 1) return go(ws[0]);
  let h = '<h3>' + u.name + ' – Chọn Vũ Khí</h3><div class="box-list">';
  ws.forEach((w, k) => {
    const s = iS(w.id), mg = iT(w.id) == 16, pw = (mg ? u.mag : u.str) + s[0];
    const rg = s[3] == s[4] ? s[3] : s[3] + '-' + s[4];
    h += '<button data-w="' + k + '" class="btn"><span>' + (w === wpn(u) ? '{{swords}} ' : '') + iN(w.id) + '</span>' +
      '<span style="color:var(--tx-mut);">Lực ' + pw + ' · Tầm ' + rg + ' · ' + w.u + ' lượt · ' + targetsWith(u, u.x, u.y, w).length + ' mục tiêu</span></button>';
  });
  h += '</div><button id="x" class="btn">Quay lại</button>';
  openBox(h);
  $('#box').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { closeBox(); go(ws[+b.dataset.w]); });
  $('#x').onclick = closeBox;
}

function useStaff(sel) {
  const u = SEL;
  if (!u) return;
  const ok = stfs(u).filter(s => staffTargets(u, s).length);
  if (!ok.length) return;
  // Bước 1: chọn gậy (nếu có nhiều hơn 1 cây dùng được)
  if (!sel && ok.length > 1) {
    let h = '<h3>' + u.name + ' – Chọn Gậy</h3><div class="box-list">';
    ok.forEach((s, k) => {
      h += '<button data-s="' + k + '" class="btn"><span>{{heal}} ' + iN(s.id) + '</span>' +
        '<span style="color:var(--tx-mut);font-size:12px;">' + staffBrief(s, u) + ' · ' + s.u + ' lần</span></button>';
    });
    h += '</div><button id="x" class="btn">Quay lại</button>';
    openBox(h);
    $('#box').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { closeBox(); useStaff(ok[+b.dataset.s]); });
    $('#x').onclick = closeBox;
    return;
  }
  const s = sel || ok[0], c = staffTargets(u, s), kd = stfDef(s).k;
  if (!c.length) return;
  // Đũa phép diện rộng: hồi cho tất cả cùng lúc, không cần chọn mục tiêu
  if (kd === 'aoe') return castStaff(u, s, c);
  // Bước 2: chọn mục tiêu (nếu có nhiều hơn 1 người trong tầm)
  if (c.length === 1) return staffOn(u, s, c[0]);
  const note = o => kd === 'repair' ? repairable(o).length + ' binh khí hư hại'
    : kd === 'warp' ? o.hp + '/' + o.mhp + ' HP'
    : o.hp + '/' + o.mhp + ' HP · +' + Math.min(staffHeal(s, u), o.mhp - o.hp);
  let h = '<h3>' + iN(s.id) + ' – Chọn Mục Tiêu</h3><div class="box-list">';
  c.forEach((o, k) => {
    h += '<button data-t="' + k + '" class="btn"><span>' + o.name + '</span><span style="color:var(--tx-mut);">' + note(o) + '</span></button>';
  });
  h += '</div><button id="x" class="btn">Quay lại</button>';
  openBox(h);
  $('#box').querySelectorAll('[data-t]').forEach(b => {
    b.onmouseenter = () => { const o = c[+b.dataset.t]; CUR = { x: o.x, y: o.y }; }; // gậy tầm xa: chỉ rõ người ở đâu trên bản đồ
    b.onclick = () => { closeBox(); staffOn(u, s, c[+b.dataset.t]); };
  });
  $('#x').onclick = closeBox;
}

function staffOn(u, s, o) {
  const kd = stfDef(s).k;
  if (kd === 'repair') return repairPick(u, s, o);
  if (kd === 'warp') return warpPick(u, s, o);
  castStaff(u, s, o);
}

// Kết thúc 1 lần dùng gậy: trừ độ bền, cộng EXP, nhận thăng tiến nếu đủ cấp rồi mới hết lượt
function endStaff(u, s, list, isHeal) {
  s.u--;
  if (s.u <= 0) {
    u.inv = u.inv.filter(i => i !== s);
    log(u.name + ' mất ' + iN(s.id) + ' (hết lượt dùng).');
  }
  const exp = list.reduce((m, o, i) => i ? m + 3 : BalanceSystem.getStaffExp(u, o), 0);
  gain(u, Math.min(exp, 30));
  G.stats = G.stats || {};
  if (isHeal) G.stats.heals = (G.stats.heals || 0) + 1;
  AchievementSystem.check();
  runPromotions().then(() => finish(u));
}

// Hồi máu (1 người) hoặc hồi diện rộng (mảng người)
function castStaff(u, s, tg) {
  const list = Array.isArray(tg) ? tg : [tg], amt = staffHeal(s, u), t0 = performance.now();
  let total = 0;
  list.forEach((o, i) => {
    const hp = Math.min(o.mhp, o.hp + amt), g = hp - o.hp;
    o.hp = hp; o.hl = null; total += g;
    FX.push({ x: o.x, y: o.y, t: '+' + g, c: '#10b981', ts: t0 + i * 120 });
    burst(o.x, o.y, '#10b981', 18, t0 + i * 120, 55);
  });
  AudioSystem.sfx.heal();
  log(u.name + ' dùng ' + iN(s.id) + ' hồi ' + total + ' HP cho ' + (list.length > 1 ? list.length + ' đồng đội' : list[0].name) + '.');
  endStaff(u, s, list, true);
}

// Gậy sửa chữa: chọn binh khí hư hại rồi phục hồi đầy độ bền
function repairPick(u, s, o) {
  const dm = repairable(o);
  if (dm.length === 1) return castRepair(u, s, o, dm[0]);
  let h = '<h3>' + iN(s.id) + ' – Chọn Binh Khí Của ' + o.name + '</h3><div class="box-list">';
  dm.forEach((it, k) => {
    h += '<button data-r="' + k + '" class="btn"><span>' + iN(it.id) + '</span><span style="color:var(--tx-mut);">' + it.u + '/' + iS(it.id)[6] + ' lần</span></button>';
  });
  h += '</div><button id="x" class="btn">Quay lại</button>';
  openBox(h);
  $('#box').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { closeBox(); castRepair(u, s, o, dm[+b.dataset.r]); });
  $('#x').onclick = closeBox;
}

function castRepair(u, s, o, it) {
  const mx = iS(it.id)[6] || it.u, add = mx - it.u, t0 = performance.now();
  it.u = mx;
  AudioSystem.sfx.heal();
  FX.push({ x: o.x, y: o.y, t: 'Sửa +' + add, c: '#fbbf24', ts: t0 });
  burst(o.x, o.y, '#fbbf24', 20, t0, 60);
  log(u.name + ' dùng ' + iN(s.id) + ' sửa ' + iN(it.id) + ' của ' + o.name + ' (' + mx + '/' + mx + ' lần).');
  endStaff(u, s, [o], false);
}

// Gậy dịch chuyển: chọn ô đích trên bản đồ (các ô tím)
function warpPick(u, s, o) {
  const tiles = warpTiles(u);
  if (!tiles.size) return;
  WARP = { u, s, o };
  MODE = 'warp'; RNG = tiles; ATK = null;
  BAN = { t: 'CHỌN Ô ĐÍCH CHO ' + o.name.toUpperCase(), c: '124, 58, 237', ts: performance.now() };
  menu(); renderSide();
}

function castWarp(u, s, o, x, y) {
  const t0 = performance.now(), ox = o.x, oy = o.y;
  burst(ox, oy, '#a78bfa', 22, t0, 70);
  FX.push({ x: ox, y: oy, t: 'Dịch chuyển', c: '#c4b5fd', ts: t0 });
  o.x = x; o.y = y; o.mv = null;
  burst(x, y, '#a78bfa', 26, t0 + 120, 80);
  FX.push({ x, y, t: 'Xuất hiện!', c: '#c4b5fd', ts: t0 + 120, big: true });
  AudioSystem.sfx.magic(true);
  CUR = { x, y };
  RNG = null; WARP = null; MODE = '';
  log(u.name + ' dùng ' + iN(s.id) + ' đưa ' + o.name + ' tới ô (' + (x + 1) + ', ' + (y + 1) + ').');
  endStaff(u, s, [o], false);
}

function itemAct(u, k) {
  const it = u.inv[k], t = iT(it.id);
  let h = '<h3>' + iN(it.id) + '</h3>' + (t === 32 ? '<div class="box-desc" style="font-size:12.5px;">' + staffBrief(it, u) + '</div>' : '') + '<div class="box-list">';
  if (t < 32 && (u.mask & t)) h += '<button id="eq" class="btn pri">Trang bị vũ khí chính</button>';
  if (t === 64) h += '<button id="us" class="btn pri">Sử dụng dược phẩm</button>';
  h += '<button id="st" class="btn">Gửi vào kho chung</button><button id="dr" class="btn danger">Vứt bỏ</button></div><button id="x" class="btn">Đóng</button>';
  openBox(h);
  const R = () => { closeBox(); menu(); renderSide(); };
  if ($('#eq')) $('#eq').onclick = () => {
    u.inv.splice(k, 1); u.inv.unshift(it);
    AudioSystem.sfx.equip(); R();
  };
  if ($('#us')) $('#us').onclick = () => {
    useItem(u, it);
    u.inv.splice(u.inv.indexOf(it), 1);
    AudioSystem.sfx.heal(); R(); finish(u);
  };
  $('#st').onclick = () => {
    u.inv.splice(k, 1); G.stash.push(it);
    AudioSystem.sfx.click(); R();
  };
  $('#dr').onclick = () => {
    u.inv.splice(k, 1);
    AudioSystem.sfx.cancel(); R();
  };
  $('#x').onclick = closeBox;
}

function useItem(u, it) {
  const id = it.id, v = ['str', 'skl', 'spd', 'lck', 'def', 'mag', 'mhp', 'mov'];
  if (id == 41) u.hp = Math.min(u.mhp, u.hp + 10);
  else if (id == 42) u.hp = u.mhp;
  else if (id == 60) u.hp = Math.min(u.mhp, u.hp + 20);
  else if (id >= 43 && id <= 50) {
    const k = v[id - 43];
    u[k] += (k == 'mhp' ? 5 : k == 'mov' ? 2 : 3);
    if (k == 'mhp') u.hp += 5;
  } else if (id == 62) {
    ['str', 'skl', 'spd', 'lck', 'def', 'mag'].forEach(k => u[k]++);
  }
  FX.push({ x: u.x, y: u.y, t: '✦ Thần Dược!', c: '#f5cb5c', ts: performance.now(), big: true });
  log(u.name + ' sử dụng ' + iN(id));
}

function getDialogueSpeaker(text, chapterIdx, lineIdx) {
  const t = text || '';
  // Accor is ALWAYS blue armor, blue hair: portrait index 0 (portraits0)
  if (t.includes('Accor, có tin xấu') || t.includes('Không còn thời gian đâu Accor')) {
    return { name: 'Trinh Sát Ramsey', p: 1, side: 'green', title: 'Nghĩa Quân Làng' };
  }
  if (t.includes('Bình tĩnh nào') || t.includes('Bị bao vây rồi') || t.includes('Dân làng sẽ biết cách giúp') || t.includes('Ở phía nam ngôi làng') || t.includes('Tên ta là Accor') || t.includes('Nếu ngươi thắng') || t.includes('Từ nay ta không phải hoàng tử') || t.includes('Hôm nay, kiếm của Sofia') || t.includes('Hàng phòng ngự đã bị phá vỡ') || t.includes('Nghĩa quân đang nổi lên')) {
    return { name: 'Hoàng Tử Accor', p: 0, side: 'blue', title: 'Chỉ Huy · Áo Xanh Dương' };
  }
  if (t.includes('Các anh em, hãy tiến lên') || t.includes('đốt hết nhà cho ta') || t.includes('giết không tha')) {
    return { name: 'Tướng Cướp Gisborne', p: 3, side: 'red', title: 'Thủ Lĩnh Sơn Tặc' };
  }
  if (t.includes('Tên khốn Slade') || t.includes('Khốn kiếp, bọn phiến quân') || t.includes('tiếp viện')) {
    return { name: 'Chỉ Huy Quân Desai', p: 4, side: 'red', title: 'Đế Chế Gailu' };
  }
  if (t.includes('thương nhân sống ẩn dật') || t.includes('Aaron')) {
    return { name: 'Thương Nhân Aaron', p: 1, side: 'gold', title: 'Thương Nhân Ẩn Dật' };
  }
  if (t.includes('ngứa ngáy chân tay')) {
    return { name: 'Chiến Binh Gray', p: 1, side: 'blue', title: 'Nghĩa Quân Ramsey' };
  }
  if (t.includes('thận trọng không thừa')) {
    return { name: 'Cung Thủ Tobin', p: 1, side: 'blue', title: 'Nghĩa Quân Ramsey' };
  }
  if (t.includes('Các cậu tự tin quá')) {
    return { name: 'Nữ Tu Silke', p: 2, side: 'purple', title: 'Thánh Điện Sofia' };
  }
  if (t.includes('Malak') || t.includes('Lilith') || t.includes('cấm thuật')) {
    return { name: 'Tể Tướng Malak', p: 5, side: 'purple', title: 'Pháp Sư Bí Ẩn' };
  }

  // Fallback: If lineIdx is even, Accor (BLUE, portraits0) speaks!
  if (lineIdx % 2 === 0) {
    return { name: 'Hoàng Tử Accor', p: 0, side: 'blue', title: 'Chỉ Huy · Áo Xanh Dương' };
  } else {
    const oppPortraits = [1, 2, 3, 4, 5];
    const oppP = oppPortraits[chapterIdx % oppPortraits.length];
    const oppNames = ['Đồng Đội Nghĩa Quân', 'Dân Làng Ramsey', 'Tướng Cướp Đầm Lầy', 'Tướng Quân Gailu', 'Pháp Sư Hư Không'];
    return { name: oppNames[chapterIdx % oppNames.length], p: oppP, side: oppP >= 3 ? 'red' : 'green', title: 'Nhân Vật Chiến Trường' };
  }
}

function dlg(lines, btn) {
  return new Promise(res => {
    let i = 0;
    const show = () => {
      const l = lines[i];
      // Resolve speaker info accurately
      let speaker = l.speaker;
      let p = l.p;
      let side = l.side;
      let title = l.title;

      if (!speaker) {
        const info = getDialogueSpeaker(l.t, G ? G.ch : 0, i);
        speaker = info.name;
        p = (l.p != null ? l.p : info.p);
        side = info.side;
        title = info.title;
      }

      // ACCOR ENFORCEMENT: If speaker is Accor, ALWAYS force portrait 0 (blue)
      if (speaker.includes('Accor')) {
        p = 0;
        side = 'blue';
        title = title || 'Chỉ Huy · Áo Xanh Dương';
      }

      const sigil = side === 'blue' ? '{{star4}}' : side === 'red' ? '{{swords}}' : side === 'purple' ? '{{star4o}}' : '{{lily}}';

      openBox(
        '<h3>{{gems}} ' + (l.h || 'Đối Thoại Chiến Trường') + '</h3>' +
        '<div class="dlg-speaker-tag ' + (side || 'blue') + '">' +
          '<span>' + sigil + '</span> ' + speaker +
          (title ? ' <span style="font-size:10.5px;opacity:0.85;font-weight:600;">(' + title + ')</span>' : '') +
        '</div>' +
        '<div class="box-row">' +
          (p != null ? '<div class="dlg-portrait-wrap ' + (side || 'blue') + '"><img src="' + D.IMG['portraits' + p] + '"></div>' : '') +
          '<div class="box-desc">' + l.t + '</div>' +
        '</div>' +
        '<p class="dlg-actions" style="text-align:right;margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">' +
          (lines.length > 1 && i < lines.length - 1 ? '<button class="btn" id="sk">Bỏ qua {{skip}}</button>' : '') +
          '<button class="btn pri" id="nx">' + (i < lines.length - 1 ? 'Tiếp {{play}}' : (btn || 'Xác nhận')) + '</button>' +
        '</p>'
      );
      if ($('#sk')) {
        $('#sk').onclick = () => {
          AudioSystem.sfx.click();
          closeBox();
          res();
        };
      }
      $('#nx').onclick = () => {
        AudioSystem.sfx.click();
        if (++i < lines.length) show();
        else { closeBox(); res(); }
      };
      $('#nx').focus();
    };
    show();
  });
}

    const n = battle(a, d);
    CUR = { x: d.x, y: d.y };
    await wait(520 * n + 700);

function nextUnit() {
  const c = U.filter(u => u.team === 0 && u.hp > 0 && !u.done);
  if (!c.length) return;
  const i = c.findIndex(u => u.x == CUR.x && u.y == CUR.y);
  const u = c[(i + 1) % c.length];
  CUR = { x: u.x, y: u.y };
  AudioSystem.sfx.click();
  renderSide(u);
}

        '<div class="turn-herald-divider">{{gems}}</div>' +
        '<div class="turn-counter-badge">' +
          '<span class="turn-k">LƯỢT</span>' +
          '<span class="turn-v">' + curR + (limR ? ' / ' + limR : '') + '</span>' +
        '</div>' +
      '</div>' +
      '<span class="hud-pill biome-pill" id="bBiome" title="Nhấp để đổi sắc thái môi trường"><span class="lbl">Địa hình: </span>' + (SpriteSystem.BIOMES[SpriteSystem.currentBiome].name) + ' {{caret}}</span>';
    }
    h += '<span class="hud-pill gold-pill">{{coin}} ' + G.gold + ' Vàng</span>';
  }

  h += '<span class="hud-spacer"></span>';

  if (G) {
    h += '<button id="bAch" class="btn" title="Thành tựu">{{trophy}}</button>' +
         '<button id="bCode" class="btn" title="Mã lưu">{{tablet}}</button>';
  }

  if (G && MAP) {
    h += '<button id="bNext" class="btn" title="Chuyển đơn vị">{{nextu}}<span class="lbl"> Kế</span></button>' +
         '<button id="bSave" class="btn" title="Lưu nhanh">{{save}}</button>';
  }

  h += '<button id="bInfo" class="btn" title="Tác giả">{{info}}</button>' +
       '<button id="bSoundStudio" class="btn" title="Âm thanh">{{note}}<span class="lbl"> Âm Điệu</span></button>' +
       '<button id="bSettings" class="btn icon-only" title="Cài đặt">{{gear}}</button>' +
       '<button id="bMu" class="btn icon-only" title="Bật/Tắt âm thanh">' + (AudioSystem.mute ? '{{mute}}' : '{{sound}}') + '</button>';

  if (G && MAP) {
    h += '<button id="bEnd" class="btn pri" ' + (PHASE !== 'player' || BUSY ? 'disabled' : '') + '>Xong Lượt</button>';
  }

  $('#hud').innerHTML = h;

  if ($('#bBiome')) $('#bBiome').onclick = biomePickerModal;
  if ($('#bAch')) $('#bAch').onclick = achievementsModal;
  if ($('#bCode')) $('#bCode').onclick = saveCodeModal;
  if ($('#bEnd')) $('#bEnd').onclick = endTurn;
  if ($('#bNext')) $('#bNext').onclick = nextUnit;
  if ($('#bInfo')) $('#bInfo').onclick = gameInfoModal;
  if ($('#bSave')) $('#bSave').onclick = () => {
    StorageSystem.save();
    log('{{save}} Dữ liệu đã được lưu tự động.');
  };
  if ($('#bSoundStudio')) $('#bSoundStudio').onclick = soundStudioModal;
  if ($('#bSettings')) $('#bSettings').onclick = settingsModal;
  $('#bMu').onclick = () => {
    const isMuted = AudioSystem.toggleMute();
    $('#bMu').innerHTML = isMuted ? '{{mute}}' : '{{sound}}';
  };
}

function bar(a, b, c) {
  const pct = Math.round(100 * clamp(a / (b || 1), 0, 1));
  return '<div class="meter-bar"><i class="' + (c || 'hp-green') + '" style="width:' + pct + '%"></i></div>';
}

function renderSide(u) {
  u = u || at(CUR.x, CUR.y);
  const container = $('#sideContent');
  if (!container) return;

  if (CURRENT_TAB === 'log') {
    container.innerHTML = '<b>{{scroll}} Quân Ký Chiến Trường</b><div class="side-log" id="sideLog">' +
      LOG.map(x => '<div>' + x + '</div>').join('') +
      '</div>';
    return;
  }

  if (CURRENT_TAB === 'quest') {
    let qh = '<div class="objective-box">{{target}} <b>Mục tiêu chiến dịch:</b><br>' + (CHAP ? CHAP.goal : 'Tiêu diệt toàn bộ quân địch.') + '</div>';
    if (CHAP && CHAP.intro) {
      qh += '<div style="font-size:12.5px;color:var(--tx-sec);margin-top:8px;line-height:1.5;"><b>Bối cảnh:</b><br>' + CHAP.intro + '</div>';
    }
    qh += '<div style="margin-top:12px;font-size:12px;color:var(--tx-mut);"><b>Địa hình:</b><br>' + SpriteSystem.BIOMES[SpriteSystem.currentBiome].name + ' — ' + SpriteSystem.BIOMES[SpriteSystem.currentBiome].desc + '</div>';
    container.innerHTML = qh;
    return;
  }

  // Unit tab
  let h = '';
  if (MAP) {
    const t = terr(CUR.x, CUR.y);
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
      '<span class="hud-pill">' + TNAME[t] + (AVO[t] ? ' · Né +' + AVO[t] + '%' : '') + (COST[t] < 9 ? ' · Tiêu hao ' + COST[t] : '') + '</span>' +
      '</div>';
  }

  if (u) {
    const w = wpn(u);
    const asVal = BalanceSystem.calcAS(u, w);
    const st = [
      ['Sức mạnh', u.str], ['Phép thuật', u.mag], ['Kỹ năng', u.skl], ['Tốc độ', u.spd],
      ['Phòng thủ', u.def], ['May mắn', u.lck], ['Di chuyển', u.mov], ['Tốc đánh', asVal]
    ];

    h += '<div class="card-unit ' + ['pl', 'al', 'en'][u.team] + '">' +
      '<div class="unit-avatar"><img src="' + HURL(u) + '"></div>' +
      '<div class="unit-meta"><h4>' + u.name + '</h4><small>' + JOBN(u.job) + (u.tier ? ' ' + '★'.repeat(u.tier) : '') + ' · Cấp ' + (u.lv + 1) + '</small></div>' +
    '</div>';

    h += '<div class="meter-group">' +
      '<div class="meter-label"><span>Sinh Lực</span><span>' + u.hp + '/' + u.mhp + '</span></div>' +
      bar(u.hp, u.mhp, u.team == 2 ? 'hp-red' : 'hp-green') +
    '</div>';

    if (u.team === 0) {
      h += '<div class="meter-group">' +
        '<div class="meter-label"><span>Kinh Nghiệm</span><span>' + u.exp + '/100</span></div>' +
        bar(u.exp, 100, 'exp-blue') +
      '</div>' + promoHint(u);
    }

    h += '<div class="stat-grid">' +
      st.map(x => '<div class="stat-box"><small>' + x[0] + '</small><b>' + x[1] + '</b></div>').join('') +
    '</div>';

    h += '<b>Binh Khí & Dược Phẩm:</b><div class="inv-list">' +
      (u.inv.map(i => '<div class="inv-item ' + (i === w ? 'equipped' : '') + '"><span>' + (i === w ? '{{swords}} ' : '') + iN(i.id) + '</span><i>' + (iT(i.id) <= 32 ? i.u + ' lần' : 'dùng') + '</i></div>').join('') || '<span style="color:var(--tx-mut);">(Không mang đồ)</span>') +
    '</div>';
  } else {
    h += '<div style="text-align:center;padding:24px 10px;color:var(--tx-mut);">' +
      '<div style="font-size:28px;margin-bottom:6px;">{{lily}}</div>' +
      '<div>Chạm vào bất kỳ tướng lĩnh nào trên bản đồ để xem chi tiết chỉ số và trang bị.</div>' +
    '</div>';
  }

  container.innerHTML = h;
}

/* ============================================================
   12. BOOTSTRAP & EVENT LISTENERS
   ============================================================ */
function bindEvents() {
  $('#tabUnit').onclick = () => {
    CURRENT_TAB = 'unit';
    $('#tabUnit').classList.add('active');
    $('#tabLog').classList.remove('active');
    $('#tabQuest').classList.remove('active');
    renderSide();
  };
  $('#tabLog').onclick = () => {
    CURRENT_TAB = 'log';
    $('#tabLog').classList.add('active');
    $('#tabUnit').classList.remove('active');
    $('#tabQuest').classList.remove('active');
    renderSide();
  };
  $('#tabQuest').onclick = () => {
    CURRENT_TAB = 'quest';
    $('#tabQuest').classList.add('active');
    $('#tabUnit').classList.remove('active');
    $('#tabLog').classList.remove('active');
    renderSide();
  };

  cv.addEventListener('click', click);
  addEventListener('keydown', e => {
    if ($('#modal').classList.contains('on')) {
      if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
      if (e.key === 'Enter') {
        const b = $('#nx') || $('#y') || $('#x');
        if (b) b.click();
      }
      return;
    }
    if (e.key === 'Tab') { e.preventDefault(); nextUnit(); }
    else if (e.key === 'Escape') { doCancel(); }
    else if (e.key === 'Enter') { endTurn(); }
  });

  const unlockAudio = () => {
    AudioSystem.init();
    if (!AudioSystem.midiTimer && !AudioSystem.mute && AudioSystem.currentTrack) {
      AudioSystem.playBGM(AudioSystem.currentTrack);
    }
  };
  addEventListener('pointerdown', unlockAudio, { once: true });
  addEventListener('keydown', unlockAudio, { once: true });

  addEventListener('resize', fit);
  if (window.ResizeObserver) {
    new ResizeObserver(() => fit()).observe($('#stage'));
  }
}

function boot() {
  PERF.init();
  bindEvents();
  document.querySelectorAll('#tabUnit,#tabLog,#tabQuest,#cancel').forEach(e => { e.innerHTML = e.innerHTML; });
  SpriteSystem.init(() => {
    hud();
    title();
    requestAnimationFrame(draw);
  });
}

boot();
</script>
