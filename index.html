<!DOCTYPE html>
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hỏa Ấn 1: Kẻ Phản Bội – Bản Làm Lại</title>
<meta name="description" content="Hỏa Ấn 1: Kẻ Phản Bội - Bản làm lại bởi Tru Ly - Đỗ Đức Thông. Trò chơi chiến thuật nhập vai theo lượt phong cách Hỏa Ấn.">
<meta property="og:title" content="Hỏa Ấn 1: Kẻ Phản Bội – Bản Làm Lại">
<meta property="og:description" content="Hỏa Ấn 1: Kẻ Phản Bội - Bản làm lại bởi Tru Ly - Đỗ Đức Thông. Trò chơi chiến thuật nhập vai theo lượt phong cách Hỏa Ấn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #fbf9f4;
  --bg-bot: #ece3d3;
  --cut-sm: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
  --cut-md: polygon(10px 0%, calc(100% - 10px) 0%, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0% calc(100% - 10px), 0% 10px);
  --cut-lg: polygon(16px 0%, calc(100% - 16px) 0%, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0% calc(100% - 16px), 0% 16px);
  --cut-hex: polygon(12px 0%, calc(100% - 12px) 0%, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0% 50%);
  --cut-tab: polygon(8px 0%, calc(100% - 8px) 0%, 100% 100%, 0% 100%);
  --pn-bg: rgba(255, 255, 255, 0.94);
  --pn-glass: rgba(255, 255, 255, 0.82);
  --pn-border: rgba(212, 168, 67, 0.45);
  --pn-border-high: rgba(212, 168, 67, 0.9);
  --gold-pri: #d49a24;
  --gold-light: #fef3c7;
  --gold-glow: #f5d47a;
  --gold-deep: #7a540c;
  --gold-grad: linear-gradient(135deg, #f5cb5c, #d49a24);
  --azure-pri: #2563eb;
  --azure-bg: #eff6ff;
  --azure-border: rgba(37, 99, 235, 0.4);
  --crimson-pri: #dc2626;
  --crimson-bg: #fef2f2;
  --crimson-border: rgba(220, 38, 38, 0.4);
  --emerald-pri: #059669;
  --emerald-bg: #f0fdf4;
  --emerald-border: rgba(5, 150, 105, 0.4);
  --amethyst-pri: #7c3aed;
  --amethyst-bg: #f5f3ff;
  --amethyst-border: rgba(124, 58, 237, 0.4);
  --tx-pri: #18191c;
  --tx-sec: #4b5262;
  --tx-mut: #858d9c;
  --shadow-card: 0 8px 28px rgba(180, 130, 40, 0.12), 0 2px 6px rgba(0,0,0,0.03);
  --shadow-popup: 0 24px 64px rgba(120, 80, 20, 0.22), 0 6px 18px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font-family: inherit; }

html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100dvh; max-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(1300px 750px at 50% -10%, #eef2ff 0%, #fefcf8 45%, var(--bg-bot) 100%);
  color: var(--tx-pri);
  font: 14px/1.45 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column;
}

#celestial-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: 
    radial-gradient(circle at 15% 10%, rgba(245, 212, 122, 0.18) 0%, transparent 35%),
    radial-gradient(circle at 85% 85%, rgba(147, 197, 253, 0.2) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 60%);
}

/* TOP HUD */
#hud {
  position: relative; z-index: 10;
  height: 52px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--pn-bg);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--pn-border);
  box-shadow: 0 2px 12px rgba(180, 130, 40, 0.08);
}

.brand-icon {
  width: 36px; height: 36px;
  clip-path: var(--cut-sm);
  display: grid; place-items: center;
  background: var(--gold-grad);
  color: #fff; font-size: 18px;
  box-shadow: 0 3px 12px rgba(212, 154, 36, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.8);
  flex-shrink: 0;
}

.hud-title {
  display: flex; flex-direction: column; justify-content: center; line-height: 1.15;
  margin-right: 4px;
}
.hud-title small {
  font-family: 'Playfair Display', serif; font-size: 10.5px; font-weight: 700;
  color: var(--gold-pri); letter-spacing: 0.08em; text-transform: uppercase;
}
.hud-title b {
  font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 800;
  color: var(--tx-pri); white-space: nowrap;
}

/* GIAO DIỆN HIỆP ĐẤU & LƯỢT (TURN HERALD) - GÓC CẠNH HOÀNG GIA */
.turn-herald {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 16px;
  clip-path: var(--cut-hex);
  font-family: 'Playfair Display', serif;
  user-select: none; flex-shrink: 0;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  position: relative;
}
.turn-herald.player-phase {
  background: linear-gradient(135deg, #091e45 0%, #1e40af 50%, #2563eb 100%);
  border: 1px solid #f5cb5c;
  box-shadow: 0 0 16px rgba(37, 99, 235, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.turn-herald.enemy-phase {
  background: linear-gradient(135deg, #450a0a 0%, #991b1b 50%, #dc2626 100%);
  border: 1px solid #fca5a5;
  box-shadow: 0 0 18px rgba(220, 38, 38, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.turn-phase-sigil {
  display: flex; align-items: center; gap: 5px;
  font-weight: 800; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.turn-herald.player-phase .turn-phase-sigil { color: #fef08a; }
.turn-herald.enemy-phase .turn-phase-sigil { color: #fecaca; }
.turn-sigil-icon { font-size: 13px; }
.turn-herald-divider { color: rgba(255, 255, 255, 0.45); font-size: 10px; }
.turn-counter-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(0, 0, 0, 0.35); padding: 2px 10px;
  clip-path: polygon(5px 0%, calc(100% - 5px) 0%, 100% 50%, calc(100% - 5px) 100%, 5px 100%, 0% 50%);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 12px;
}
.turn-counter-badge .turn-k {
  color: rgba(255, 255, 255, 0.7); font-size: 10px; letter-spacing: 0.06em;
}
.turn-counter-badge .turn-v {
  color: #fde047; font-family: 'Playfair Display', serif; font-size: 13.5px;
}

.hud-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; clip-path: var(--cut-sm);
  font-size: 12px; font-weight: 700;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid var(--pn-border);
  color: var(--tx-sec);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  white-space: nowrap;
}
.hud-pill.gold-pill { background: #fffbeb; border-color: rgba(245, 158, 11, 0.55); color: var(--gold-deep); font-variant-numeric: tabular-nums; }
.hud-pill.biome-pill { background: var(--emerald-bg); border-color: var(--emerald-border); color: var(--emerald-pri); cursor: pointer; }

.hud-spacer { flex: 1; }

/* NÚT BẤM GÓC CẠNH & KỲ ẢO (ANGULAR FANTASY BUTTONS) */
.btn {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 12px; font-weight: 700;
  padding: 7px 14px;
  clip-path: var(--cut-sm);
  border: 1px solid rgba(212, 168, 67, 0.65);
  background: linear-gradient(180deg, #ffffff 0%, #fbf8f0 100%);
  color: var(--tx-pri);
  cursor: pointer; transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 2px 6px rgba(180, 130, 40, 0.08);
  white-space: nowrap; flex-shrink: 0;
  position: relative;
}
.btn:hover {
  background: #ffffff;
  border-color: var(--gold-pri);
  box-shadow: 0 4px 14px rgba(212, 154, 36, 0.24);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.pri {
  background: linear-gradient(135deg, #eab308 0%, #d97706 50%, #b45309 100%);
  border: 1px solid #fde047;
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.btn.pri:hover {
  background: linear-gradient(135deg, #facc15 0%, #d97706 60%, #92400e 100%);
  box-shadow: 0 6px 20px rgba(217, 119, 6, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.btn.danger {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  border-color: #fca5a5;
  color: #fff;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
}
.btn.icon-only { padding: 7px 11px; }

/* MAIN ARENA */
#main {
  position: relative; z-index: 5;
  flex: 1; min-height: 0;
  display: flex; overflow: hidden;
}

#stage {
  flex: 1; min-width: 0; min-height: 0;
  overflow: hidden; display: flex;
  align-items: center; justify-content: center;
  padding: 8px; position: relative;
}

#wrap {
  position: relative; margin: auto;
  display: flex; align-items: center; justify-content: center;
}

canvas#cv {
  display: block;
  image-rendering: pixelated;
  border-radius: var(--radius-md);
  box-shadow: 0 16px 48px rgba(120, 80, 20, 0.2), 0 0 0 2px var(--pn-border-high);
  background: #101216;
  touch-action: manipulation;
}

/* Floating Action Menu */
#menu {
  position: absolute; display: none;
  flex-direction: column; gap: 6px;
  padding: 10px;
  background: var(--pn-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--pn-border-high);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-popup);
  z-index: 30;
  animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
#menu button {
  border-radius: 9px; text-align: left;
  padding: 8px 14px;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* SIDEBAR COMMAND CONSOLE */
#side {
  flex: 0 0 320px;
  background: var(--pn-bg);
  backdrop-filter: blur(18px);
  border-left: 1px solid var(--pn-border);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: -4px 0 20px rgba(160, 120, 40, 0.05);
}

.side-header {
  padding: 8px 10px;
  border-bottom: 1px solid var(--pn-border);
  display: flex; gap: 4px; background: rgba(255, 255, 255, 0.6);
}
.side-tab-btn {
  flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 700;
  border: none; background: transparent; color: var(--tx-sec);
  clip-path: var(--cut-tab); cursor: pointer; transition: 0.15s;
  font-family: inherit;
}
.side-tab-btn.active {
  background: #ffffff; color: var(--gold-deep);
  box-shadow: 0 2px 6px rgba(180, 130, 40, 0.15);
  border-top: 2px solid var(--gold-pri);
}

.side-body {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.side-body::-webkit-scrollbar { width: 5px; }
.side-body::-webkit-scrollbar-thumb { background: rgba(212, 168, 67, 0.3); border-radius: 4px; }

/* Light Fantasy Status Cards */
.card-unit {
  position: relative;
  display: flex; gap: 10px; align-items: center;
  padding: 10px; border-radius: var(--radius-md);
  background: #ffffff;
  border: 1px solid var(--pn-border);
  box-shadow: var(--shadow-card);
}
.card-unit.pl { border-left: 4px solid var(--azure-pri); }
.card-unit.en { border-left: 4px solid var(--crimson-pri); }
.card-unit.al { border-left: 4px solid var(--emerald-pri); }

.unit-avatar {
  width: 48px; height: 48px; border-radius: 10px;
  background: radial-gradient(circle, #fff, #eedfc2);
  border: 1px solid var(--pn-border);
  display: grid; place-items: center;
  overflow: hidden; flex-shrink: 0;
}
.unit-avatar img {
  image-rendering: pixelated; width: 44px; height: 40px;
  object-fit: cover;
}

.unit-meta h4 {
  margin: 0; font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 800;
  color: var(--tx-pri);
}
.unit-meta small {
  color: var(--tx-sec); font-size: 12px; font-weight: 600;
}

.meter-group { display: flex; flex-direction: column; gap: 2px; }
.meter-label { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; color: var(--tx-sec); }
.meter-bar {
  height: 7px; background: rgba(0, 0, 0, 0.08);
  border-radius: 999px; overflow: hidden;
}
.meter-bar i {
  display: block; height: 100%; border-radius: 999px;
  transition: width 0.3s ease;
}
.meter-bar i.hp-green { background: linear-gradient(90deg, #10b981, #34d399); }
.meter-bar i.hp-red { background: linear-gradient(90deg, #ef4444, #f87171); }
.meter-bar i.exp-blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

.stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
}
.stat-box {
  background: #ffffff; border: 1px solid rgba(212, 168, 67, 0.25);
  border-radius: 8px; text-align: center; padding: 4px 2px;
}
.stat-box small { display: block; font-size: 10px; font-weight: 700; color: var(--tx-mut); text-transform: uppercase; }
.stat-box b { font-size: 14px; font-weight: 800; color: var(--tx-pri); font-variant-numeric: tabular-nums; }

.inv-list { display: flex; flex-direction: column; gap: 4px; }
.inv-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 9px; border-radius: 6px;
  background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.05);
  font-size: 12px; font-weight: 600;
}
.inv-item.equipped {
  background: #fffbeb; border-color: rgba(212, 154, 36, 0.4);
  color: var(--gold-deep); font-weight: 700;
}
.inv-item i { font-style: normal; font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums; }

.side-log {
  flex: 1; font-size: 12px; color: var(--tx-sec);
  display: flex; flex-direction: column; gap: 4px;
}
.side-log div {
  padding: 4px 0; border-bottom: 1px dashed rgba(212, 168, 67, 0.25);
  line-height: 1.35;
}

.objective-box {
  background: #fffbeb; border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: var(--radius-sm); padding: 8px 10px;
  font-size: 12px; color: var(--gold-deep); line-height: 1.4;
}

/* MODAL / DIALOG */
#modal {
  position: fixed; inset: 0;
  background: rgba(18, 15, 25, 0.65);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  padding: 16px; z-index: 100;
}
#modal.on { display: flex; }

#box {
  background: linear-gradient(180deg, #ffffff 0%, #faf6ec 100%);
  border: 1px solid var(--pn-border-high);
  clip-path: var(--cut-lg);
  max-width: 620px; width: 100%; max-height: 90dvh;
  overflow-y: auto; padding: 24px;
  box-shadow: 0 24px 64px rgba(120, 80, 20, 0.28), 0 0 0 1px rgba(212, 168, 67, 0.3);
  animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}
#box::-webkit-scrollbar { width: 6px; }
#box::-webkit-scrollbar-thumb { background: rgba(212, 168, 67, 0.4); border-radius: 4px; }

#box h3 {
  margin: 0 0 14px;
  font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 800;
  color: var(--gold-deep);
  border-bottom: 1px solid var(--pn-border);
  padding-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}

/* THẺ THOẠI GÓC CẠNH TINH THỂ (CRYSTAL DIALOGUE SYSTEM) */
.dlg-speaker-tag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; margin-bottom: 8px;
  clip-path: var(--cut-sm);
  font-size: 12.5px; font-weight: 800;
  letter-spacing: 0.05em; text-transform: uppercase;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.dlg-speaker-tag.blue {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #ffffff; border: 1px solid #93c5fd;
  box-shadow: 0 0 12px rgba(37, 99, 235, 0.35);
}
.dlg-speaker-tag.red {
  background: linear-gradient(135deg, #991b1b, #dc2626);
  color: #ffffff; border: 1px solid #fca5a5;
  box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
}
.dlg-speaker-tag.green {
  background: linear-gradient(135deg, #065f46, #059669);
  color: #ffffff; border: 1px solid #6ee7b7;
}
.dlg-speaker-tag.gold {
  background: linear-gradient(135deg, #92400e, #d97706);
  color: #ffffff; border: 1px solid #fde047;
}
.dlg-speaker-tag.purple {
  background: linear-gradient(135deg, #5b21b6, #7c3aed);
  color: #ffffff; border: 1px solid #c4b5fd;
}

.box-row { display: flex; gap: 14px; align-items: flex-start; }
.dlg-portrait-wrap {
  width: 108px; height: 140px; flex: none;
  clip-path: var(--cut-md);
  border: 2px solid var(--gold-glow);
  background: #f7f1e6;
  position: relative;
  box-shadow: 0 4px 14px rgba(180, 130, 40, 0.25);
  overflow: hidden;
}
.dlg-portrait-wrap.blue { border-color: #3b82f6; box-shadow: 0 0 16px rgba(59, 130, 246, 0.4); }
.dlg-portrait-wrap.red { border-color: #ef4444; box-shadow: 0 0 16px rgba(239, 68, 68, 0.4); }
.dlg-portrait-wrap.green { border-color: #10b981; }
.dlg-portrait-wrap img {
  image-rendering: pixelated; width: 100%; height: 100%;
  object-fit: cover;
}
.box-desc { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; color: var(--tx-pri); flex: 1; }

.box-list { display: flex; flex-direction: column; gap: 7px; margin: 12px 0; }
.box-list button {
  clip-path: var(--cut-sm); text-align: left;
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 10px 14px;
}

/* RESPONSIVE PANORAMIC VIEWPORT - ZERO SCROLL PROMISE */
@media (max-width: 820px), (max-aspect-ratio: 1/1) {
  #main { flex-direction: column; }
  #side {
    flex: 0 0 auto; max-height: 35%;
    border-left: none; border-top: 1px solid var(--pn-border);
  }
  #stage { padding: 4px; }
  .hud-title small { display: none; }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 480px) {
  #hud { padding: 4px 8px; gap: 4px; height: 48px; }
  .hud-title b { font-size: 13px; }
  .btn { padding: 5px 9px; font-size: 11.5px; }
  .hud-pill { padding: 3px 6px; font-size: 10.5px; }
}

/* Forecast Table */
.forecast-table {
  width: 100%; border-collapse: collapse; margin: 10px 0;
  text-align: center; font-size: 13.5px;
}
.forecast-table td {
  padding: 6px 8px; border-bottom: 1px solid rgba(212, 168, 67, 0.2);
}
.forecast-table tr:last-child td { border-bottom: none; }
.forecast-val { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }

/* Achievement Grid */
.achieve-grid {
  display: grid; grid-template-columns: 1fr; gap: 8px;
}
.achieve-card {
  padding: 10px; border-radius: 10px; background: #ffffff;
  border: 1px solid var(--pn-border);
  display: flex; gap: 10px; align-items: center;
}
.achieve-card.unlocked {
  background: #fffdf5; border-color: rgba(212, 154, 36, 0.6);
  box-shadow: 0 4px 14px rgba(212, 154, 36, 0.15);
}
.achieve-icon {
  font-size: 26px; width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; background: #fdf6e7;
  border: 1px solid rgba(212, 154, 36, 0.3); flex-shrink: 0;
}
.achieve-info { flex: 1; }

/* ===================== GIAO DIỆN FANTASY GÓC CẠNH ===================== */
:root{--ink:#0b1022;--ink2:#1a2350;--gold:#d9a032;--gold-hi:#f6dc8e;--ivory:#fbf6e8;--ivory2:#efe2c3;--cn-g:#d9a032;--display:'Philosopher','Playfair Display',serif;

#hud .btn:not(.pri)::before{background:linear-gradient(#26316a,#121a3b)}
#hud .btn:not(.pri):hover::before{background:linear-gradient(#34428a,#1a2552)}
#stage{background:repeating-linear-gradient(45deg,rgba(246,220,142,.05) 0 1px,#0000 1px 26px),repeating-linear-gradient(-45deg,rgba(246,220,142,.05) 0 1px,#0000 1px 26px),radial-gradient(ellipse 80% 70% at 50% 45%,#222d5e 0%,var(--ink) 78%)}
canvas#cv{border-radius:0;box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--gold),0 0 0 8px var(--ink),0 0 38px 8px rgba(246,200,90,.28),0 26px 60px rgba(0,0,0,.65)}
#wrap::before{--k:linear-gradient(var(--gold-hi),var(--gold-hi));content:"";position:absolute;inset:-15px;pointer-events:none;z-index:2;background:var(--k) 0 0/30px 3px,var(--k) 0 0/3px 30px,var(--k) 100% 0/30px 3px,var(--k) 100% 0/3px 30px,var(--k) 0 100%/30px 3px,var(--k) 0 100%/3px 30px,var(--k) 100% 100%/30px 3px,var(--k) 100% 100%/3px 30px;background-repeat:no-repeat}

#boxWrap::before{content:"";position:absolute;left:50%;top:-10px;width:15px;height:15px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#fff3c4,var(--gold) 60%,#8a5208);box-shadow:0 0 0 2px #5b3a06,0 0 14px 3px rgba(255,205,90,.7);z-index:2}

/* ===================== TƯƠNG THÍCH ĐIỆN THOẠI ===================== */
html, body { width: 100%; overscroll-behavior: none; }
/* HUD tự xuống dòng thay vì tràn khỏi màn hình; chừa tai thỏ / thanh home */
#hud { height: auto; min-height: 54px; flex-wrap: wrap; row-gap: 4px;
  padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: 6px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
#main { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Hộp thoại: không vượt quá màn hình, không cuộn ngang, nút dài tự xuống dòng */
#modal { padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#box { max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
.box-list button { white-space: normal; flex-shrink: 1; min-width: 0; line-height: 1.3; }
.box-list button > span:first-child { min-width: 0; overflow-wrap: break-word; }
.box-desc { min-width: 0; overflow-wrap: break-word; }
.dlg-speaker-tag { max-width: 100%; flex-wrap: wrap; }

/* Màn nhỏ / máy tính bảng dọc: gọn HUD, chỉ giữ icon */
@media (max-width: 1100px), (max-height: 520px) {
  #hud { min-height: 0; column-gap: 5px;
    padding-top: calc(5px + env(safe-area-inset-top, 0px)); padding-bottom: 5px;
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .brand-icon, .hud-title { display: none; }
  .turn-herald { height: 32px; padding: 0 12px; gap: 6px; }
  .turn-phase-sigil { font-size: 10.5px; letter-spacing: .04em; }
  .turn-counter-badge { padding: 1px 7px; }
  #hud .hud-pill { padding: 3px 8px; font-size: 11px; }
  #hud .btn { padding: 5px 9px; min-height: 32px; }

  #hud .btn.pri { padding: 5px 13px; }
}

/* Điện thoại cầm dọc */
@media (max-width: 600px) {
  #stage { padding: 11px; }
  #wrap::before { inset: -9px; }

  #box { padding: 28px 16px 16px; }
  #box h3 { font-size: 17px; margin-bottom: 10px; padding-bottom: 10px; }

  .dlg-portrait-wrap { width: 78px; height: 102px; }

  .box-list { margin: 10px 0; }
  .box-list button { padding: 9px 12px; }

@media (max-width: 340px) { .dlg-portrait-wrap { width: 64px; height: 84px; } }

/* Hàng nút "Tiếp / Bỏ qua / Tấn công" luôn nằm sát đáy hộp, không phải cuộn mới thấy */
@media (max-width: 600px), (max-height: 520px) {

/* Menu hành động nổi trên bản đồ: gọn hơn để không tràn khung */
@media (max-width: 820px), (max-height: 520px) {

}

/* Điện thoại cầm ngang: giữ bố cục 2 cột (bản đồ | bảng tướng), không chuyển sang xếp dọc */
@media (min-aspect-ratio: 1/1) and (max-width: 820px), (min-aspect-ratio: 1/1) and (max-height: 520px) {

}

/* ===================== THĂNG TIẾN ===================== */
.promo-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }

/* ===== CHẾ ĐỘ NHẸ (bật trong Cài Đặt): bỏ hiệu ứng mờ, bóng đổ, chuyển động để máy yếu đỡ giật ===== */
body.lite *, body.lite *::before, body.lite *::after {

<body>

<!-- MODAL POPUP -->
<div id="modal"><div id="boxWrap"><div id="box"></div></div></div>

<script src="data.js"></script>
<script>
/* ===== BIỂU TƯỢNG GÓC CẠNH (SVG nội tuyến, thay emoji): dùng token hai ngoặc nhọn trong chuỗi HTML hoặc ic('ten') ===== */
const IC = (() => {
  const P = d => '<path d="' + d + '"/>';
  const K = d => '<path fill="#000" fill-opacity=".3" d="' + d + '"/>';
  const W = d => '<path fill="#fff" fill-opacity=".55" d="' + d + '"/>';
  const SW = P('M19.5 2.5l2 2-8.7 9.9-2.2-2.2z') + P('M7.5 12.8l3.7 3.7-1.6 1.6-3.7-3.7z') + K('M7.6 17.7L9 19.1 5.2 22.2l-1-1z');
  const ST4 = 'M12 1l2.6 7.4L22 12l-7.4 3.6L12 23l-2.6-7.4L2 12l7.4-3.6z';
  const SPK = 'M3 9h4l6-5v16l-6-5H3z';
  return {
    swords: SW + '<g transform="matrix(-1 0 0 1 24 0)">' + SW + '</g>',

// Nhân vật dùng lớp đã thăng tiến sẵn có (từ dữ liệu gốc) coi như đã qua lần I
function normPromo(u) {
  if (!u || u.team === 2 || u.tier != null) return;
  if (LEGACY_LINE[u.job]) { u.tier = 1; u.line = LEGACY_LINE[u.job]; }
  else u.tier = 0;
}
const promoTier = u => u.tier || 0;
const promoDue = u => !!u && u.team === 0 && promoTier(u) < 2 && (u.lv + 1) >= PROMO_LV[promoTier(u)] &&
  !(u.hp <= 0 && U.includes(u)); // đang gục trên chiến trường thì để sau
const promoAllowed = (u, c) => !(u.id === 0 && (c.mask & 16)); // Accor không thể thành pháp sư
function promoOptions(u) {
  const t = promoTier(u), line = u.line || BASE_LINE[u.job];
  const all = Object.values(CLS).filter(c => c.tier === t + 1);
  const r = t === 0 ? all : all.filter(c => c.line === line);
  return r.length ? r : all; // phòng hờ dữ liệu lạ: luôn có lựa chọn để không bị kẹt
}

// Ảnh xem trước: thân (đã đổi màu) + đầu của chính nhân vật đó
const PREVIEW_CACHE = {};
function unitPreview(u, job) {
  const key = u.id + '_' + job;
  if (PREVIEW_CACHE[key]) return PREVIEW_CACHE[key];
  const bi = SpriteSystem.recolors['stand1_' + job] || SpriteSystem.raw['stand1_' + job];
  if (!(bi && bi.width)) return '';
  const hd = SpriteSystem.getHead(headZ(u)), o = EY[CAT(job)] || EY[0];
  const c = document.createElement('canvas');
  c.width = 34; c.height = 44;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const bx = 6, bot = 41;
  g.fillStyle = 'rgba(0,0,0,0.2)';
  g.beginPath(); g.ellipse(bx + 12, bot - 1, 10, 3, 0, 0, 7); g.fill();
  if (hd && hd.width) g.drawImage(hd, bx + o[0], bot - T + o[1] - hd.height);
  g.drawImage(bi, bx, bot - bi.height);
  return PREVIEW_CACHE[key] = c.toDataURL();
}

// Áp dụng thăng tiến: đổi lớp, cộng chỉ số, đổi vũ khí được dùng, hồi đầy máu
function applyPromotion(u, c) {
  const before = {};
  PSTK.forEach(k => before[k] = u[k]);
  PSTK.forEach((k, i) => { u[k] = (u[k] || 0) + (c.bon[i] || 0); });
  u.job = c.id; u.tier = c.tier; u.line = c.line;
  u.mask = c.mask | ((u.mask & 32) ? 32 : 0); // đã biết dùng gậy thì giữ lại khả năng đó
  u.hl = null; u.hp = u.mhp;
  let gifted = null;
  if (c.gift && !u.inv.some(i => iT(i.id) === iT(c.gift))) {
    const it = { id: c.gift, u: iS(c.gift)[6] || 1 };
    if (u.inv.length < 6) { u.inv.push(it); gifted = [it, 'túi đồ']; }
    else { G.stash.push(it); gifted = [it, 'Kho Đồ']; }
  }
  return { before, gifted };
}

function promoFx(u) {
  AudioSystem.sfx.levelUp();
  if (MAP && U.includes(u)) {
    const t = performance.now();
    CUR = { x: u.x, y: u.y };
    FX.push({ x: u.x, y: u.y, t: 'Thăng Tiến!', c: '#f5cb5c', ts: t, big: true });
    burst(u.x, u.y, '#f5cb5c', 40, t, 110);
    burst(u.x, u.y, '#93c5fd', 24, t + 150, 80);
    FLS = { ts: t, dur: 600, c: 'rgba(245, 203, 92, 0.55)' };
  }
  log('{{crown}} ' + u.name + ' thăng tiến thành ' + JOBN(u.job) + '!');
}

const promoTags = (mask, u) => {
  const keepStaff = (u.mask & 32) && !(mask & 32);
  return PWN.filter(w => (mask | (u.mask & 32)) & w[0]).map(w => '<i class="promo-tag">' + w[1] + (w[0] === 32 && keepStaff ? ' (giữ lại)' : '') + '</i>').join('');
};
const promoChips = b => PSTK.map((k, i) => b[i] ? '<i class="promo-chip">+' + b[i] + ' ' + PSTN[k] + '</i>' : '').join('');

// Sự kiện thăng tiến: chọn hướng đi -> xác nhận -> bảng kết quả
function promotionEvent(u) {
  return new Promise(resolve => {
    const t = promoTier(u), opts = promoOptions(u), nat = BASE_LINE[u.job] || u.line;
    let pick = null;
    const card = c => {
      const lock = !promoAllowed(u, c);
      return '<button class="promo-card' + (lock ? ' lock' : '') + '" data-c="' + c.id + '"' + (lock ? ' disabled' : '') + '><span class="promo-in">' +
        '<img class="promo-spr" src="' + unitPreview(u, c.id) + '">' +
        '<span class="promo-txt">' +
          '<b class="promo-name">' + c.name + '</b>' +
          '<span class="promo-tags">' + promoTags(c.mask, u) + (t === 0 && c.line === nat ? '<i class="promo-fit">Hợp lớp hiện tại</i>' : '') + '</span>' +
          '<span class="promo-chips">' + promoChips(c.bon) + '</span>' +
          '<span class="promo-desc">' + (lock ? '{{warn}} Accor không thể đi theo con đường phép thuật.' : c.desc) + '</span>' +
        '</span></span></button>';
    };
    openBox(
      '<h3>{{crown}} Thăng Tiến Lần ' + (t ? 'II' : 'I') + '</h3>' +
      '<div class="promo-head"><div class="promo-ava"><img src="' + HURL(u) + '"></div>' +
        '<div class="box-desc"><b>' + u.name + '</b> đạt <b>Cấp ' + (u.lv + 1) + '</b>!\nHiện là <b>' + JOBN(u.job) + '</b>. ' +
        (t ? 'Hãy chọn con đường tối thượng để hoàn tất hành trình.' : 'Hãy chọn một hướng đi — mỗi hướng có quân phục, binh khí và sở trường riêng.') + '</div></div>' +
      '<div class="promo-grid">' + opts.map(card).join('') + '</div>' +
      '<p class="promo-note">Chỉ số tăng đáng kể và hồi đầy sinh lực ngay khi thăng tiến.' + ((u.mask & 32) ? ' Khả năng dùng Gậy được giữ nguyên.' : '') + ' Lựa chọn này không thể đổi lại.</p>' +
      '<p class="dlg-actions" style="text-align:right;margin:10px 0 0;"><button id="y" class="btn pri" disabled>Hãy chọn một hướng đi</button></p>'
    );
    const B = $('#box');
    B.querySelectorAll('.promo-card').forEach(b => b.onclick = () => {
      if (b.disabled) return;
      AudioSystem.sfx.click();
      pick = +b.dataset.c;
      B.querySelectorAll('.promo-card').forEach(x => x.classList.toggle('sel', x === b));
      const y = $('#y');
      y.disabled = false;
      y.innerHTML = '{{star4}} Thăng tiến: ' + CLS[pick].name;
    });
    $('#y').onclick = () => {
      if (pick == null) return;
      const c = CLS[pick], r = applyPromotion(u, c);
      promoFx(u);
      const diffs = PSTK.filter(k => u[k] !== r.before[k]).map(k =>
        '<div class="promo-diff"><span>' + PSTN[k] + '</span><b>' + r.before[k] + ' {{arrow}} ' + u[k] + '</b></div>').join('');
      openBox(
        '<h3>{{star}} Thăng Tiến Thành Công!</h3>' +
        '<div class="promo-result"><img class="promo-big" src="' + unitPreview(u, c.id) + '">' +
          '<div class="box-desc"><b>' + u.name + '</b> trở thành <b>' + c.name + '</b>' + (c.tier === 2 ? ' — lớp tối thượng!' : '!') +
          '\nDùng được: ' + PWN.filter(w => u.mask & w[0]).map(w => w[1]).join(', ') +
          (r.gifted ? '\nNhận ' + iN(r.gifted[0].id) + ' (vào ' + r.gifted[1] + ').' : '') + '\nSinh lực hồi đầy.</div></div>' +
        '<div class="promo-diffs">' + diffs + '</div>' +
        '<p class="dlg-actions" style="text-align:right;margin:12px 0 0;"><button id="nx" class="btn pri">Tiếp tục {{play}}</button></p>'
      );
      $('#nx').onclick = () => {
        AudioSystem.sfx.click();
        closeBox();
        StorageSystem.save();
        hud(); renderSide();
        resolve();
      };
      $('#nx').focus();
    };
  });
}

// Chạy mọi sự kiện thăng tiến đang chờ (gọi ở các thời điểm an toàn: sau trận đánh, dùng gậy, về doanh trại...)
let PROMO_P = null;
function runPromotions() {
  if (PROMO_P) return PROMO_P;
  if (!G || !G.roster || !G.roster.some(promoDue)) return Promise.resolve();
  PROMO_P = (async () => {
    try {
      for (const u of G.roster.slice()) {
        while (promoDue(u)) await promotionEvent(u);
      }
    } catch (e) { console.error(e); }
    PROMO_P = null;
  })();
  return PROMO_P;
}
function promoHint(u) {
  if (u.team !== 0) return '';
  const t = promoTier(u);
  return '<div class="promo-hint">' + (t < 2 ? '{{star4}} Thăng tiến lần ' + (t ? 'II' : 'I') + ' tại Cấp ' + PROMO_LV[t] : '{{crown}} Đã đạt lớp tối thượng') + '</div>';
}

/* ============================================================
   2. AUDIO SYSTEM (Synthesized SFX + MIDI BGM Engine)
   ============================================================ */
const AudioSystem = {
  ctx: null,
  mute: false,
  volume: 0.8,
  currentTrack: null,
  midiTimer: null,
  midiGain: null,
  midiCache: {},
  audioBufferCache: {},
  currentAudioSource: null,
  currentAudioEl: null,
  customSFX: null,

  async loadCustomSounds() {
    try {
      const res = await fetch('sounds/sfx.json');
      if (res.ok) {
        this.customSFX = await res.json();
      }
    } catch (e) {}
    try {
      const bRes = await fetch('sounds/bgm.json');
      if (bRes.ok) {
        const customBgm = await bRes.json();
        if (customBgm && typeof customBgm === 'object') {
          Object.assign(D.MID, customBgm);
        }
      }
    } catch (e) {}
  },

  init() {
    this.loadCustomSounds();
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  toggleMute() {
    this.mute = !this.mute;
    if (this.mute) {
      if (this.midiGain) this.midiGain.gain.setValueAtTime(0, this.ctx.currentTime);
      if (this.currentAudioEl) this.currentAudioEl.volume = 0;
    } else {
      if (this.midiGain) this.midiGain.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
      if (this.currentAudioEl) this.currentAudioEl.volume = 0.35 * this.volume;
      if (this.currentTrack && !this.midiTimer && !this.currentAudioSource && !this.currentAudioEl) {
        this.playBGM(this.currentTrack);
      }
    }
    return this.mute;
  },

  setVolume(vol) {
    this.volume = Math.max(0, Math.min(1, vol));
    if (this.midiGain && !this.mute) {
      this.midiGain.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
    }
    if (this.currentAudioEl && !this.mute) {
      this.currentAudioEl.volume = 0.35 * this.volume;
    }
  },

  playCustomSFX(name) {
    if (this.mute) return true;
    if (this.customSFX && this.customSFX[name] && this.customSFX[name].base64) {
      this.playAudioBase64(this.customSFX[name].base64, false);
      return true;
    }
    return false;
  },

  /* ---------- Bộ tổng hợp hiệu ứng: nhiều lớp + vang không gian + nén chống rè ---------- */
  _bus() {
    const c = this.ctx;
    if (!c) return null;
    if (this._b && this._b.ctx === c) { this._b.master.gain.value = this.volume; return this._b; }
    const master = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 6;
    comp.attack.value = 0.002; comp.release.value = 0.18;
    master.connect(comp); comp.connect(c.destination);
    // vang: xung nhiễu tắt dần (khoảng 1,2 giây)
    const len = Math.floor(c.sampleRate * 1.2), ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    const conv = c.createConvolver(); conv.buffer = ir;
    const wet = c.createGain(); wet.gain.value = 0.55;
    conv.connect(wet); wet.connect(master);
    // nhiễu trắng dùng chung
    const nl = c.sampleRate * 2, nb = c.createBuffer(1, nl, c.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
    master.gain.value = this.volume;
    this._b = { ctx: c, master, conv, noise: nb };
    return this._b;
  },

  // cổng ra của một tiếng: wet = lượng vang
  _v(wet) {
    const b = this._bus(), c = this.ctx, g = c.createGain();
    g.connect(b.master);
    if (wet) { const w = c.createGain(); w.gain.value = wet; g.connect(w); w.connect(b.conv); }
    return g;
  },

  // một nốt: o = { type, f0, f1, dur, vol, att, hold, det, lp, lp1 }
  _tone(out, t, o) {
    const c = this.ctx, osc = c.createOscillator(), e = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    if (o.det) osc.detune.value = o.det;
    const att = o.att || 0.004, vol = o.vol || 0.2;
    e.gain.setValueAtTime(0.0001, t);
    e.gain.linearRampToValueAtTime(vol, t + att);
    if (o.hold && o.hold > att && o.hold < o.dur) e.gain.setValueAtTime(vol, t + o.hold);
    e.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.lp) {
      const f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lp1) f.frequency.exponentialRampToValueAtTime(o.lp1, t + o.dur);
      osc.connect(f); node = f;
    }
    node.connect(e); e.connect(out);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },

  // một luồng nhiễu qua bộ lọc quét tần: o = { type, f0, f1, q, dur, vol, att }
  _noise(out, t, o) {
    const c = this.ctx, b = this._bus(), src = c.createBufferSource(), f = c.createBiquadFilter(), e = c.createGain();
    src.buffer = b.noise; src.loop = true;
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    const att = o.att || 0.003, vol = o.vol || 0.2;
    e.gain.setValueAtTime(0.0001, t);
    e.gain.linearRampToValueAtTime(vol, t + att);
    e.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(e); e.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + o.dur + 0.05);
  },

  // tiếng kim loại ngân: nhiều họa âm lệch tông, họa âm cao tắt nhanh hơn
  _ring(out, t, base, dur, vol, ratios) {
    (ratios || [1, 2.76, 5.4, 8.93]).forEach((r, i) => {
      if (base * r > 12000) return;
      this._tone(out, t, { f0: base * r, dur: dur / (1 + i * 0.7), vol: vol / (1 + i * 0.9), att: 0.001 });
    });
  },

  // kèn đồng: hai sóng răng cưa lệch tông, bộ lọc mở dần
  _brass(out, t, f, dur, vol, hold) {
    [-8, 8].forEach(d => this._tone(out, t, { type: 'sawtooth', f0: f, dur, vol, att: 0.035, hold: hold || dur * 0.55, det: d, lp: f * 2.2, lp1: f * 7 }));
  },

  sfx: {
    // Kiếm chém: vút gió -> va chạm -> kim loại ngân. hit=false chỉ còn tiếng vút (đánh trượt).
    sword(crit, hit) {
      const A = AudioSystem; if (A.mute || !A.ctx) return;
      if (hit === undefined) hit = true;
      const t = A.ctx.currentTime + 0.004, out = A._v(crit ? 0.35 : 0.14);
      A._noise(out, t, { type: 'bandpass', f0: 900, f1: crit ? 6200 : 4300, q: 1.1, dur: 0.13, vol: crit ? 0.36 : hit ? 0.26 : 0.2, att: 0.035 });
      A._tone(out, t, { type: 'sawtooth', f0: crit ? 420 : 300, f1: crit ? 1500 : 900, dur: 0.1, vol: 0.035, att: 0.03, lp: 2400 });
      if (!hit) return;
      const h = t + 0.1;
      A._tone(out, h, { f0: crit ? 210 : 170, f1: 48, dur: crit ? 0.26 : 0.16, vol: crit ? 0.8 : 0.5 });
      A._noise(out, h, { type: 'highpass', f0: 1600, dur: 0.06, vol: crit ? 0.5 : 0.36 });
      A._noise(out, h, { type: 'lowpass', f0: 1200, f1: 200, dur: 0.14, vol: 0.3 });
      A._ring(out, h, crit ? 2300 : 1850, crit ? 0.55 : 0.2, crit ? 0.2 : 0.11);
      if (crit) {
        A._tone(out, h, { f0: 80, f1: 34, dur: 0.5, vol: 0.7 });
        A._tone(out, h, { type: 'sawtooth', f0: 1300, f1: 3400, dur: 0.14, vol: 0.06, att: 0.002, lp: 5000 });
        A._noise(out, h + 0.01, { type: 'bandpass', f0: 3200, q: 3, dur: 0.35, vol: 0.12 });
      }
    },
    // Cung tên: bật dây -> mũi tên xé gió -> cắm vào mục tiêu
    bow(hit) {
      const A = AudioSystem; if (A.mute || !A.ctx) return;
      if (hit === undefined) hit = true;
      const t = A.ctx.currentTime + 0.004, out = A._v(0.12);
      A._tone(out, t, { type: 'triangle', f0: 240, f1: 120, dur: 0.14, vol: 0.4 });
      A._tone(out, t, { f0: 480, f1: 240, dur: 0.1, vol: 0.12 });
      A._noise(out, t, { type: 'highpass', f0: 3500, dur: 0.02, vol: 0.3 });
      A._noise(out, t + 0.03, { type: 'bandpass', f0: 4200, f1: 1600, q: 7, dur: 0.2, vol: 0.12, att: 0.05 });
      const h = t + 0.22;
      if (hit) {
        A._tone(out, h, { f0: 260, f1: 85, dur: 0.1, vol: 0.55 });
        A._noise(out, h, { type: 'lowpass', f0: 1400, f1: 300, dur: 0.08, vol: 0.4 });
        A._noise(out, h, { type: 'highpass', f0: 2500, dur: 0.03, vol: 0.2 });
      } else {
        A._noise(out, h, { type: 'lowpass', f0: 700, dur: 0.07, vol: 0.12 });
      }
    },

  parseMidi(b) {
    let p = 0;
    const r = n => { let v = 0; while (n--) v = v * 256 + b[p++]; return v; };
    const vl = () => { let v = 0, c; do { c = b[p++]; v = v * 128 + (c & 127); } while (c & 128); return v; };
    p += 4; r(4); r(2);
    const nt = r(2), div = r(2), ev = [], tm = [];
    for (let t = 0; t < nt; t++) {
      p += 4; const end = r(4) + p;
      let tick = 0, st = 0;
      while (p < end) {
        tick += vl(); let s = b[p];
        if (s & 128) { p++; st = s; } else s = st;
        if (s == 255) {
          const ty = b[p++], l = vl();
          if (ty == 81) tm.push([tick, b[p] << 16 | b[p + 1] << 8 | b[p + 2]]);
          p += l;
        } else if (s == 240 || s == 247) {
          p += vl();
        } else {
          const k = s & 240, ch = s & 15, a = b[p++], v = (k == 192 || k == 208) ? 0 : b[p++];
          if (k == 144 && v > 0) ev.push([tick, ch, a, v, 1]);
          else if (k == 128 || (k == 144 && v == 0)) ev.push([tick, ch, a, 0, 0]);
        }
      }
      p = end;
    }
    tm.sort((x, y) => x[0] - y[0]);
    if (!tm.length || tm[0][0] > 0) tm.unshift([0, 500000]);
    const sec = t => {
      let s = 0, pt = 0, mp = tm[0][1];
      for (const [tk, m] of tm) {
        if (tk >= t) break;
        s += (tk - pt) * mp / div / 1e6;
        pt = tk; mp = m;
      }
      return s + (t - pt) * mp / div / 1e6;
    };
    ev.sort((x, y) => x[0] - y[0]);
    const op = {}, notes = [];
    for (const [tk, ch, n, v, on] of ev) {
      const k = ch * 128 + n;
      if (on) op[k] = [tk, v];
      else if (op[k]) {
        const o = op[k]; delete op[k];
        const s = sec(o[0]);
        notes.push({ s, d: Math.max(0.06, sec(tk) - s), n, v: o[1], ch });
      }
    }
    notes.sort((x, y) => x.s - y.s);
    const l = notes[notes.length - 1];
    return { notes, len: l ? l.s + l.d + 0.5 : 1 };
  },

  playMidiNote(n, t, out) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), e = this.ctx.createGain();
    if (n.ch == 9) {
      o.type = 'square';
      o.frequency.value = n.n < 40 ? 70 : n.n < 46 ? 180 : 900;
      e.gain.setValueAtTime((n.v / 127) * 0.35, t);
      e.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(e); e.connect(out);
      o.start(t); o.stop(t + 0.1);
      return;
    }
    o.type = ['triangle', 'square', 'sawtooth'][n.ch % 3];
    o.frequency.value = 440 * Math.pow(2, (n.n - 69) / 12);
    const v = (n.v / 127) * (n.ch % 3 ? 0.16 : 0.32);
    e.gain.setValueAtTime(0.0001, t);
    e.gain.linearRampToValueAtTime(v, t + 0.012);
    e.gain.setValueAtTime(v * 0.75, t + Math.max(0.02, n.d - 0.05));
    e.gain.linearRampToValueAtTime(0.0001, t + n.d + 0.08);
    o.connect(e); e.connect(out);
    o.start(t); o.stop(t + n.d + 0.1);
  },

  stopBGM() {
    if (this.midiTimer) {
      clearInterval(this.midiTimer);
      this.midiTimer = null;
    }
    if (this.currentAudioSource) {
      try { this.currentAudioSource.stop(); } catch (e) {}
      this.currentAudioSource = null;
    }
    if (this.currentAudioEl) {
      try { this.currentAudioEl.pause(); this.currentAudioEl.src = ''; } catch (e) {}
      this.currentAudioEl = null;
    }
    if (this.midiGain) {
      const g = this.midiGain;
      try { g.gain.setTargetAtTime(0, this.ctx ? this.ctx.currentTime : 0, 0.05); } catch (e) {}
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 400);
      this.midiGain = null;
    }
  },

  playBGM(name) {
    this.init();
    if (this.currentTrack === name && (this.midiTimer || this.currentAudioSource || this.currentAudioEl)) return;
    this.currentTrack = name;
    this.stopBGM();
    if (this.mute || !D.MID || !D.MID[name]) return;
    this.playAudioBase64(D.MID[name], !/victory|gameover/.test(name));
  },

  playAudioBase64(dataStr, loop) {
    if (!dataStr || this.mute) return;
    const cleanB64 = (dataStr.indexOf(',') >= 0 ? dataStr.split(',')[1] : dataStr).trim();
    let bin;
    try {
      bin = atob(cleanB64);
    } catch (e) {
      return;
    }
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

    // Standard MIDI file check: header "MThd" (0x4D, 0x54, 0x68, 0x64)
    const isMidi = a.length >= 4 && a[0] === 0x4D && a[1] === 0x54 && a[2] === 0x68 && a[3] === 0x64;

    if (isMidi) {
      let m = this.midiCache[dataStr];
      if (!m) {
        try { m = this.midiCache[dataStr] = this.parseMidi(a); } catch (e) { return; }
      }
      let t0 = this.ctx.currentTime + 0.1, i = 0;
      const g = this.midiGain = this.ctx.createGain();
      g.gain.setValueAtTime(0.24 * this.volume, this.ctx.currentTime);
      g.connect(this.ctx.destination);

      this.midiTimer = setInterval(() => {
        const now = this.ctx.currentTime - t0;
        while (i < m.notes.length && m.notes[i].s < now + 0.5) {
          this.playMidiNote(m.notes[i++], t0 + m.notes[i - 1].s, g);
        }
        if (i >= m.notes.length && now > m.len) {
          if (loop) { t0 = this.ctx.currentTime + 0.1; i = 0; }
          else { clearInterval(this.midiTimer); this.midiTimer = null; }
        }
      }, 120);
    } else {
      // MP3 / WAV / OGG Base64 decoding support
      const g = this.midiGain = this.ctx.createGain();
      g.gain.setValueAtTime(0.3 * this.volume, this.ctx.currentTime);
      g.connect(this.ctx.destination);

      if (this.audioBufferCache[dataStr]) {
        try {
          const src = this.ctx.createBufferSource();
          src.buffer = this.audioBufferCache[dataStr];
          src.loop = !!loop;
          src.connect(g);
          src.start(0);
          this.currentAudioSource = src;
        } catch (e) {
          this.playHtmlAudioFallback(cleanB64, loop);
        }
      } else if (this.ctx && this.ctx.decodeAudioData) {
        const copyBuf = a.buffer.slice(a.byteOffset, a.byteOffset + a.byteLength);
        this.ctx.decodeAudioData(copyBuf, (buffer) => {
          this.audioBufferCache[dataStr] = buffer;
          if (this.mute || this.currentTrack !== this.currentTrack) return;
          try {
            const src = this.ctx.createBufferSource();
            src.buffer = buffer;
            src.loop = !!loop;
            src.connect(g);
            src.start(0);
            this.currentAudioSource = src;
          } catch (e) {}
        }, () => {
          this.playHtmlAudioFallback(cleanB64, loop);
        });
      } else {
        this.playHtmlAudioFallback(cleanB64, loop);
      }
    }
  },

  playHtmlAudioFallback(cleanB64, loop) {
    try {
      const audio = new Audio('data:audio/mp3;base64,' + cleanB64);
      audio.loop = !!loop;
      audio.volume = this.mute ? 0 : this.volume * 0.35;
      audio.play().catch(() => {});
      this.currentAudioEl = audio;
    } catch (e) {}
  }
};

const SpriteSystem = {

  biomeCache: {},

  BIOMES: {

    desert: { name: 'Kim Sa Cổ Mộ', filter: 'hue-rotate(45deg) saturate(1.2) brightness(1.1)', desc: 'Hoang mạc cát vàng cổ đại lưu giữ báu vật ngàn năm.' }
  },

  init(onComplete) {
    const keys = Object.keys(D.IMG);
    let loaded = 0;
    keys.forEach(k => {
      const img = new Image();
      img.onload = img.onerror = () => {
        if (++loaded >= keys.length) {
          this.buildRecolors();
          this.buildBiomeTiles();
          if (onComplete) onComplete();
        }
      };
      img.src = D.IMG[k];
      this.raw[k] = img;
    });
  },

  recolorCanvas(img, pal) {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height), a = d.data, f = pal[0], t = pal[1];
    for (let i = 0; i < a.length; i += 4) {
      for (let k = 0; k < f.length; k++) {
        if (a[i] === f[k][0] && a[i+1] === f[k][1] && a[i+2] === f[k][2]) {
          a[i] = t[k][0]; a[i+1] = t[k][1]; a[i+2] = t[k][2];
        }
      }
    }
    ctx.putImageData(d, 0, 0);
    return c;
  },

  buildRecolors() {
    const G3 = [[47, 100, 0], [91, 195, 0], [150, 255, 57]];
    const R3 = [[120, 15, 8], [206, 85, 12], [255, 132, 57]];
    const PAL = {
      0: [[[255, 242, 0]], [[71, 156, 255]]],
      8: [G3, R3],
      9: [G3, [[140, 98, 57], [198, 156, 109], [255, 132, 57]]],
      10: [G3, [[73, 19, 96], [146, 39, 143], [189, 140, 191]]],
      11: [G3, [[123, 0, 70], [228, 57, 224], [255, 144, 252]]],
      12: [G3, R3]
    };
    try {
      ['stand1_', 'stand2_', 'attack1_', 'attack2_'].forEach(n => {
        this.recolors[n + '2'] = this.recolorCanvas(this.raw[n + '0'], PAL[0]);
      });
      this.recolors.head_8 = this.recolorCanvas(this.raw.head_1, PAL[8]);
      this.recolors.head_9 = this.recolorCanvas(this.raw.head_1, PAL[9]);
      this.recolors.head_10 = this.recolorCanvas(this.raw.head_1, PAL[10]);
      this.recolors.head_11 = this.recolorCanvas(this.raw.head_1, PAL[11]);
      this.recolors.head_12 = this.recolorCanvas(this.raw.head_2, PAL[12]);
      // Quân phục các lớp thăng tiến: lấy dáng quân phục gốc rồi đổi màu theo SCHEME
      Object.values(CLS).forEach(c => {
        ['stand1_', 'stand2_', 'attack1_', 'attack2_'].forEach(n => {
          const src = this.raw[n + c.sp];
          if (!(src && src.width)) return;
          this.recolors[n + c.id] = c.sch ? this.recolorCanvas(src, SCHEME[c.sch]) : src;
        });
      });
    } catch (e) {
      console.warn('Recolor build error', e);
    }
  },

  buildBiomeTiles() {
    Object.keys(this.BIOMES).forEach(bKey => {
      this.biomeCache[bKey] = {};
      const filter = this.BIOMES[bKey].filter;
      for (let i = 1; i <= 37; i++) {
        const key = 'map-' + i;
        const srcImg = this.raw[key];
        if (!srcImg) continue;
        if (filter === 'none') {
          this.biomeCache[bKey][key] = srcImg;
        } else {
          const c = document.createElement('canvas');
          c.width = srcImg.width || 24; c.height = srcImg.height || 24;
          const ctx = c.getContext('2d');
          ctx.filter = filter;
          ctx.drawImage(srcImg, 0, 0);
          this.biomeCache[bKey][key] = c;
        }
      }
    });
  },

  getTile(id) {
    const key = 'map-' + (id + 1);
    const bTiles = this.biomeCache[this.currentBiome] || this.biomeCache.emerald;
    return (bTiles && bTiles[key]) || this.raw[key];
  },

  getHead(z) {
    return z < 8 ? this.raw['head_' + z] : this.recolors['head_' + z];
  }
};

   4. COMBAT & ANTI-EXPLOIT BALANCE SYSTEM
   ============================================================ */
const BalanceSystem = {
  staffHealCounter: {},

  calcAS(unit, weapon) {
    if (!weapon) return unit.spd;
    const wt = iS(weapon.id)[5] || 0;
    const penalty = Math.max(0, wt - unit.str);
    return Math.max(0, unit.spd - penalty);
  },

  trueHitRNG(rate) {
    const r1 = Math.random() * 100;
    const r2 = Math.random() * 100;
    const avg = (r1 + r2) / 2;
    const boundedRate = Math.max(5, Math.min(95, rate));
    return avg < boundedRate;
  },

  triggerSquadAlert(targetUnit, allUnits) {
    if (targetUnit.team !== 2) return;
    targetUnit.ai = 1;
    allUnits.forEach(u => {
      if (u.team === 2 && u.hp > 0 && Math.abs(u.x - targetUnit.x) + Math.abs(u.y - targetUnit.y) <= 4) {
        u.ai = 1;
      }
    });
  },

  getStaffExp(healer, target) {
    const key = healer.id + '->' + target.id;
    this.staffHealCounter[key] = (this.staffHealCounter[key] || 0) + 1;
    const count = this.staffHealCounter[key];
    if (count === 1) return 18;
    if (count === 2) return 10;
    if (count === 3) return 5;
    return 2;
  },

  resetTurnCounters() {
    this.staffHealCounter = {};
  }
};

const StorageSystem = {
  save() {
    if (!G) return false;
    try {
      localStorage.setItem('ha1_save_v2', JSON.stringify(G));
      return true;
    } catch (e) {
      return false;
    }
  },

  load() {
    try {
      const s = localStorage.getItem('ha1_save_v2') || localStorage.getItem('ha1_save');
      if (s) {
        G = JSON.parse(s);
        if (!G.avail) G.avail = [...Array(Math.min((G.cleared || 0) + 1, 10)).keys()];
        G.achieved = G.achieved || [];
        G.endings = G.endings || [];
        G.stats = G.stats || { crits: 0, heals: 0, arenaWins: 0, rogueFloors: 0 };
        (G.roster || []).forEach(boostSilke);
        (G.roster || []).forEach(normPromo);
        return true;
      }
    } catch (e) {}
    return false;
  },

  exportCode() {
    if (!G) return '';
    try {
      const json = JSON.stringify(G);
      const b64 = btoa(encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
      let crc = 0;
      for (let i = 0; i < b64.length; i++) crc = (crc + b64.charCodeAt(i) * 31) & 0xffff;
      return 'HA1-V2-' + b64 + '-' + crc.toString(16).toUpperCase();
    } catch (e) {
      return '';
    }
  },

  importCode(codeStr) {
    try {
      // Bỏ mọi khoảng trắng/xuống dòng/ký tự vô hình (hay bị chèn khi dán từ Zalo, ghi chú, tệp...)
      const clean = String(codeStr || '').replace(/[\s\u200B-\u200D\uFEFF]+/g, '');
      const m = clean.match(/HA1-V2-([A-Za-z0-9+\/]+={0,2})(?:-[0-9A-Fa-f]+)?/);
      if (!m) return false;
      const b64 = m[1];
      const json = decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      const parsed = JSON.parse(json);
      if (parsed && typeof parsed.ch === 'number' && Array.isArray(parsed.roster)) {
        G = parsed;
        if (!G.avail) G.avail = [...Array(Math.min((G.cleared || 0) + 1, 10)).keys()];
        G.achieved = G.achieved || [];
        G.endings = G.endings || [];
        G.stats = G.stats || { crits: 0, heals: 0, arenaWins: 0, rogueFloors: 0 };
        (G.roster || []).forEach(boostSilke);
        (G.roster || []).forEach(normPromo);
        this.save();
        return true;
      }
    } catch (e) {
      console.warn('Import failed', e);
    }
    return false;
  }
};

   8. GAME DATA & MAP GENERATOR FOR EXPANDED CHAPTERS
   ============================================================ */
function genMap(sd, w, h, th) {
  seed = sd;
  const t = new Array(w * h).fill(th.base[0]);
  const pick = a => a[srnd(a.length)];
  for (let i = 0; i < w * h; i++) if (srnd(100) < 30) t[i] = pick(th.base);
  const blob = (ids, n) => {
    for (let k = 0; k < n; k++) {
      const cx = srnd(w), cy = srnd(h), r = 1 + srnd(2);
      for (let dx = -r; dx <= r; dx++) {
        for (let dy = -r; dy <= r; dy++) {
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && y >= 0 && x < w && y < h && (Math.abs(dx) + Math.abs(dy) <= r) && y > 1 && y < h - 2) {
            t[y * w + x] = pick(ids);
          }
        }
      }
    }
  };
  blob(th.forest, th.nf);
  blob(th.hill, th.nh);
  for (let i = 0; i < th.nv; i++) {
    const x = 2 + srnd(w - 4), y = 3 + srnd(h - 6);
    t[y * w + x] = 5;
  }
  for (let i = 0; i < th.nw; i++) {
    const x = 1 + srnd(w - 2), y = 3 + srnd(h - 6);
    t[y * w + x] = th.wall;
  }
  for (let y = h - 3; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (t[y * w + x] > 5) t[y * w + x] = th.base[0];
    }
  }
  return { w, h, t };
}

function buildGen(i) {
  const g = GEN[i], m = genMap(g.seed, g.w, g.h, g.th), U2 = [], js = [5, 6, 7, 8, 9, 10, 11, 12];
  seed = g.seed + 99;
  for (let k = 0; k < g.n; k++) {
    const j = js[srnd(js.length)];
    const p = freeNearM(m, 2 + srnd(g.w - 4), 1 + srnd(5), U2);
    const e = spawn(j, g.lv + srnd(3), 2, p[0], p[1], 110 + k, WSJ[j].concat(srnd(3) === 0 ? [41] : []), false);
    e.ai = k % 3 === 0 ? 1 : 0;
    U2.push(e);
  }
  if (g.boss) {
    const b = g.boss, bp = freeNearM(m, b.pos[0], b.pos[1], U2);
    const bs = spawn(b.job, b.lv, 2, bp[0], bp[1], b.id, b.items, true);
    bs.name = NEWN[b.id] || 'Chỉ Huy Địch';
    bs.str += 3; bs.def += 2; bs.skl += 4; bs.ai = 1;
    U2.push(bs);
  }
  const pos = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 10; c++) pos.push([3 + c, g.h - 3 + r]);
  return { m, U: U2, pos };
}

function freeNearM(m, x, y, list) {
  for (let r = 0; r < 9; r++) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        const nx = clamp(x + dx, 0, m.w - 1), ny = clamp(y + dy, 0, m.h - 1);
        const t = m.t[ny * m.w + nx];
        if ((t < 6 || t > 20) && t !== 0 && !list.some(u => u.x === nx && u.y === ny)) {
          return [nx, ny];
        }
      }
    }
  }
  return [x, y];
}

/* ===== GẬY PHÉP: mỗi loại gậy có hiệu ứng riêng (trước đây tất cả đều chỉ hồi 12 máu) =====

const staffHeal = (s, u) => stfDef(s).base + (u ? (u.mag >> 1) : 0); // lượng hồi tăng theo Phép của người dùng

const allyIn = (u, r) => U.filter(o => o.hp > 0 && o.team !== 2 && o !== u && dist(o, u) <= r);
function warpTiles(u) {
  const r = warpRange(u), set = new Set();
  for (let dx = -r; dx <= r; dx++) {
    for (let dy = -r; dy <= r; dy++) {
      if (Math.abs(dx) + Math.abs(dy) > r) continue;

function staffTargets(u, s) {

function staffBrief(s, u) {

const avo = u => {

const hitR = (a, w, d) => clamp(a.skl * 3 + iS(w.id)[1] - avo(d), 5, 95);
const critR = (a, w) => {

};
const dmgR = (a, w, d, crit) => {
  const m = iT(w.id) == 16, p = (m ? a.mag : a.str) + iS(w.id)[0];

const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

const hostile = (a, b) => (a.team == 2) !== (b.team == 2);

function reach(u) {
  const best = new Map([[u.x + ',' + u.y, 0]]), prev = new Map(), q = [[u.x, u.y, 0]];
  while (q.length) {
    q.sort((a, b) => a[2] - b[2]);
    const [x, y, c] = q.shift();
    if (best.get(x + ',' + y) < c) continue;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inb(nx, ny)) continue;
      const co = COST[terr(nx, ny)], nc = c + co;
      if (nc > u.mov) continue;
      const o = at(nx, ny);
      if (o && hostile(o, u)) continue;
      const k = nx + ',' + ny;
      if (best.has(k) && best.get(k) <= nc) continue;
      best.set(k, nc); prev.set(k, x + ',' + y);
      q.push([nx, ny, nc]);
    }
  }
  for (const k of [...best.keys()]) {
    const [x, y] = k.split(',').map(Number), o = at(x, y);
    if (o && o !== u) best.delete(k);
  }
  best.prev = prev;
  return best;
}

function pathOf(rc, x, y) {
  const p = [];
  let k = x + ',' + y;
  while (k) {
    p.unshift(k.split(',').map(Number));
    k = rc.prev.get(k);
  }
  return p;
}

function forecast(a, d) {

const TRIPLE_CRIT_RATE = 6; // % mỗi đòn TRÚNG của quân ta kích hoạt Tam Liên Chí Mạng

function swing(a, w, d) {
  if (!w || a.hp <= 0) return;

  const triple = hit && a.team !== 2 && Math.random() * 100 < TRIPLE_CRIT_RATE;

        log(a.name + ' mất ' + iN(w.id), dl + 200);
        setTimeout(() => AudioSystem.sfx.weaponBreak(), dl + 330);
      }

        setTimeout(() => AudioSystem.sfx.triple(), dl);
        log('{{bolt}} ' + a.name + ' tung <b class="crit-n">Tam Liên Chí Mạng</b>!', dl + 100);
      }
    }

    } else {
      EFF.push({ k: 'slash', x: d.x, y: d.y, ts: now + 90, crit });
      setTimeout(() => AudioSystem.sfx.sword(crit, hit), dl + 90);
    }

    }

      : { x: d.x, y: d.y, t: '-' + dm, c: crit ? '#fbbf24' : '#ef4444', ts: t1, big: crit, crit });

}

function dispHP(u, ts) {
  if (!u.hl) return u.hp;
  let h = u.hb;
  for (const e of u.hl) if (ts >= e.t) h = e.hp;
  if (ts >= u.hl[u.hl.length - 1].t + 200) u.hl = null;
  return h;
}

function expFor(a, d, kill) {
  if (a.team !== 0) return 0;
  if (isSup(a.job)) return 15;
  const df = d.lv - a.lv;
  return kill ? clamp(50 + 5 * df, 30, 100) : Math.max(30 + (df >= 0 ? 5 : 10) * df, 10);
}

function battle(a, d) {
  AD = 0; LD = 0;
  BalanceSystem.triggerSquadAlert(d, U);
  const f = forecast(a, d), w = f.w, dw = f.dw;
  const seq = ['a'];
  if (f.counter) seq.push('d');
  if (f.dbl) seq.push('a');
  else if (f.ddbl) seq.push('d');

  for (const s of seq) {
    if (a.hp <= 0 || d.hp <= 0) break;
    if (s === 'a') swing(a, w, d);
    else swing(d, dw, a);
  }

  LD = AD * 520 + 250;
  if (a.team == 0 && a.hp > 0) gain(a, expFor(a, d, d.hp <= 0));
  else if (d.team == 0 && d.hp > 0 && a.hp <= 0) gain(d, expFor(d, a, true));

  [a, d].forEach(x => {
    if (x.hp <= 0) log(x.name + ' đã gục ngã.', LD);
  });
  LD = 0;
  AchievementSystem.check();
  return AD;
}

function gain(u, e) {
  if (!e) return;
  u.exp += e;
  log(u.name + ' +' + e + ' EXP', LD);
  if (u.exp >= 100) {
    u.exp -= 100;
    u.lv++;
    const g = D.GR[CAT(u.job)], ks = ['str', 'skl', 'spd', 'def', 'mag', 'lck', 'mhp', 'mov'], up = [];
    ks.forEach((k, i) => {
      if (i < 7 && Math.random() * 100 < g[i] + (u.team !== 2 ? (i == 6 ? PLAYER_GROWTH_HP : PLAYER_GROWTH_BONUS) : 0) + (isSilke(u) ? SILKE_GROWTH_BONUS : 0)) {
        u[k] += (k == 'mhp' ? (u.team !== 2 ? 3 : 2) : 1);
        up.push(k);
      }
    });
    // Phe ta luôn nhận ít nhất 2 chỉ số mỗi lần lên cấp (tránh lên cấp trắng tay)
    while (up.length < 2 && u.team !== 2) {
      const pool = ks.slice(0, 7).filter(x => !up.includes(x));
      const k = pool[rnd(pool.length)];
      u[k] += (k == 'mhp' ? 3 : 1); up.push(k);
    }
    const t = performance.now() + LD;
    // Lên cấp = hồi đầy HP ngay lập tức (thanh máu tăng đúng lúc hiện "Lên cấp!")
    let healed = false;
    if (u.hp > 0 && u.hp < u.mhp) {
      if (!u.hl) { u.hl = []; u.hb = u.hp; }
      u.hp = u.mhp;
      u.hl.push({ t, hp: u.hp });
      healed = true;
    }
    log('{{star}} ' + u.name + ' thăng lên cấp ' + (u.lv + 1) + (up.length ? ' (+' + up.join(', ') + ')' : '') + (healed ? ' · hồi đầy HP' : ''), LD);
    FX.push({ x: u.x, y: u.y, t: 'Lên cấp!', c: '#f5cb5c', ts: t, big: true });
    burst(u.x, u.y, '#f5cb5c', 28, t, 85);
    if (healed) {
      FX.push({ x: u.x, y: u.y, t: 'Hồi đầy HP', c: '#34d399', ts: t + 250, big: true, dy: 14 });
      burst(u.x, u.y, '#34d399', 18, t + 250, 55);
    }
    setTimeout(() => AudioSystem.sfx.levelUp(), LD);
  }
}

function freeNear(x, y) {
  for (let r = 0; r < 8; r++) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && COST[terr(nx, ny)] < 9 && !at(nx, ny)) return [nx, ny];
      }
    }
  }
  return [0, 0];
}

function edgeSpawn(job, lv, n, items) {
  const o = [];
  for (let i = 0; i < n; i++) {
    const p = freeNear(rnd(MAP.w), Math.random() < 0.5 ? 0 : MAP.h - 1);
    const u = spawn(job, lv, 2, p[0], p[1], 110 + rnd(10), items);
    u.name = 'Quân Tiếp Viện';
    U.push(u); o.push(u);
  }
  return o;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function aiAct(e) {
  const w = wpn(e);
  if (!w) return;
  const foes = U.filter(o => o.hp > 0 && hostile(o, e));
  if (!foes.length) return;

  const rc = reach(e);
  let best = null, bs = -1e9;
  for (const [k, c] of rc) {
    const [x, y] = k.split(',').map(Number);
    const save = [e.x, e.y];
    e.x = x; e.y = y;
    for (const d of targets(e, x, y)) {
      const f = forecast(e, d);
      let sc = f.dmg * f.hit / 100 + (d.hp <= f.dmg ? 70 : 0) + (d.id == 0 ? 30 : 0) - (f.counter ? f.ddmg * f.dhit / 100 * 0.7 : 0) + AVO[terr(x, y)] / 6;
      if (isSup(d.job)) sc += 20;
      if (sc > bs) { bs = sc; best = { x, y, d }; }
    }
    e.x = save[0]; e.y = save[1];
  }

  const go = async (x, y) => {
    if (x == e.x && y == e.y) return;
    const p = pathOf(rc, x, y);
    e.x = x; e.y = y; CUR = { x, y };
    await moveAnim(e, p);
  };

  if (!best) {
    const near = foes.reduce((m, o) => dist(e, o) < dist(e, m) ? o : m);
    const aggro = e.ai == 1 || dist(e, near) <= e.mov + iS(w.id)[4] + 3;
    if (!aggro) return;
    let bt = null, bd = dist(e, near);
    for (const [k] of rc) {
      const [x, y] = k.split(',').map(Number);
      const d = Math.abs(x - near.x) + Math.abs(y - near.y);
      if (d < bd) { bd = d; bt = { x, y }; }
    }
    if (bt) await go(bt.x, bt.y);
    return;
  }

  await go(best.x, best.y);
  CUR = { x: e.x, y: e.y };
  await wait(140);
  const n = battle(e, best.d);
  await wait(520 * n + 560);
  await runPromotions();
}

function checkEnd() {
  const a = U.find(u => u.id == 0 && u.team == 0);
  if (!a || a.hp <= 0) {
    BUSY = true; over(false); return true;
  }
  if (CHAP.surv) return false;
  const B = (CHAP.boss && CHAP.boss.id) || BOSS[G.ch];
  if (!en().length || (B && !U.some(u => u.id == B && u.team == 2 && u.hp > 0))) {
    BUSY = true; over(true); return true;
  }
  return false;
}

/* Silke ăn theo cấp trung bình của cả đội khi thắng trận (có hoạt cảnh thăng cấp trước khi về sảnh) */
async function silkeCatchUp() {
  const s = G.roster.find(isSilke);
  if (!s) return;
  const mates = G.roster.filter(u => u !== s && u.team === 0);
  if (!mates.length) return;
  const avg = Math.round(mates.reduce((a, u) => a + u.lv, 0) / mates.length);
  const n = avg - s.lv;
  if (n <= 0) return;

  const from = s.lv, before = {};
  Object.keys(STAT_VN).forEach(k => before[k] = s[k]);
  const onMap = s.hp > 0 && U.includes(s);

  for (let k = 0; k < n; k++) {
    if (onMap) CUR = { x: s.x, y: s.y };
    LD = 0;
    gain(s, 100); // mỗi lần = đúng 1 cấp, tung chỉ số như lên cấp bình thường
    await wait(1900); // chờ hiệu ứng + khúc ca thăng cấp phát xong rồi mới lên cấp tiếp
  }

  const ups = Object.keys(STAT_VN).filter(k => s[k] > before[k]).map(k => '+' + (s[k] - before[k]) + ' ' + STAT_VN[k]);
  await dlg([{
    h: '{{star}} Silke Thăng Cấp',
    t: 'Chứng kiến chiến công của đồng đội, Silke tiến bộ vượt bậc: cấp ' + (from + 1) + ' → cấp ' + (s.lv + 1) + ' (theo cấp trung bình của đội).\n' + (ups.length ? ups.join(', ') : ''),

  }]);
}

async function over(win) {
  AudioSystem.playBGM(win ? 'victory' : 'gameover');
  hud();

    await dlg([{ h: 'Thất Bại Trận Địa', t: CHAP.surv ? 'Accor đã ngã xuống trước khi trời sáng…' : 'Hoàng tử Wood Accor đã ngã xuống… ' + S[19] }], 'Chơi lại chương');

    startChap(G.ch);

  try { await silkeCatchUp(); } catch (e) { console.error(e); }

  const rw = 1500 + Math.min(G.ch, 12) * 500 + (CHAP.reward || 0);
  G.gold += rw;
  const gf = CHAP.gift;
  if (gf) G.stash.push({ id: gf, u: iS(gf)[6] });

  await dlg([{ h: '{{trophy}} Khải Hoàn Chiến Thắng!', t: 'Phần thưởng vương quốc: ' + rw + ' vàng' + (gf ? '\nNhận báu vật: ' + iN(gf) : '') + '\nHoàn thành sau ' + TURN + ' lượt chiến đấu.' }]);

  if (G.ch == 9) {
    await dlg([
      { h: 'Hồi Kết Sofia', t: S[299] },
      { h: 'Mở Rộng Thế Giới', t: 'Bạo chúa Desai đã đền tội, nhưng hòa bình chưa trọn vẹn!\n\n4 Tuyến cốt truyện phân nhánh hoàn chỉnh, chế độ Đấu Trường Đỉnh Phong và Thử Thách Sinh Tồn đã mở!' }
    ]);
  }

  if (CHAP.end) {
    if (CHAP.routeKey) {
      G.endings = G.endings || [];
      if (!G.endings.includes(CHAP.routeKey)) G.endings.push(CHAP.routeKey);
    }
    await dlg([{ h: 'Biên Niên Sử', t: CHAP.end }]);
  }

  AchievementSystem.check();
  BUSY = false;
  G.avail = G.avail || [0];
  let nx = NEXTC(G.ch)[0];

  if (G.ch == 10) {
    const c = await ask('{{scales}} Ngã Rẽ Định Mệnh',
      'Tàn quân Desai đã tan, nhưng hai con đường mở ra trước mắt Accor:\n\n• Aaron báo có một con rồng cổ đại thức tỉnh — đi theo con đường Hoàng gia.\n• Một lá thư bí mật của Malak mời Accor xuống thành phố ngầm — con đường Bóng tối.\n\n(Cả hai nhánh đều chơi được; nhánh còn lại sẽ mở sau khi hoàn thành nhánh này.)',
      ['{{swords}} Truy lùng Rồng cùng Aaron (Vương Đạo)', '{{moon}} Nhận lời mời bí mật của Malak (Giao Ước Hắc Ám)']);
    nx = c ? 13 : 11;
  }

  if (nx == null) {
    const o = { 12: 13, 15: 16, 16: 17 }[G.ch];
    if (o != null && !G.avail.includes(o)) G.avail.push(o);
    nx = G.ch;
  } else {
    if (!G.avail.includes(nx)) G.avail.push(nx);
  }

  G.ch = nx;
  StorageSystem.save();
  camp();
}

const ARENA_MAX = 3; // số lượt Đấu Trường tối đa mỗi chương
function arena() {
  const us = G.roster;
  let h = '<h3>{{arena}} Đấu Trường</h3>' +
    '<div style="font-size:12px;color:var(--tx-sec);margin-bottom:8px;">Thử sức nhận thưởng. Tối đa ' + ARENA_MAX + ' lượt mỗi chương (có thu phí tham gia).</div>' +
    '<div class="box-list">' +
    us.map(x => {
      const fee = 150 + x.lv * 60;
      const count = x.arenaFights || 0;
      const hasWpn = !!wpn(x);
      const canPay = G.gold >= fee;
      const canFight = count < ARENA_MAX && hasWpn && canPay;
      let statusText = '';
      if (!hasWpn) statusText = 'Chưa có vũ khí';
      else if (count >= ARENA_MAX) statusText = 'Hết lượt (' + ARENA_MAX + '/' + ARENA_MAX + ')';
      else if (!canPay) statusText = 'Thiếu vàng (' + fee + 'v)';
      else statusText = 'Vào đấu (' + fee + 'v) · Lượt ' + (count + 1) + '/' + ARENA_MAX;
      return '<button data-u="' + x.id + '" class="btn" ' + (canFight ? '' : 'disabled') + '>' +
        '<span>' + x.name + ' · Cấp ' + (x.lv + 1) + '</span>' +
        '<span style="color:' + (canFight ? 'var(--gold-deep)' : 'var(--tx-mut)') + ';font-weight:700;">' + statusText + '</span>' +
      '</button>';
    }).join('') +
    '</div><button id="x" class="btn">Quay lại</button>';
  openBox(h);

  $('#box').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    const p = G.roster.find(x => x.id == +b.dataset.u);
    if (!p || !wpn(p)) return;
    const fee = 150 + p.lv * 60;
    if (G.gold < fee) return;
    if ((p.arenaFights || 0) >= ARENA_MAX) return;

    // Trừ phí tham gia và cộng lượt đấu
    G.gold -= fee;
    p.arenaFights = (p.arenaFights || 0) + 1;

    const j = [5, 9, 8, 7, 10][rnd(5)], ws = { 5: [1], 9: [16], 8: [10], 7: [22], 10: [31] };
    const lv = Math.max(1, p.lv); // địch cùng cấp (trước đây hơn 1 cấp)
    const a = JSON.parse(JSON.stringify(p)); a.mhp += Math.ceil(a.mhp * 0.25); a.def += 1; a.hp = a.mhp; a.x = 1; a.y = 1; a.team = 0;
    const e = spawn(j, lv, 2, 1, 2, 60, [ws[j][0]]); e.name = 'Võ Sĩ Đấu Trường'; e.mhp = Math.max(5, Math.floor(e.mhp * 0.85)); e.str = Math.max(0, e.str - 1); e.hp = e.mhp;
    const save = { U, MAP };
    MAP = { w: 4, h: 4, t: new Array(16).fill(25) };
    U = [a, e];
    const near = iS(wpn(a).id)[4] >= 2 ? 2 : 1;
    e.x = 1; e.y = 1 + near;

    let r = 0; LOG = [];
    while (a.hp > 0 && e.hp > 0 && r++ < 12) {
      battle(a, e);
      if (a.hp > 0 && e.hp > 0) battle(e, a);
    }

    const win = a.hp > 0 && e.hp > 0 ? a.hp >= e.hp : a.hp > 0;
    const prize = win ? Math.floor(fee * 1.4) : 0; // trước là x1.7
    let exp = win ? Math.max(30, Math.floor(80 / (1 + 0.3 * (p.arenaFights - 1)))) : 10; // thắng nhiều EXP hơn, thua vẫn có EXP an ủi

    if (win) {
      G.gold += prize;
      gain(p, exp);
      G.stats = G.stats || {};
      G.stats.arenaWins = (G.stats.arenaWins || 0) + 1;
      AchievementSystem.check();
    } else {
      gain(p, exp); // không còn trừ HP vĩnh viễn khi thua
    }
    U = save.U; MAP = save.MAP;
    openBox(
      '<h3>' + (win ? '{{trophy}} Thắng Đấu Trường!' : '{{skull}} Thất Bại Đấu Trường') + '</h3>' +
      '<p>' + p.name + ' so tài cùng ' + e.name + ' (Cấp ' + (lv + 1) + ').</p>' +
      '<p>' + (win ? 'Thưởng: +' + prize + ' Vàng (lãi ' + (prize - fee) + 'v), +' + exp + ' Kinh nghiệm!' : 'Bị đánh bại! Mất ' + fee + ' Vàng tiền phí, nhưng học được +' + exp + ' Kinh nghiệm. Sinh lực không bị ảnh hưởng.') + '</p>' +
      '<button id="x" class="btn pri">Tiếp tục</button>'
    );
    $('#x').onclick = () => runPromotions().then(() => arena());
  });
  $('#x').onclick = camp;
}

function saveCodeModal() {
  const code = StorageSystem.exportCode();
  const h = '<h3>{{tablet}} Mã Lưu Trữ</h3>' +
    '<p style="font-size:12px;color:var(--tx-sec);margin-bottom:8px;">Sao lưu tiến trình để chơi tiếp trên mọi thiết bị.</p>' +

    '<div style="display:flex;gap:8px;margin:8px 0 14px;">' +
      '<button id="copyCode" class="btn pri" style="flex:1;">{{tablet}} Sao Chép</button>' +
      '<button id="downloadFile" class="btn" style="flex:1;">{{save}} Tải Tệp</button>' +
    '</div>' +
    '<hr style="border:none;border-top:1px solid var(--pn-border);margin:12px 0;">' +
    '<label style="display:block;font-weight:700;margin-bottom:4px;font-size:12px;">Nhập mã lưu:</label>' +
    '<textarea id="codeImport" placeholder="Dán mã HA1-V2-... vào đây" style="width:100%;height:60px;border-radius:8px;border:1px solid var(--pn-border);padding:8px;font-family:inherit;font-size:12px;resize:none;word-break:break-all;"></textarea>' +
    '<div style="display:flex;gap:8px;margin-top:8px;">' +
      '<button id="applyCode" class="btn pri" style="flex:1;">{{import}} Nạp Mã</button>' +
      '<button id="openFile" class="btn" style="flex:1;">{{save}} Nạp Từ Tệp</button>' +
      '<button id="x" class="btn">Đóng</button>' +
    '</div>' +
    '<input type="file" id="codeFile" style="display:none;">' +
    '<div id="codeMsg" style="font-size:12px;color:var(--tx-sec);margin-top:8px;min-height:16px;"></div>';
  openBox(h);
  const say = s => { const m = $('#codeMsg'); if (m) m.textContent = s; };

  // Sao chép: dùng Clipboard API, nếu trình duyệt không cho (http, webview, iOS...) thì dùng execCommand
  $('#copyCode').onclick = () => {
    const el = $('#codeExport');
    if (!el.value) { say('Chưa có dữ liệu để sao chép.'); return; }
    const fallbackCopy = () => {
      let ok = false;
      try {
        el.removeAttribute('readonly');
        el.focus(); el.select(); el.setSelectionRange(0, el.value.length);
        ok = document.execCommand('copy');
      } catch (e) {}
      el.setAttribute('readonly', '');
      return ok;
    };
    const done = ok => {
      const b = $('#copyCode'); if (!b) return;
      if (ok) {
        b.innerHTML = '{{check}} Đã sao chép!';
        setTimeout(() => { if ($('#copyCode')) $('#copyCode').innerHTML = '{{tablet}} Sao Chép'; }, 2000);
        say('');
      } else {
        el.focus(); el.select();
        say('Máy không cho tự sao chép. Mã đã được chọn sẵn, hãy giữ vào ô mã rồi bấm Sao chép/Copy.');
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(el.value).then(() => done(true), () => done(fallbackCopy()));
    } else {
      done(fallbackCopy());
    }
  };

  // Tải tệp: gắn <a> vào trang, và chỉ thu hồi URL sau khi trình duyệt đã bắt đầu tải
  $('#downloadFile').onclick = () => {
    const text = $('#codeExport').value;
    if (!text) { say('Chưa có dữ liệu để tải. Hãy bắt đầu hoặc tiếp tục một ván chơi trước.'); return; }
    try {
      const blob = new Blob([text], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hoa_an_1_save.ha1';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
